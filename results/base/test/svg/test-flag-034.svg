<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="200" fill="white"/>

  <!-- Horizontal stripes (8 total) -->
  <rect x="0" y="0" width="300" height="50" fill="#1E90FF"/>
  <rect x="0" y="50" width="300" height="50" fill="#FFD700"/>
  <rect x="0" y="100" width="300" height="50" fill="#FF6347"/>
  <rect x="0" y="150" width="300" height="50" fill="#32CD32"/>
  <rect x="0" y="200" width="300" height="50" fill="#FFA500"/>
  <rect x="0" y="250" width="300" height="50" fill="#00CED1"/>
  <rect x="0" y="300" width="300" height="50" fill="#8B4513"/>
  <rect x="0" y="350" width="300" height="50" fill="#FFFF00"/>

  <!-- Stars (4 total, evenly distributed across the flag) -->
  <!-- Star 1: Top stripe -->
  <polygon points="150,10 155,15 160,10 165,15 160,20 155,25 150,20" fill="#FFFFFF"/>
  
  <!-- Star 2: Second stripe from top -->
  <polygon points="150,60 155,75 160,60 165,75 160,80 155,85 150,80" fill="#FFFFFF"/>
  
  <!-- Star 3: Third stripe from top -->
  <polygon points="150,110 155,125 160,110 165,125 160,130 155,135 150,130" fill="#FFFFFF"/>
  
  <!-- Star 4: Bottom stripe -->
  <polygon points="150,300 155,315 160,300 165,315 160,320 155,325 150,320" fill="#FFFFFF"/>
</svg>