<svg width="200" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Building outline -->
  <rect x="50" y="40" width="100" height="220" fill="#8B7355"/>
  
  <!-- Floor 1 (ground floor) - no windows -->
  <rect x="60" y="90" width="80" height="40" fill="#A09080"/>
  
  <!-- Floor 2 -->
  <rect x="60" y="130" width="80" height="40" fill="#A09080"/>
  
  <!-- Floor 3 -->
  <rect x="60" y="170" width="80" height="40" fill="#A09080"/>
  
  <!-- Floor 4 -->
  <rect x="60" y="210" width="80" height="40" fill="#A09080"/>
  
  <!-- Floor 5 (top floor) - exactly 1 window -->
  <rect x="100" y="210" width="40" height="40" fill="#D4C4B4"/>
</svg>