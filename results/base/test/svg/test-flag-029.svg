<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="200" fill="white"/>
  
  <!-- 9 Horizontal Stripes -->
  <rect x="0" y="0" width="300" height="20" fill="#006400"/>
  <rect x="0" y="25" width="300" height="20" fill="#009600"/>
  <rect x="0" y="50" width="300" height="20" fill="#008C00"/>
  <rect x="0" y="75" width="300" height="20" fill="#008000"/>
  <rect x="0" y="100" width="300" height="20" fill="#006400"/>
  <rect x="0" y="125" width="300" height="20" fill="#009600"/>
  <rect x="0" y="150" width="300" height="20" fill="#008C00"/>
  <rect x="0" y="175" width="300" height="20" fill="#008000"/>
  <rect x="0" y="200" width="300" height="20" fill="#006400"/>
  
  <!-- 7 Stars -->
  <g fill="#FFD700">
    <polygon points="10,10 20,20 30,10 20,0 10,10"/>
    <polygon points="110,10 120,20 130,10 120,0 110,10"/>
    <polygon points="210,10 220,20 230,10 220,0 210,10"/>
    <polygon points="310,10 320,20 330,10 320,0 310,10"/>
    <polygon points="410,10 420,20 430,10 420,0 410,10"/>
    <polygon points="510,10 520,20 530,10 520,0 510,10"/>
  </g>
</svg>