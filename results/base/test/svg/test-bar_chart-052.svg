<svg width="400" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Define styles -->
  <defs>
    <style>
      .bar { fill: blue; }
      .tall-bar { fill: red; }
    </style>
  </defs>

  <!-- Background (optional, for clarity) -->
  <rect x="0" y="0" width="400" height="200" fill="white"/>

  <!-- Bar positions and heights (assuming max height is 100 units) -->
  <!-- Bar 1: height 40 -->
  <rect x="50" y="60" width="80" height="40" class="bar"/>
  
  <!-- Bar 2: height 100 (tallest, red) -->
  <rect x="130" y="0" width="80" height="100" class="tall-bar"/>
  
  <!-- Bar 3: height 70 -->
  <rect x="210" y="30" width="80" height="70" class="bar"/>
  
  <!-- Bar 4: height 50 -->
  <rect x="290" y="50" width="80" height="50" class="bar"/>
  
  <!-- Bar 5: height 30 -->
  <rect x="370" y="70" width="80" height="30" class="bar"/>
</svg>