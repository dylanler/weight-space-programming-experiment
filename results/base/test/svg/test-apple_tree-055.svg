<svg width="200" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .tree { fill: #4CAF50; }
      .apple { fill: #FF5722; }
      .stem { stroke: #388E3C; stroke-width: 2; }
      .leaf { fill: #66BB6A; }
    </style>
  </defs>
  
  <!-- Tree trunk -->
  <rect x="100" y="100" width="10" height="150" class="tree"/>
  
  <!-- Main tree body (rounded rectangle) -->
  <path d="M90 100 Q 100 50 110 100 L 110 150 Q 100 180 90 150 Z" class="tree"/>
  
  <!-- Left branch -->
  <line x1="90" y1="100" x2="70" y2="150" class="stem"/>
  <circle cx="70" cy="150" r="15" class="tree"/>
  <ellipse cx="70" cy="150" rx="10" ry="5" transform="rotate(-45 70 150)" class="leaf"/>
  
  <!-- Right branch -->
  <line x1="110" y1="100" x2="130" y2="150" class="stem"/>
  <circle cx="130" cy="150" r="15" class="tree"/>
  <ellipse cx="130" cy="150" rx="10" ry="5" transform="rotate(45 130 150)" class="leaf"/>
  
  <!-- Apples -->
  <circle cx="95" cy="110" r="6" class="apple"/>
  <circle cx="105" cy="110" r="6" class="apple"/>
</svg>