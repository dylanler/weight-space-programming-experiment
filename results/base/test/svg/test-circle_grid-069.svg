<svg width="200" height="150" xmlns="http://www.w3.org/2000/svg">
  <!-- Define grid parameters -->
  <!-- 6 rows, 4 columns -->
  <!-- Cell size: (200 - 8) / 4 = 47.5 per column, (150 - 8) / 6 = 23.33 per row -->
  
  <!-- Row 1 -->
  <circle cx="20" cy="10" r="8" fill="#e74c3c"/>
  <circle cx="70" cy="10" r="8" fill="#3498db"/>
  <circle cx="120" cy="10" r="8" fill="#f1c40f"/>
  <circle cx="170" cy="10" r="8" fill="#9b59b6"/>
  
  <!-- Row 2 -->
  <circle cx="20" cy="40" r="8" fill="#e74c3c"/>
  <circle cx="70" cy="40" r="8" fill="#3498db"/>
  <circle cx="120" cy="40" r="8" fill="#f1c40f"/>
  <circle cx="170" cy="40" r="8" fill="#9b59b6"/>
  
  <!-- Row 3 -->
  <circle cx="20" cy="80" r="8" fill="#e74c3c"/>
  <circle cx="70" cy="80" r="8" fill="#3498db"/>
  <circle cx="120" cy="80" r="8" fill="#f1c40f"/>
  <circle cx="170" cy="80" r="8" fill="#9b59b6"/>
  
  <!-- Row 4 -->
  <circle cx="20" cy="120" r="8" fill="#e74c3c"/>
  <circle cx="70" cy="120" r="8" fill="#3498db"/>
  <circle cx="120" cy="120" r="8" fill="#f1c40f"/>
  <circle cx="170" cy="120" r="8" fill="#9b59b6"/>
  
  <!-- Row 5 -->
  <circle cx="20" cy="160" r="8" fill="#e74c3c"/>
  <circle cx="70" cy="160" r="8" fill="#3498db"/>
  <circle cx="120" cy="160" r="8" fill="#f1c40f"/>
  <circle cx="170" cy="160" r="8" fill="#9b59b6"/>
  
  <!-- Row 6 -->
  <circle cx="20" cy="200" r="8" fill="#e74c3c"/>
  <circle cx="70" cy="200" r="8" fill="#3498db"/>
  <circle cx="120" cy="200" r="8" fill="#f1c40f"/>
  <circle cx="170" cy="200" r="8" fill="#9b59b6"/>
</svg>