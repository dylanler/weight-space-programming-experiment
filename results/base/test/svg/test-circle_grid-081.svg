<svg width="200" height="150" xmlns="http://www.w3.org/2000/svg">
  <!-- Define grid parameters -->
  <!-- 6 rows, 3 columns -->
  <!-- Row height: 25px, Column width: 40px -->
  
  <!-- Row 1 -->
  <circle cx="20" cy="30" r="8" fill="white"/>
  <circle cx="60" cy="30" r="8" fill="white"/>
  <circle cx="100" cy="30" r="8" fill="white"/>
  
  <!-- Row 2 -->
  <circle cx="20" cy="60" r="8" fill="white"/>
  <circle cx="60" cy="60" r="8" fill="white"/>
  <circle cx="100" cy="60" r="8" fill="white"/>
  
  <!-- Row 3 -->
  <circle cx="20" cy="90" r="8" fill="white"/>
  <circle cx="60" cy="90" r="8" fill="white"/>
  <circle cx="100" cy="90" r="8" fill="white"/>
  
  <!-- Row 4 -->
  <circle cx="20" cy="120" r="8" fill="white"/>
  <circle cx="60" cy="120" r="8" fill="white"/>
  <circle cx="100" cy="120" r="8" fill="white"/>
  
  <!-- Row 5 -->
  <circle cx="20" cy="150" r="8" fill="white"/>
  <circle cx="60" cy="150" r="8" fill="white"/>
  <circle cx="100" cy="150" r="8" fill="white"/>
  
  <!-- Row 6 -->
  <circle cx="20" cy="180" r="8" fill="white"/>
  <circle cx="60" cy="180" r="8" fill="white"/>
  <circle cx="100" cy="180" r="8" fill="white"/>
</svg>