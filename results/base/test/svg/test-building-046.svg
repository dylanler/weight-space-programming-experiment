<svg width="300" height="450" xmlns="http://www.w3.org/2000/svg">
  <!-- Building outline -->
  <rect x="100" y="80" width="100" height="370" fill="#a8c6e9"/>
  
  <!-- Floor lines (horizontal dividers) -->
  <line x1="100" y1="120" x2="200" y2="120" stroke="#dceefb" stroke-width="2"/>
  <line x1="100" y1="160" x2="200" y2="160" stroke="#dceefb" stroke-width="2"/>
  <line x1="100" y1="200" x2="200" y2="200" stroke="#dceefb" stroke-width="2"/>
  <line x1="100" y1="240" x2="200" y2="240" stroke="#dceefb" stroke-width="2"/>
  <line x1="100" y1="280" x2="200" y2="280" stroke="#dceefb" stroke-width="2"/>
  
  <!-- Windows on each floor (14 total, 5 floors = 2.8 per floor, but we'll do 2 full + partial) -->
  <!-- Floor 1: 2 windows left, 2 right, 2 middle -->
  <rect x="110" y="125" width="20" height="30" fill="#f0f4f8"/>
  <rect x="130" y="125" width="20" height="30" fill="#f0f4f8"/>
  <rect x="100" y="135" width="20" height="30" fill="#f0f4f8"/>
  <rect x="120" y="135" width="20" height="30" fill="#f0f4f8"/>
  
  <!-- Floor 2: 2 windows left, 2 right, 2 middle -->
  <rect x="110" y="160" width="20" height="30" fill="#f0f4f8"/>
  <rect x="130" y="160" width="20" height="30" fill="#f0f4f8"/>
  <rect x="100" y="170" width="20" height="30" fill="#f0f4f8"/>
  <rect x="120" y="170" width="20" height="30" fill="#f0f4f8"/>
  
  <!-- Floor 3: 2 windows left, 2 right, 2 middle -->
  <rect x="110" y="200" width="20" height="30" fill="#f0f4f8"/>
  <rect x="130" y="200" width="20" height="30" fill="#f0f4f8"/>
  <rect x="100" y="210" width="20" height="30" fill="#f0f4f8"/>
  <rect x="120" y="210" width="20" height="30" fill="#f0f4f8"/>
  
  <!-- Floor 4: 2 windows left, 2 right, 2 middle -->
  <rect x="110" y="240" width="20" height="30" fill="#f0f4f8"/>
  <rect x="130" y="240" width="20" height="30" fill="#f0f4f8"/>
  <rect x="100" y="250" width="20" height="30" fill="#f0f4f8"/>
  <rect x="120" y="250" width="20" height="30" fill="#f0f4f8"/>
  
  <!-- Floor 5: 2 windows left, 2 right, 2 middle -->
  <rect x="110" y="280" width="20" height="30" fill="#f0f4f8"/>
  <rect x="130" y="280" width="20" height="30" fill="#f0f4f8"/>
  <rect x="100" y="290" width="20" height="30" fill="#f0f4f8"/>
  <rect x="120" y="290" width="20" height="30" fill="#f0f4f8"/>
</svg>