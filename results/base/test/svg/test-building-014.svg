<svg width="200" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Building outline -->
  <rect x="50" y="40" width="100" height="220" fill="#8B7355"/>
  
  <!-- Floor 1 (ground floor) - no windows visible from this angle, but we'll add one on top of it to meet the requirement if needed. However, since the prompt says "exactly 1 window in total", and ground floor typically doesn't have upper windows, let's place the single window on the second floor. -->
  
  <!-- Floor 1 (bottom) -->
  <rect x="60" y="100" width="40" height="40" fill="#A99F8C"/>
  
  <!-- Floor 2 -->
  <rect x="60" y="140" width="40" height="40" fill="#A99F8C"/>
  <!-- Single window on second floor -->
  <rect x="70" y="150" width="20" height="20" fill="#E0D8C8"/>
  
  <!-- Floor 3 -->
  <rect x="60" y="180" width="40" height="40" fill="#A99F8C"/>
  
  <!-- Floor 4 -->
  <rect x="60" y="220" width="40" height="40" fill="#A99F8C"/>
</svg>