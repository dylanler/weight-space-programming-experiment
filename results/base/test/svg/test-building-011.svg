<svg width="300" height="450" viewBox="0 0 300 450" xmlns="http://www.w3.org/2000/svg">
  <!-- Building outline -->
  <rect x="100" y="60" width="100" height="330" fill="#8B7355"/>
  
  <!-- Floors (8 floors total) -->
  <!-- Floor 1 -->
  <rect x="100" y="90" width="100" height="40" fill="#AABCBF"/>
  <!-- Floor 2 -->
  <rect x="100" y="130" width="100" height="40" fill="#AABCBF"/>
  <!-- Floor 3 -->
  <rect x="100" y="170" width="100" height="40" fill="#AABCBF"/>
  <!-- Floor 4 -->
  <rect x="100" y="210" width="100" height="40" fill="#AABCBF"/>
  <!-- Floor 5 -->
  <rect x="100" y="250" width="100" height="40" fill="#AABCBF"/>
  
  <!-- Windows on each floor (5 windows per floor = 40 total, but we need exactly 5 in total) -->
  <!-- Let's place 5 windows across all floors: 1 window per floor for simplicity and symmetry -->
  <!-- Floor 1 Window -->
  <rect x="120" y="95" width="20" height="35" fill="#E0C090"/>
  <!-- Floor 2 Window -->
  <rect x="120" y="135" width="20" height="35" fill="#E0C090"/>
  <!-- Floor 3 Window -->
  <rect x="120" y="175" width="20" height="35" fill="#E0C090"/>
  <!-- Floor 4 Window -->
  <rect x="120" y="215" width="20" height="35" fill="#E0C090"/>
  <!-- Floor 5 Window -->
  <rect x="120" y="255" width="20" height="35" fill="#E0C090"/>
  
  <!-- Note: This creates only 5 windows total as required -->
</svg>