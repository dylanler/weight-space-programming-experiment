<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="200" fill="white"/>

  <!-- Top stripe (blue) -->
  <rect x="0" y="0" width="300" height="60" fill="#0055A4"/>

  <!-- Second stripe (red) -->
  <rect x="0" y="60" width="300" height="60" fill="#B22234"/>

  <!-- Third stripe (yellow) -->
  <rect x="0" y="120" width="300" height="60" fill="#FFCC00"/>

  <!-- Bottom stripe (green) -->
  <rect x="0" y="180" width="300" height="60" fill="#009E49"/>

  <!-- Stars -->
  <circle cx="100" cy="30" r="5" fill="#FFFFFF"/>
  <circle cx="200" cy="30" r="5" fill="#FFFFFF"/>
  <circle cx="300" cy="30" r="5" fill="#FFFFFF"/>
</svg>