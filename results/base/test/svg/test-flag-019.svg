<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="white"/>

  <!-- Horizontal stripes (9 total) -->
  <!-- Stripe 1: top -->
  <rect x="0" y="0" width="600" height="50" fill="#FFD700"/>
  <!-- Stripe 2 -->
  <rect x="0" y="50" width="600" height="50" fill="#87CEEB"/>
  <!-- Stripe 3 -->
  <rect x="0" y="100" width="600" height="50" fill="#8B4513"/>
  <!-- Stripe 4 -->
  <rect x="0" y="150" width="600" height="50" fill="#FFA500"/>
  <!-- Stripe 5 -->
  <rect x="0" y="200" width="600" height="50" fill="#ADD8E6"/>
  <!-- Stripe 6 -->
  <rect x="0" y="250" width="600" height="50" fill="#87CEEB"/>
  <!-- Stripe 7 -->
  <rect x="0" y="300" width="600" height="50" fill="#FFD700"/>
  <!-- Stripe 8 -->
  <rect x="0" y="350" width="600" height="50" fill="#8B4513"/>
  <!-- Stripe 9: bottom -->
  <rect x="0" y="400" width="600" height="50" fill="#FFA500"/>

  <!-- Stars (7 total, evenly distributed across the flag) -->
  <!-- Star 1: top-left area -->
  <polygon points="100,20 110,30 120,20 120,10 110,20 100,30" fill="#FFD700"/>
  <!-- Star 2: top-right area -->
  <polygon points="500,20 510,30 520,20 520,10 510,20 500,30" fill="#FFD700"/>
  <!-- Star 3: middle-left area -->
  <polygon points="100,250 110,260 120,250 120,240 110,250 100,260" fill="#FFD700"/>
  <!-- Star 4: middle-right area -->
  <polygon points="500,250 510,260 520,250 520,240 510,250 500,260" fill="#FFD700"/>
  <!-- Star 5: lower-left area -->
  <polygon points="100,350 110,360 120,350 120,340 110,350 100,360" fill="#FFD700"/>
  <!-- Star 6: lower-right area -->
  <polygon points="500,350 510,360 520,350 520,340 510,350 500,360" fill="#FFD700"/>
  <!-- Star 7: bottom-center area -->
  <polygon points="300,350 310,360 320,350 320,340 310,350 300,360" fill="#FFD700"/>
</svg>