<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Define grid parameters -->
  <!-- 4 rows, 6 columns, total 24 circles -->
  <!-- Cell size: 200 / 24 ≈ 8.333 px -->
  
  <!-- Row 1 -->
  <circle cx="20" cy="20" r="6" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="40" cy="20" r="6" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="60" cy="20" r="6" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="80" cy="20" r="6" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="100" cy="20" r="6" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="120" cy="20" r="6" fill="white" stroke="black" stroke-width="1"/>
  
  <!-- Row 2 -->
  <circle cx="20" cy="40" r="6" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="40" cy="40" r="6" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="60" cy="40" r="6" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="80" cy="40" r="6" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="100" cy="40" r="6" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="120" cy="40" r="6" fill="white" stroke="black" stroke-width="1"/>
  
  <!-- Row 3 -->
  <circle cx="20" cy="60" r="6" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="40" cy="60" r="6" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="60" cy="60" r="6" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="80" cy="60" r="6" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="100" cy="60" r="6" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="120" cy="60" r="6" fill="white" stroke="black" stroke-width="1"/>
  
  <!-- Row 4 -->
  <circle cx="20" cy="80" r="6" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="40" cy="80" r="6" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="60" cy="80" r="6" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="80" cy="80" r="6" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="100" cy="80" r="6" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="120" cy="80" r="6" fill="white" stroke="black" stroke-width="1"/>
</svg>