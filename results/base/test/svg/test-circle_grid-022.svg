<svg width="200" height="150" xmlns="http://www.w3.org/2000/svg">
  <!-- Define grid parameters -->
  <!-- 4 rows, 6 columns -->
  <!-- Cell size: 25x25 (total 100x100) -->
  
  <!-- Row 1 -->
  <circle cx="25" cy="75" r="8" fill="white"/>
  <circle cx="50" cy="75" r="8" fill="white"/>
  <circle cx="75" cy="75" r="8" fill="white"/>
  <circle cx="100" cy="75" r="8" fill="white"/>
  <circle cx="125" cy="75" r="8" fill="white"/>
  <circle cx="150" cy="75" r="8" fill="white"/>
  
  <!-- Row 2 -->
  <circle cx="25" cy="100" r="8" fill="white"/>
  <circle cx="50" cy="100" r="8" fill="white"/>
  <circle cx="75" cy="100" r="8" fill="white"/>
  <circle cx="100" cy="100" r="8" fill="white"/>
  <circle cx="125" cy="100" r="8" fill="white"/>
  <circle cx="150" cy="100" r="8" fill="white"/>
  
  <!-- Row 3 -->
  <circle cx="25" cy="125" r="8" fill="white"/>
  <circle cx="50" cy="125" r="8" fill="white"/>
  <circle cx="75" cy="125" r="8" fill="white"/>
  <circle cx="100" cy="125" r="8" fill="white"/>
  <circle cx="125" cy="125" r="8" fill="white"/>
  <circle cx="150" cy="125" r="8" fill="white"/>
  
  <!-- Row 4 -->
  <circle cx="25" cy="150" r="8" fill="white"/>
  <circle cx="50" cy="150" r="8" fill="white"/>
  <circle cx="75" cy="150" r="8" fill="white"/>
  <circle cx="100" cy="150" r="8" fill="white"/>
  <circle cx="125" cy="150" r="8" fill="white"/>
  <circle cx="150" cy="150" r="8" fill="white"/>
</svg>