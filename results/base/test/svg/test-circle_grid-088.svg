<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- 3 rows, 4 columns -->
  <!-- Row 1 -->
  <circle cx="50" cy="100" r="10" fill="blue"/>
  <circle cx="100" cy="100" r="10" fill="green"/>
  <circle cx="150" cy="100" r="10" fill="red"/>
  <circle cx="200" cy="100" r="10" fill="yellow"/>
  
  <!-- Row 2 -->
  <circle cx="50" cy="150" r="10" fill="purple"/>
  <circle cx="100" cy="150" r="10" fill="orange"/>
  <circle cx="150" cy="150" r="10" fill="pink"/>
  <circle cx="200" cy="150" r="10" fill="cyan"/>
  
  <!-- Row 3 -->
  <circle cx="50" cy="200" r="10" fill="brown"/>
  <circle cx="100" cy="200" r="10" fill="maroon"/>
  <circle cx="150" cy="200" r="10" fill="navy"/>
  <circle cx="200" cy="200" r="10" fill="teal"/>
</svg>