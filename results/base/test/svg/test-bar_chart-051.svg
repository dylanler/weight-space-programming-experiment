<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="white"/>
  
  <!-- Chart margins -->
  <rect x="60" y="60" width="280" height="180" fill="white"/>
  
  <!-- Grid lines (optional for clarity) -->
  <line x1="60" y1="120" x2="340" y2="120" stroke="black" stroke-width="1"/>
  <line x1="60" y1="180" x2="340" y2="180" stroke="black" stroke-width="1"/>
  
  <!-- Bar 1: Tallest, Red -->
  <rect x="60" y="120" width="100" height="60" fill="red"/>
  
  <!-- Bar 2: Medium height, Blue -->
  <rect x="160" y="120" width="80" height="40" fill="blue"/>
  
  <!-- Bar 3: Shortest, Blue -->
  <rect x="260" y="120" width="60" height="20" fill="blue"/>
  
  <!-- X-axis labels -->
  <text x="60" y="200" text-anchor="middle" font-size="12">1</text>
  <text x="160" y="200" text-anchor="middle" font-size="12">2</text>
  <text x="260" y="200" text-anchor="middle" font-size="12">3</text>
  
  <!-- Y-axis label -->
  <text x="20" y="180" text-anchor="middle" font-size="12" transform="rotate(-90 20 180)">Value</text>
</svg>