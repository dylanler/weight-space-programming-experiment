<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Define styles -->
  <defs>
    <style>
      .bar { fill: blue; }
      .tall-bar { fill: red; }
    </style>
  </defs>
  
  <!-- Chart margins and axes -->
  <rect x="60" y="60" width="280" height="180" fill="white" stroke="black" stroke-width="1"/>
  
  <!-- X-axis ticks and labels -->
  <line x1="60" y1="220" x2="60" y2="240" stroke="black" stroke-width="1"/>
  <line x1="120" y1="220" x2="120" y2="240" stroke="black" stroke-width="1"/>
  <line x1="180" y1="220" x2="180" y2="240" stroke="black" stroke-width="1"/>
  <line x1="240" y1="220" x2="240" y2="240" stroke="black" stroke-width="1"/>
  <line x1="300" y1="220" x2="300" y2="240" stroke="black" stroke-width="1"/>
  
  <!-- X-axis labels -->
  <text x="60" y="255" text-anchor="middle" font-size="12">1</text>
  <text x="120" y="255" text-anchor="middle" font-size="12">2</text>
  <text x="180" y="255" text-anchor="middle" font-size="12">3</text>
  <text x="240" y="255" text-anchor="middle" font-size="12">4</text>
  <text x="300" y="255" text-anchor="middle" font-size="12">5</text>
  
  <!-- Y-axis -->
  <line x1="60" y1="60" x2="60" y2="240" stroke="black" stroke-width="1"/>
  <text x="50" y="70" text-anchor="middle" font-size="12" transform="rotate(-90, 50, 70)">10</text>
  <text x="50" y="140" text-anchor="middle" font-size="12" transform="rotate(-90, 50, 140)">20</text>
  <text x="50" y="210" text-anchor="middle" font-size="12" transform="rotate(-90, 50, 210)">30</text>
  <text x="50" y="280" text-anchor="middle" font-size="12" transform="rotate(-90, 50, 280)">40</text>
  <text x="50" y="350" text-anchor="middle" font-size="12" transform="rotate(-90, 50, 350)">50</text>
  
  <!-- Bars -->
  <!-- Bar 1: height 20 -->
  <rect x="60" y="140" width="20" height="80" class="bar"/>
  
  <!-- Bar 2: height 30 -->
  <rect x="120" y="110" width="20" height="110" class="bar"/>
  
  <!-- Bar 3: height 40 -->
  <rect x="180" y="80" width="20" height="140" class="bar"/>
  
  <!-- Bar 4: height 50 -->
  <rect x="240" y="50" width="20" height="190" class="bar"/>
  
  <!-- Bar 5: height 60 (tallest, red) -->
  <rect x="300" y="20" width="20" height="220" class="tall-bar"/>
</svg>