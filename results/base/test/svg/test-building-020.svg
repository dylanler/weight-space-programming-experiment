<svg width="200" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Building outline -->
  <rect x="50" y="40" width="100" height="220" fill="#8B7355"/>
  
  <!-- Floor 1 (bottom) -->
  <rect x="60" y="100" width="80" height="60" fill="#AABCB9"/>
  
  <!-- Floor 2 (top) -->
  <rect x="60" y="160" width="80" height="60" fill="#AABCB9"/>
  
  <!-- Windows on floor 1 -->
  <rect x="70" y="110" width="20" height="40" fill="#E0F7FA"/>
  <rect x="100" y="110" width="20" height="40" fill="#E0F7FA"/>
  
  <!-- Windows on floor 2 -->
  <rect x="70" y="170" width="20" height="40" fill="#E0F7FA"/>
  <rect x="100" y="170" width="20" height="40" fill="#E0F7FA"/>
</svg>