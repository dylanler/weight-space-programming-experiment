<svg width="300" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .apple { fill: #ff4d4d; }
      .stem { stroke: #555; stroke-width: 1; }
      .leaf { fill: #8bc34a; }
    </style>
  </defs>
  
  <!-- Tree trunk -->
  <rect x="220" y="160" width="60" height="100" rx="5" class="stem"/>
  
  <!-- Main tree branches -->
  <path d="M220 160 L220 190" stroke="#8b7355" stroke-width="8" stroke-linecap="round"/>
  <path d="M220 190 L220 220" stroke="#8b7355" stroke-width="8" stroke-linecap="round"/>
  <path d="M220 220 L220 250" stroke="#8b7355" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Apple 1 -->
  <circle cx="225" cy="190" r="10" class="apple"/>
  <line x1="225" y1="190" x2="225" y2="180" class="stem"/>
  
  <!-- Apple 2 -->
  <circle cx="225" cy="210" r="10" class="apple"/>
  <line x1="225" y1="210" x2="225" y2="200" class="stem"/>
  
  <!-- Apple 3 -->
  <circle cx="225" cy="230" r="10" class="apple"/>
  <line x1="225" y1="230" x2="225" y2="220" class="stem"/>
  
  <!-- Apple 4 -->
  <circle cx="225" cy="250" r="10" class="apple"/>
  <line x1="225" y1="250" x2="225" y2="240" class="stem"/>
  
  <!-- Apple 5 -->
  <circle cx="225" cy="270" r="10" class="apple"/>
  <line x1="225" y1="270" x2="225" y2="260" class="stem"/>
  
  <!-- Apple 6 -->
  <circle cx="225" cy="290" r="10" class="apple"/>
  <line x1="225" y1="290" x2="225" y2="280" class="stem"/>
  
  <!-- Apple 7 -->
  <circle cx="225" cy="310" r="10" class="apple"/>
  <line x1="225" y1="310" x2="225" y2="300" class="stem"/>
  
  <!-- Apple 8 -->
  <circle cx="225" cy="330" r="10" class="apple"/>
  <line x1="225" y1="330" x2="225" y2="320" class="stem"/>
  
  <!-- Apple 9 -->
  <circle cx="225" cy="350" r="10" class="apple"/>
  <line x1="225" y1="350" x2="225" y2="340" class="stem"/>
  
  <!-- Leaves -->
  <path d="M220 190 Q200 200 200 220" class="leaf"/>
  <path d="M220 220 Q200 210 200 190" class="leaf"/>
  <path d="M220 250 Q200 260 200 240" class="leaf"/>
  <path d="M220 280 Q200 270 200 250" class="leaf"/>
  <path d="M220 310 Q200 300 200 280" class="leaf"/>
  <path d="M220 340 Q200 330 200 310" class="leaf"/>
</svg>