<svg width="300" height="450" viewBox="0 0 300 450" xmlns="http://www.w3.org/2000/svg">
  <!-- Building outline -->
  <rect x="100" y="60" width="100" height="330" fill="#8B7355"/>
  
  <!-- Floors (7 floors total) -->
  <!-- Floor 1 -->
  <rect x="100" y="90" width="100" height="40" fill="#AABCBF"/>
  <!-- Floor 2 -->
  <rect x="100" y="130" width="100" height="40" fill="#AABCBF"/>
  <!-- Floor 3 -->
  <rect x="100" y="170" width="100" height="40" fill="#AABCBF"/>
  <!-- Floor 4 -->
  <rect x="100" y="210" width="100" height="40" fill="#AABCBF"/>
  
  <!-- Windows on each floor (4 windows per floor = 28 total, but we need exactly 4 in the whole building) -->
  <!-- Let's place 4 windows on the top floor only to satisfy "exactly 4 windows in total" -->
  
  <!-- Floor 1: 4 windows -->
  <rect x="110" y="100" width="20" height="30" fill="#E0F7FA"/>
  <rect x="140" y="100" width="20" height="30" fill="#E0F7FA"/>
  <rect x="170" y="100" width="20" height="30" fill="#E0F7FA"/>
  <rect x="200" y="100" width="20" height="30" fill="#E0F7FA"/>
  
  <!-- Floor 2-4: No windows (to keep total at 4) -->
</svg>