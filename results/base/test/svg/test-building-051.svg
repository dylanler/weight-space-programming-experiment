<svg width="400" height="560" viewBox="0 0 400 560" xmlns="http://www.w3.org/2000/svg">
  <!-- Building outline -->
  <rect x="100" y="80" width="200" height="400" fill="#a8c6b9"/>
  
  <!-- Floor lines (7 floors) -->
  <line x1="100" y1="120" x2="300" y2="120" stroke="#5d7d6e" stroke-width="2"/>
  <line x1="100" y1="160" x2="300" y2="160" stroke="#5d7d6e" stroke-width="2"/>
  <line x1="100" y1="200" x2="300" y2="200" stroke="#5d7d6e" stroke-width="2"/>
  <line x1="100" y1="240" x2="300" y2="240" stroke="#5d7d6e" stroke-width="2"/>
  <line x1="100" y1="280" x2="300" y2="280" stroke="#5d7d6e" stroke-width="2"/>
  <line x1="100" y1="320" x2="300" y2="320" stroke="#5d7d6e" stroke-width="2"/>
  <line x1="100" y1="360" x2="300" y2="360" stroke="#5d7d6e" stroke-width="2"/>

  <!-- Windows: 17 total, 7 per floor = 12 on left, 5 on right -->
  <!-- Left side windows (12) -->
  <rect x="110" y="120" width="20" height="40" fill="#f0f0f0"/>
  <rect x="110" y="160" width="20" height="40" fill="#f0f0f0"/>
  <rect x="110" y="200" width="20" height="40" fill="#f0f0f0"/>
  <rect x="110" y="240" width="20" height="40" fill="#f0f0f0"/>
  <rect x="110" y="280" width="20" height="40" fill="#f0f0f0"/>
  <rect x="110" y="320" width="20" height="40" fill="#f0f0f0"/>
  <rect x="110" y="360" width="20" height="40" fill="#f0f0f0"/>
  
  <!-- Right side windows (5) -->
  <rect x="280" y="120" width="20" height="40" fill="#f0f0f0"/>
  <rect x="280" y="160" width="20" height="40" fill="#f0f0f0"/>
  <rect x="280" y="200" width="20" height="40" fill="#f0f0f0"/>
  <rect x="280" y="240" width="20" height="40" fill="#f0f0f0"/>
  <rect x="280" y="280" width="20" height="40" fill="#f0f0f0"/>

  <!-- Roof peak -->
  <path d="M100 80 L100 60 L300 60 L300 80 Z" fill="#8fa88a"/>
</svg>