<svg width="400" height="560" viewBox="0 0 400 560" xmlns="http://www.w3.org/2000/svg">
  <!-- Building outline -->
  <rect x="100" y="80" width="200" height="400" fill="#a8c6e9" stroke="#5d7a9b" stroke-width="2"/>

  <!-- Floor lines (horizontal) -->
  <line x1="100" y1="120" x2="300" y2="120" stroke="#5d7a9b" stroke-width="1"/>
  <line x1="100" y1="160" x2="300" y2="160" stroke="#5d7a9b" stroke-width="1"/>
  <line x1="100" y1="200" x2="300" y2="200" stroke="#5d7a9b" stroke-width="1"/>
  <line x1="100" y1="240" x2="300" y2="240" stroke="#5d7a9b" stroke-width="1"/>
  <line x1="100" y1="280" x2="300" y2="280" stroke="#5d7a9b" stroke-width="1"/>
  <line x1="100" y1="320" x2="300" y2="320" stroke="#5d7a9b" stroke-width="1"/>
  <line x1="100" y1="360" x2="300" y2="360" stroke="#5d7a9b" stroke-width="1"/>
  <line x1="100" y1="400" x2="300" y2="400" stroke="#5d7a9b" stroke-width="1"/>

  <!-- Windows: 6 floors × 4 windows per floor = 24 total, but we need exactly 16. Let's place 4 windows per floor on the left side only. -->
  
  <!-- Floor 1: 4 windows -->
  <rect x="110" y="125" width="30" height="30" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>
  <rect x="150" y="125" width="30" height="30" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>
  <rect x="190" y="125" width="30" height="30" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>
  <rect x="230" y="125" width="30" height="30" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>

  <!-- Floor 2: 4 windows -->
  <rect x="110" y="165" width="30" height="30" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>
  <rect x="150" y="165" width="30" height="30" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>
  <rect x="190" y="165" width="30" height="30" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>
  <rect x="230" y="165" width="30" height="30" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>

  <!-- Floor 3: 4 windows -->
  <rect x="110" y="205" width="30" height="30" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>
  <rect x="150" y="205" width="30" height="30" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>
  <rect x="190" y="205" width="30" height="30" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>
  <rect x="230" y="205" width="30" height="30" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>

  <!-- Floor 4: 4 windows -->
  <rect x="110" y="245" width="30" height="30" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>
  <rect x="150" y="245" width="30" height="30" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>
  <rect x="190" y="245" width="30" height="30" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>
  <rect x="230" y="245" width="30" height="30" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>

  <!-- Floor 5: 4 windows -->
  <rect x="110" y="285" width="30" height="30" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>
  <rect x="150" y="285" width="30" height="30" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>
  <rect x="190" y="285" width="30" height="30" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>
  <rect x="230" y="285" width="30" height="30" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>

  <!-- Floor 6: 4 windows -->
  <rect x="110" y="325" width="30" height="30" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>
  <rect x="150" y="325" width="30" height="30" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>
  <rect x="190" y="325" width="30" height="30" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>
  <rect x="230" y="325" width="30" height="30" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>
</svg>