<svg width="200" height="150" xmlns="http://www.w3.org/2000/svg">
  <!-- Define grid parameters -->
  <!-- Rows: 6, Columns: 2 -->
  <!-- Cell size: 40x40 (total 200x200) -->
  
  <!-- Row 1 -->
  <circle cx="40" cy="40" r="10" fill="white"/>
  <circle cx="80" cy="40" r="10" fill="white"/>
  
  <!-- Row 2 -->
  <circle cx="40" cy="80" r="10" fill="white"/>
  <circle cx="80" cy="80" r="10" fill="white"/>
  
  <!-- Row 3 -->
  <circle cx="40" cy="120" r="10" fill="white"/>
  <circle cx="80" cy="120" r="10" fill="white"/>
  
  <!-- Row 4 -->
  <circle cx="40" cy="160" r="10" fill="white"/>
  <circle cx="80" cy="160" r="10" fill="white"/>
  
  <!-- Row 5 -->
  <circle cx="40" cy="200" r="10" fill="white"/>
  <circle cx="80" cy="200" r="10" fill="white"/>
  
  <!-- Row 6 -->
  <circle cx="40" cy="240" r="10" fill="white"/>
  <circle cx="80" cy="240" r="10" fill="white"/>
</svg>