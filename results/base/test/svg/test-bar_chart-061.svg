<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="400" height="300" fill="white"/>

  <!-- Chart margins and data range assumption: max value = 100, min = 0, bar width = 20, spacing = 50 -->
  <!-- Bars will be at x positions: 60, 110, 160, 210, 260, 310 (with 50px gap between bars) -->
  
  <!-- Bar 1 (blue) -->
  <rect x="60" y="80" width="20" height="70" fill="blue"/>

  <!-- Bar 2 (blue) -->
  <rect x="110" y="80" width="20" height="70" fill="blue"/>

  <!-- Bar 3 (blue) -->
  <rect x="160" y="80" width="20" height="70" fill="blue"/>

  <!-- Bar 4 (red) - tallest, height = 100 -->
  <rect x="210" y="0" width="20" height="100" fill="red"/>

  <!-- Bar 5 (blue) -->
  <rect x="260" y="80" width="20" height="70" fill="blue"/>

  <!-- Bar 6 (blue) -->
  <rect x="310" y="80" width="20" height="70" fill="blue"/>

  <!-- X-axis labels for clarity -->
  <text x="65" y="290" text-anchor="middle" font-size="12">Bar 1</text>
  <text x="115" y="290" text-anchor="middle" font-size="12">Bar 2</text>
  <text x="165" y="290" text-anchor="middle" font-size="12">Bar 3</text>
  <text x="215" y="290" text-anchor="middle" font-size="12">Bar 4</text>
  <text x="265" y="290" text-anchor="middle" font-size="12">Bar 5</text>
  <text x="315" y="290" text-anchor="middle" font-size="12">Bar 6</text>

  <!-- Y-axis label -->
  <text x="20" y="150" text-anchor="middle" font-size="12" transform="rotate(-90, 20, 150)">Value</text>
</svg>