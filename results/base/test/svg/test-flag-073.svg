<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="200" fill="white"/>

  <!-- Horizontal stripes (7) -->
  <rect x="0" y="0" width="300" height="50" fill="#1E88E5"/>
  <rect x="0" y="50" width="300" height="50" fill="#4CAF50"/>
  <rect x="0" y="100" width="300" height="50" fill="#FFC107"/>
  <rect x="0" y="150" width="300" height="50" fill="#F44336"/>
  <rect x="0" y="200" width="300" height="50" fill="#9C27B0"/>
  <rect x="0" y="250" width="300" height="50" fill="#607D8B"/>
  <rect x="0" y="300" width="300" height="50" fill="#E91E63"/>

  <!-- Stars (5) - evenly distributed across the flag -->
  <g transform="translate(10, 10)">
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
    <circle cx="0" cy="-4" r="4" fill="#FFFFFF"/>
    <circle cx="0" cy="4" r="4" fill="#FFFFFF"/>
    <circle cx="-4" cy="0" r="4" fill="#FFFFFF"/>
    <circle cx="4" cy="0" r="4" fill="#FFFFFF"/>
  </g>
</svg>