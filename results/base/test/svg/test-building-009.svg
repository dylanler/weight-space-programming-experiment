<svg width="300" height="450" viewBox="0 0 300 450" xmlns="http://www.w3.org/2000/svg">
  <!-- Building outline -->
  <rect x="100" y="60" width="100" height="330" fill="#8B7355"/>
  
  <!-- Floors (8 floors total) -->
  <!-- Floor 1 -->
  <rect x="100" y="90" width="100" height="40" fill="#AABCBF"/>
  <!-- Floor 2 -->
  <rect x="100" y="130" width="100" height="40" fill="#AABCBF"/>
  <!-- Floor 3 -->
  <rect x="100" y="170" width="100" height="40" fill="#AABCBF"/>
  <!-- Floor 4 -->
  <rect x="100" y="210" width="100" height="40" fill="#AABCBF"/>
  <!-- Floor 5 -->
  <rect x="100" y="250" width="100" height="40" fill="#AABCBF"/>
  <!-- Floor 6 -->
  <rect x="100" y="290" width="100" height="40" fill="#AABCBF"/>
  <!-- Floor 7 -->
  <rect x="100" y="330" width="100" height="40" fill="#AABCBF"/>
  <!-- Floor 8 (top floor) -->
  <rect x="100" y="370" width="100" height="40" fill="#AABCBF"/>

  <!-- Windows on each floor (6 windows per floor = 48 total, but we need exactly 6 in total) -->
  <!-- Let's place 6 windows across the entire building: 2 per floor -->
  <!-- Floor 1: left and right windows -->
  <rect x="120" y="95" width="20" height="35" fill="#D4C4A8"/>
  <rect x="160" y="95" width="20" height="35" fill="#D4C4A8"/>
  <!-- Floor 2: left and right windows -->
  <rect x="120" y="135" width="20" height="35" fill="#D4C4A8"/>
  <rect x="160" y="135" width="20" height="35" fill="#D4C4A8"/>
  <!-- Floor 3: left and right windows -->
  <rect x="120" y="175" width="20" height="35" fill="#D4C4A8"/>
  <rect x="160" y="175" width="20" height="35" fill="#D4C4A8"/>
  <!-- Floor 4: left and right windows -->
  <rect x="120" y="215" width="20" height="35" fill="#D4C4A8"/>
  <rect x="160" y="215" width="20" height="35" fill="#D4C4A8"/>
  <!-- Floor 5: left and right windows -->
  <rect x="120" y="255" width="20" height="35" fill="#D4C4A8"/>
  <rect x="160" y="255" width="20" height="35" fill="#D4C4A8"/>
  <!-- Floor 6: left and right windows -->
  <rect x="120" y="295" width="20" height="35" fill="#D4C4A8"/>
  <rect x="160" y="295" width="20" height="35" fill="#D4C4A8"/>
  <!-- Floor 7: left and right windows -->
  <rect x="120" y="335" width="20" height="35" fill="#D4C4A8"/>
  <rect x="160" y="335" width="20" height="35" fill="#D4C4A8"/>
  <!-- Floor 8: left and right windows -->
  <rect x="120" y="375" width="20" height="35" fill="#D4C4A8"/>
  <rect x="160" y="375" width="20" height="35" fill="#D4C4A8"/>
</svg>