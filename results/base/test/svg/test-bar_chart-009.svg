<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="400" height="300" fill="white"/>

  <!-- Chart margins and data range -->
  <!-- Left margin: 80, Right margin: 20, Top margin: 40, Bottom margin: 60 -->
  <!-- Data range: max value = 100 (red bar), min value = 50 -->
  <!-- Bar width: 40, spacing: 20 -->
  
  <!-- Bar 1 (Blue) - Value 50 -->
  <rect x="80" y="100" width="40" height="50" fill="blue"/>
  
  <!-- Bar 2 (Red) - Value 100 (Tallest) -->
  <rect x="160" y="100" width="40" height="100" fill="red"/>
  
  <!-- Bar 3 (Blue) - Value 75 -->
  <rect x="240" y="100" width="40" height="75" fill="blue"/>

  <!-- Y-axis label -->
  <text x="70" y="35" text-anchor="middle" font-size="14" font-family="Arial">Value</text>
  
  <!-- X-axis label -->
  <text x="200" y="290" text-anchor="middle" font-size="14" font-family="Arial">Category</text>
  
  <!-- Grid lines (optional for clarity) -->
  <line x1="80" y1="40" x2="80" y2="260" stroke="#ddd" stroke-width="1"/>
  <line x1="160" y1="40" x2="160" y2="260" stroke="#ddd" stroke-width="1"/>
  <line x1="240" y1="40" x2="240" y2="260" stroke="#ddd" stroke-width="1"/>
</svg>