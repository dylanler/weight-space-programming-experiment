<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="200" fill="white"/>

  <!-- Horizontal Stripes (5 stripes) -->
  <rect x="0" y="0" width="300" height="40" fill="#FFD700"/>
  <rect x="0" y="80" width="300" height="40" fill="#FFA500"/>
  <rect x="0" y="160" width="300" height="40" fill="#FF8C00"/>
  <rect x="0" y="240" width="300" height="40" fill="#FF6347"/>
  <rect x="0" y="320" width="300" height="40" fill="#FF4500"/>

  <!-- Stars (5 stars, evenly distributed across the flag) -->
  <!-- Each star is a simple 5-pointed star shape -->
  <polygon points="150,10 160.9,20.9 171.9,10 171.9,39.1 160.9,49.9 150,50 139.1,49.9 128.1,39.1 128.1,10 117.1,10 107.1,20.9" 
           fill="#FFFFFF"/>
  
  <polygon points="150,10 160.9,20.9 171.9,10 171.9,39.1 160.9,49.9 150,50 139.1,49.9 128.1,39.1 128.1,10 117.1,10 107.1,20.9" 
           fill="#FFFFFF"/>
  
  <polygon points="150,10 160.9,20.9 171.9,10 171.9,39.1 160.9,49.9 150,50 139.1,49.9 128.1,39.1 128.1,10 117.1,10 107.1,20.9" 
           fill="#FFFFFF"/>
  
  <polygon points="150,10 160.9,20.9 171.9,10 171.9,39.1 160.9,49.9 150,50 139.1,49.9 128.1,39.1 128.1,10 117.1,10 107.1,20.9" 
