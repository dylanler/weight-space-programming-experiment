  <line x1="100" y1="320" x2="300" y2="320" stroke="#5d7a9b" stroke-width="1"/>
  <line x1="100" y1="360" x2="300" y2="360" stroke="#5d7a9b" stroke-width="1"/>
  <line x1="100" y1="400" x2="300" y2="400" stroke="#5d7a9b" stroke-width="1"/>

  <!-- Windows: 22 total, 8 per floor = 22 windows -->
