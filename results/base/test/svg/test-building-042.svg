<svg width="400" height="560" viewBox="0 0 400 560" xmlns="http://www.w3.org/2000/svg">
  <!-- Building outline -->
  <rect x="100" y="80" width="200" height="400" fill="#a8c6e9" stroke="#5d7a9b" stroke-width="2"/>

  <!-- Floor lines (8 floors) -->
  <line x1="100" y1="120" x2="300" y2="120" stroke="#5d7a9b" stroke-width="1"/>
  <line x1="100" y1="160" x2="300" y2="160" stroke="#5d7a9b" stroke-width="1"/>
  <line x1="100" y1="200" x2="300" y2="200" stroke="#5d7a9b" stroke-width="1"/>
  <line x1="100" y1="240" x2="300" y2="240" stroke="#5d7a9b" stroke-width="1"/>
