<svg width="200" height="150" xmlns="http://www.w3.org/2000/svg">
  <!-- Define grid parameters -->
  <!-- Rows: 3, Columns: 6 -->
  <!-- Cell size: 40x40 (total 120x120) -->
  
  <!-- Row 1 -->
  <circle cx="40" cy="80" r="10" fill="white"/>
  <circle cx="80" cy="80" r="10" fill="white"/>
  <circle cx="120" cy="80" r="10" fill="white"/>
  <circle cx="160" cy="80" r="10" fill="white"/>
  <circle cx="200" cy="80" r="10" fill="white"/>
  <circle cx="240" cy="80" r="10" fill="white"/>
  
  <!-- Row 2 -->
  <circle cx="40" cy="120" r="10" fill="white"/>
  <circle cx="80" cy="120" r="10" fill="white"/>
  <circle cx="120" cy="120" r="10" fill="white"/>
  <circle cx="160" cy="120" r="10" fill="white"/>
  <circle cx="200" cy="120" r="10" fill="white"/>
  <circle cx="240" cy="120" r="10" fill="white"/>
  
  <!-- Row 3 -->
  <circle cx="40" cy="160" r="10" fill="white"/>
  <circle cx="80" cy="160" r="10" fill="white"/>
  <circle cx="120" cy="160" r="10" fill="white"/>
  <circle cx="160" cy="160" r="10" fill="white"/>
  <circle cx="200" cy="160" r="10" fill="white"/>
  <circle cx="240" cy="160" r="10" fill="white"/>
</svg>