<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .apple { fill: #ff4d4d; }
      .tree { fill: #2d5a27; }
      .branch { fill: #8b5a2b; }
    </style>
  </defs>
  
  <!-- Tree trunk -->
  <rect x="250" y="150" width="10" height="100" class="tree" />
  
  <!-- Main branches -->
  <line x1="250" y1="150" x2="250" y2="50" stroke="#8b5a2b" stroke-width="4" />
  <line x1="250" y1="50" x2="350" y2="50" stroke="#8b5a2b" stroke-width="4" />
  <line x1="250" y1="50" x2="250" y2="100" stroke="#8b5a2b" stroke-width="4" />
  <line x1="250" y1="100" x2="350" y2="100" stroke="#8b5a2b" stroke-width="4" />
  
  <!-- Branches for apples -->
  <line x1="250" y1="50" x2="200" y2="30" stroke="#8b5a2b" stroke-width="4" />
  <line x1="250" y1="50" x2="300" y2="30" stroke="#8b5a2b" stroke-width="4" />
  <line x1="250" y1="100" x2="200" y2="80" stroke="#8b5a2b" stroke-width="4" />
  <line x1="250" y1="100" x2="300" y2="80" stroke="#8b5a2b" stroke-width="4" />
  <line x1="250" y1="150" x2="200" y2="130" stroke="#8b5a2b" stroke-width="4" />
  <line x1="250" y1="150" x2="300" y2="130" stroke="#8b5a2b" stroke-width="4" />
  
  <!-- Apples -->
  <circle cx="200" cy="30" r="10" class="apple" />
  <circle cx="300" cy="30" r="10" class="apple" />
  <circle cx="200" cy="80" r="10" class="apple" />
  <circle cx="300" cy="80" r="10" class="apple" />
  <circle cx="200" cy="130" r="10" class="apple" />
  <circle cx="300" cy="130" r="10" class="apple" />
  <circle cx="250" cy="130" r="10" class="apple" />
  <circle cx="250" cy="170" r="10" class="apple" />
  <circle cx="250" cy="210" r="10" class="apple" />
  <circle cx="250" cy="250" r="10" class="apple" />
</svg>