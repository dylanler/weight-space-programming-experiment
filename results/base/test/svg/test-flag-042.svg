<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="200" fill="white"/>
  
  <!-- 9 Horizontal Stripes -->
  <rect x="0" y="0" width="300" height="20" fill="#003366"/>
  <rect x="0" y="25" width="300" height="20" fill="#006699"/>
  <rect x="0" y="50" width="300" height="20" fill="#0099CC"/>
  <rect x="0" y="75" width="300" height="20" fill="#00CCFF"/>
  <rect x="0" y="100" width="300" height="20" fill="#0099CC"/>
  <rect x="0" y="125" width="300" height="20" fill="#006699"/>
  <rect x="0" y="150" width="300" height="20" fill="#003366"/>
  <rect x="0" y="175" width="300" height="20" fill="#0099CC"/>
  <rect x="0" y="200" width="300" height="20" fill="#00CCFF"/>
  
  <!-- 6 Stars (centered on each stripe) -->
  <g fill="#FFD700">
    <!-- Stripe 1 -->
    <polygon points="150,10 155,15 160,10 165,15 160,20 155,25 150,20 145,15 150,10"/>
    <polygon points="150,10 155,15 160,10 165,15 160,20 155,25 150,20 145,15 150,10"/>
    <polygon points="150,10 155,15 160,10 165,15 160,20 155,25 150,20 145,15 150,10"/>
    <polygon points="150,10 155,15 160,10 165,15 160,20 155,25 150,20 145,15 150,10"/>
    <polygon points="150,10 155,15 160,10 165,15 160,20 155,25 150,20 145,15 150,10"/>
    <polygon points="150,10 155,15 160,10 165,15 160,20 155,25 150,20 145,15 150,10"/>
  </g>
</svg>