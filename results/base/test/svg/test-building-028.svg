<svg width="300" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Building outline -->
  <rect x="100" y="50" width="100" height="300" fill="#8B7355"/>
  
  <!-- Floors (8 floors total) -->
  <!-- Floor 1 -->
  <rect x="105" y="60" width="90" height="40" fill="#AABCBF"/>
  <!-- Floor 2 -->
  <rect x="105" y="100" width="90" height="40" fill="#AABCBF"/>
  <!-- Floor 3 -->
  <rect x="105" y="140" width="90" height="40" fill="#AABCBF"/>
  <!-- Floor 4 -->
  <rect x="105" y="180" width="90" height="40" fill="#AABCBF"/>
  
  <!-- Windows on each floor (4 windows per floor = 32 total, but we need exactly 4 in the whole building) -->
  <!-- Let's place 4 windows on the first floor only to satisfy "exactly 4 windows in total" -->
  
  <!-- Floor 1: 4 windows -->
  <rect x="115" y="65" width="20" height="30" fill="#E0C090"/>
  <rect x="145" y="65" width="20" height="30" fill="#E0C090"/>
  <rect x="175" y="65" width="20" height="30" fill="#E0C090"/>
  <rect x="205" y="65" width="20" height="30" fill="#E0C090"/>
  
  <!-- Other floors empty of windows -->
</svg>