<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="400" height="300" fill="white"/>

  <!-- Chart margins and data range assumption: max value = 10, min = 0, bar width = 20, spacing = 50 -->
  <!-- Bars will be at x positions: 50, 100, 150, 200, 250, 300, 350, 400 (8 bars) -->
  
  <!-- Bar heights (in units of 1): 1, 2, 3, 4, 5, 6, 7, 8 -->
  <!-- 8th bar is tallest (height=8), colored red; others blue -->
  
  <!-- Bar 1 -->
  <rect x="50" y="20" width="20" height="80" fill="#1E90FF"/>
  
  <!-- Bar 2 -->
  <rect x="100" y="10" width="20" height="90" fill="#1E90FF"/>
  
  <!-- Bar 3 -->
  <rect x="150" y="50" width="20" height="50" fill="#1E90FF"/>
  
  <!-- Bar 4 -->
  <rect x="200" y="30" width="20" height="70" fill="#1E90FF"/>
  
  <!-- Bar 5 -->
  <rect x="250" y="10" width="20" height="90" fill="#1E90FF"/>
  
  <!-- Bar 6 -->
  <rect x="300" y="50" width="20" height="50" fill="#1E90FF"/>
  
  <!-- Bar 7 -->
  <rect x="350" y="30" width="20" height="70" fill="#1E90FF"/>
  
  <!-- Bar 8 (tallest, red) -->
  <rect x="400" y="10" width="20" height="90" fill="#FF0000"/>
</svg>