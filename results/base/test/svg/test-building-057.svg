<svg width="200" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Building outline -->
  <rect x="50" y="50" width="100" height="200" fill="#8B4513" stroke="#5D2906" stroke-width="2"/>
  
  <!-- Floor 1 -->
  <rect x="60" y="100" width="40" height="60" fill="#A0522D" stroke="#5D2906" stroke-width="2"/>
  <rect x="100" y="100" width="40" height="60" fill="#A0522D" stroke="#5D2906" stroke-width="2"/>
  <rect x="140" y="100" width="40" height="60" fill="#A0522D" stroke="#5D2906" stroke-width="2"/>
  
  <!-- Floor 2 -->
  <rect x="60" y="160" width="40" height="60" fill="#A0522D" stroke="#5D2906" stroke-width="2"/>
  <rect x="100" y="160" width="40" height="60" fill="#A0522D" stroke="#5D2906" stroke-width="2"/>
  <rect x="140" y="160" width="40" height="60" fill="#A0522D" stroke="#5D2906" stroke-width="2"/>
  
  <!-- Windows on Floor 1 -->
  <rect x="70" y="110" width="10" height="40" fill="#87CEEB" stroke="#000080" stroke-width="1"/>
  <rect x="110" y="110" width="10" height="40" fill="#87CEEB" stroke="#000080" stroke-width="1"/>
  <rect x="150" y="110" width="10" height="40" fill="#87CEEB" stroke="#000080" stroke-width="1"/>
  
  <!-- Windows on Floor 2 -->
  <rect x="70" y="170" width="10" height="40" fill="#87CEEB" stroke="#000080" stroke-width="1"/>
  <rect x="110" y="170" width="10" height="40" fill="#87CEEB" stroke="#000080" stroke-width="1"/>
  <rect x="150" y="170" width="10" height="40" fill="#87CEEB" stroke="#000080" stroke-width="1"/>
</svg>