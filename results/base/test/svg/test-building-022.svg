<svg width="300" height="450" xmlns="http://www.w3.org/2000/svg">
  <!-- Building outline -->
  <rect x="100" y="80" width="100" height="300" fill="#a8c6e9"/>
  
  <!-- Floor lines (horizontal dividers) -->
  <line x1="100" y1="120" x2="200" y2="120" stroke="#7aa0b3" stroke-width="2"/>
  <line x1="100" y1="160" x2="200" y2="160" stroke="#7aa0b3" stroke-width="2"/>
  <line x1="100" y1="200" x2="200" y2="200" stroke="#7aa0b3" stroke-width="2"/>
  <line x1="100" y1="240" x2="200" y2="240" stroke="#7aa0b3" stroke-width="2"/>
  <line x1="100" y1="280" x2="200" y2="280" stroke="#7aa0b3" stroke-width="2"/>

  <!-- Windows on each floor (5 floors, 2 windows per floor = 10 total) -->
  <!-- Floor 1: top row -->
  <rect x="120" y="110" width="20" height="30" fill="#f0f4f8"/>
  <rect x="160" y="110" width="20" height="30" fill="#f0f4f8"/>
  
  <!-- Floor 2 -->
  <rect x="120" y="150" width="20" height="30" fill="#f0f4f8"/>
  <rect x="160" y="150" width="20" height="30" fill="#f0f4f8"/>
  
  <!-- Floor 3 -->
  <rect x="120" y="190" width="20" height="30" fill="#f0f4f8"/>
  <rect x="160" y="190" width="20" height="30" fill="#f0f4f8"/>
  
  <!-- Floor 4 -->
  <rect x="120" y="230" width="20" height="30" fill="#f0f4f8"/>
  <rect x="160" y="230" width="20" height="30" fill="#f0f4f8"/>
  
  <!-- Floor 5: bottom row -->
  <rect x="120" y="270" width="20" height="30" fill="#f0f4f8"/>
  <rect x="160" y="270" width="20" height="30" fill="#f0f4f8"/>
</svg>