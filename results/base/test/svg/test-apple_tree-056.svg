<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .apple { fill: #ff4d4d; }
      .leaf { fill: #2d5a27; }
      .stem { fill: none; stroke: #2d5a27; stroke-width: 2; }
    </style>
  </defs>
  
  <!-- Tree trunk -->
  <rect x="300" y="150" width="10" height="200" fill="#8B4513" />
  
  <!-- Tree branches -->
  <path d="M300 150 L280 100" stroke="#8B4513" stroke-width="8" fill="none" />
  <path d="M300 150 L320 100" stroke="#8B4513" stroke-width="8" fill="none" />
  <path d="M300 150 L340 100" stroke="#8B4513" stroke-width="8" fill="none" />
  
  <!-- Tree leaves -->
  <path d="M280 100 Q240 80 220 120 Q200 160 240 180 Q280 160 280 100" class="leaf" />
  <path d="M320 100 Q360 80 380 120 Q400 160 360 180 Q320 160 320 100" class="leaf" />
  <path d="M340 100 Q380 80 400 120 Q420 160 380 180 Q340 160 340 100" class="leaf" />
  
  <!-- Apples (14 total) -->
  <!-- Top row -->
  <circle cx="280" cy="90" r="6" class="apple" />
  <circle cx="300" cy="90" r="6" class="apple" />
  <circle cx="320" cy="90" r="6" class="apple" />
  
  <!-- Second row -->
