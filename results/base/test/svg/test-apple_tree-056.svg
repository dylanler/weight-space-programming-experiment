<svg width="400" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .apple { fill: #ff4d4d; }
      .leaf { fill: #2d6a4f; }
      .stem { stroke: #2d6a4f; stroke-width: 1.5; }
    </style>
  </defs>
  
  <!-- Tree trunk -->
  <rect x="380" y="150" width="10" height="300" class="stem"/>
  
  <!-- Main tree branches -->
  <path d="M390 150 L410 170" class="stem"/>
  <path d="M390 150 L410 130" class="stem"/>
  <path d="M390 150 L410 190" class="stem"/>
  
  <!-- Left branch with apples -->
  <path d="M390 170 C380 170, 370 180, 370 200" class="stem"/>
  <path d="M390 190 C380 190, 370 200, 370 220" class="stem"/>
  <path d="M390 130 C380 130, 370 140, 370 160" class="stem"/>
  
  <!-- Right branch with apples -->
  <path d="M410 170 C420 170, 430 180, 430 200" class="stem"/>
  <path d="M410 190 C420 190, 430 200, 430 220" class="stem"/>
  <path d="M410 130 C420 130, 430 140, 430 160" class="stem"/>
  
  <!-- Apples on left side (1-4) -->
  <circle cx="370" cy="180" r="6" class="apple"/>
  <circle cx="370" cy="200" r="6" class="apple"/>
  <circle cx="370" cy="220" r="6" class="apple"/>
  <circle cx="370" cy="195" r="6" class="apple"/>
  
  <!-- Apples on right side (5-8) -->
  <circle cx="430" cy="180" r="6" class="apple"/>
  <circle cx="430" cy="200" r="6" class="apple"/>
  <circle cx="430" cy="220" r="6" class="apple"/>
  <circle cx="430" cy="195" r="6" class="apple"/>
  
  <!-- Apples on far right (9-12) -->
  <circle cx="430" cy="170" r="6" class="apple"/>
  <circle cx="430" cy="190" r="6" class="apple"/>
  <circle cx="430" cy="210" r="6" class="apple"/>
  <circle cx="430" cy="185" r="6" class="apple"/>
  
  <!-- Apples on far left (13-14) -->
  <circle cx="370" cy="165" r="6" class="apple"/>
  <circle cx="370" cy="185" r="6" class="apple"/>
</svg>