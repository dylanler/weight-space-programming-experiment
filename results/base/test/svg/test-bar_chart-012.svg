<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="400" height="300" fill="white"/>

  <!-- Chart margins and data range -->
  <!-- Left margin: 60, Right margin: 20, Top margin: 20, Bottom margin: 60 -->
  <!-- Data range: max value = 100 (bar 1), min value = 50 (others) -->
  <!-- Bar width: 40, spacing: 20 -->
  
  <!-- Bars definition -->
  <!-- Bar 1: x=60, width=40, height=100 (red) -->
  <!-- Bar 2-8: x=100 to 140, width=40, height=50 (blue) -->
  
  <!-- Bar 1 -->
  <rect x="60" y="0" width="40" height="100" fill="red"/>
  
  <!-- Bar 2 -->
  <rect x="100" y="0" width="40" height="50" fill="blue"/>
  
  <!-- Bar 3 -->
  <rect x="140" y="0" width="40" height="50" fill="blue"/>
  
  <!-- Bar 4 -->
  <rect x="180" y="0" width="40" height="50" fill="blue"/>
  
  <!-- Bar 5 -->
  <rect x="220" y="0" width="40" height="50" fill="blue"/>
  
  <!-- Bar 6 -->
  <rect x="260" y="0" width="40" height="50" fill="blue"/>
  
  <!-- Bar 7 -->
  <rect x="300" y="0" width="40" height="50" fill="blue"/>
  
  <!-- Bar 8 -->
  <rect x="340" y="0" width="40" height="50" fill="blue"/>
</svg>