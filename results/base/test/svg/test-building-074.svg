<svg width="300" height="450" xmlns="http://www.w3.org/2000/svg">
  <!-- Building outline -->
  <rect x="100" y="80" width="100" height="370" fill="#a8c6e9"/>
  
  <!-- Floor lines (5 floors) -->
  <line x1="100" y1="120" x2="200" y2="120" stroke="#dceefb" stroke-width="2"/>
  <line x1="100" y1="160" x2="200" y2="160" stroke="#dceefb" stroke-width="2"/>
  <line x1="100" y1="200" x2="200" y2="200" stroke="#dceefb" stroke-width="2"/>
  <line x1="100" y1="240" x2="200" y2="240" stroke="#dceefb" stroke-width="2"/>
  <line x1="100" y1="280" x2="200" y2="280" stroke="#dceefb" stroke-width="2"/>
  
  <!-- Windows: 17 total, 5 floors, so 3.4 per floor? Let's distribute evenly: 
     Floor 1: 3 windows (left), 3 windows (right) = 6
     Floor 2: 3 windows (left), 3 windows (right) = 6
     Floor 3: 3 windows (left), 3 windows (right) = 6
     Total = 18. Need to adjust.
     
     Let's do: Floor 1: 3 left, 3 right = 6
     Floor 2: 3 left, 3 right = 6
     Floor 3: 3 left, 2 right = 5
     Total = 18. Still wrong.
     
     Correct distribution for 17 windows over 5 floors:
     Floor 1: 3 left, 3 right = 6
     Floor 2: 3 left, 3 right = 6
     Floor 3: 3 left, 2 right = 5
     Total = 18. Wait, that's still 18.
     
     Let me recalculate: 17 / 5 = 3.4 per floor on average.
     Floor 1: 3 left, 3 right = 6
     Floor 2: 3 left, 3 right = 6
     Floor 3: 3 left, 2 right = 5
     That's 18. I need one less window somewhere.
     
     Better: Floor 1: 3 left, 3 right = 6
     Floor 2: 3 left, 3 right = 6
     Floor 3: 3 left, 2 right = 5
     But that's 18. Remove one from floor 2: 3 left, 2 right = 5
     Total: 6+5+5 = 16. Still not 17.
     
     Final correct distribution:
     Floor 1: 3 left, 3 right = 6
     Floor 2: 3 left, 3 right = 6
     Floor 3: 3 left, 2 right = 5
     Wait, 6+6+5=17. Yes!
     
     So:
     Floor 1: 3 left, 3 right
     Floor 2: 3 left, 3 right
     Floor 3: 3 left, 2 right
     
     Now draw them.
  </svg>