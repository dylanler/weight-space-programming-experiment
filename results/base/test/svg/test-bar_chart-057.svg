<svg width="400" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Define a common bar width and spacing -->
  <defs>
    <style>
      .bar { fill: #0000FF; }
      .tall-bar { fill: #FF0000; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect x="0" y="0" width="400" height="200" fill="white"/>
  
  <!-- Bar 1: Tallest, Red -->
  <rect x="50" y="100" width="40" height="100" class="bar tall-bar"/>
  
  <!-- Bar 2: Blue -->
  <rect x="100" y="100" width="40" height="100" class="bar"/>
  
  <!-- Bar 3: Blue -->
  <rect x="150" y="100" width="40" height="100" class="bar"/>
  
  <!-- Bar 4: Blue -->
  <rect x="200" y="100" width="40" height="100" class="bar"/>
  
  <!-- Bar 5: Blue -->
  <rect x="250" y="100" width="40" height="100" class="bar"/>
  
  <!-- Bar 6: Blue -->
  <rect x="300" y="100" width="40" height="100" class="bar"/>
  
  <!-- Bar 7: Blue -->
  <rect x="350" y="100" width="40" height="100" class="bar"/>
</svg>