<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="400" height="300" fill="white"/>

  <!-- Chart margins and data range -->
  <!-- Left margin: 60, Right margin: 20, Top margin: 20, Bottom margin: 60 -->
  <!-- Data range: max value = 100 (4th bar), min value = 50 -->
  <!-- Bar width: 40, spacing: 20 -->
  
  <!-- Bars defined by width=40, spacing=20, starting at x=60 -->
  <!-- Bar 1: x=60, height=50 -->
  <rect x="60" y="200" width="40" height="50" fill="#1E90FF"/>
  
  <!-- Bar 2: x=100, height=70 -->
  <rect x="100" y="130" width="40" height="70" fill="#1E90FF"/>
  
  <!-- Bar 3: x=140, height=80 -->
  <rect x="140" y="120" width="40" height="80" fill="#1E90FF"/>
  
  <!-- Bar 4: x=180, height=100 (tallest, red) -->
  <rect x="180" y="100" width="40" height="100" fill="#FF0000"/>
  
  <!-- Bar 5: x=220, height=60 -->
  <rect x="220" y="140" width="40" height="60" fill="#1E90FF"/>
  
  <!-- Labels for clarity -->
  <text x="10" y="250" font-family="Arial" font-size="12" text-anchor="middle">Bar 1</text>
  <text x="140" y="130" font-family="Arial" font-size="12" text-anchor="middle">Bar 2</text>
  <text x="180" y="120" font-family="Arial" font-size="12" text-anchor="middle">Bar 3</text>
  <text x="220" y="140" font-family="Arial" font-size="12" text-anchor="middle">Bar 4</text>
  <text x="260" y="250" font-family="Arial" font-size="12" text-anchor="middle">Bar 5</text>
</svg>