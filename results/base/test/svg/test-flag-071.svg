<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="200" fill="white"/>
  
  <!-- 5 Horizontal Stripes -->
  <rect x="0" y="0" width="300" height="40" fill="#006400"/>
  <rect x="0" y="80" width="300" height="40" fill="#009600"/>
  <rect x="0" y="160" width="300" height="40" fill="#008C00"/>
  <rect x="0" y="240" width="300" height="40" fill="#008000"/>
  <rect x="0" y="320" width="300" height="40" fill="#006400"/>
  
  <!-- 7 Stars (each 10x10, centered on stripe) -->
  <g fill="#FFD700">
    <circle cx="150" cy="40" r="5"/>
    <circle cx="150" cy="80" r="5"/>
    <circle cx="150" cy="120" r="5"/>
    <circle cx="150" cy="160" r="5"/>
    <circle cx="150" cy="200" r="5"/>
    <circle cx="150" cy="240" r="5"/>
    <circle cx="150" cy="280" r="5"/>
  </g>
</svg>