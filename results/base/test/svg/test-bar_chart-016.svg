<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="white"/>
  
  <!-- Chart margins -->
  <rect x="60" y="60" width="280" height="180" fill="white"/>
  
  <!-- Y-axis line -->
  <line x1="60" y1="60" x2="60" y2="180" stroke="black" stroke-width="2"/>
  
  <!-- X-axis line -->
  <line x1="60" y1="180" x2="340" y2="180" stroke="black" stroke-width="2"/>
  
  <!-- X-axis ticks and labels -->
  <line x1="60" y1="180" x2="60" y2="195" stroke="black" stroke-width="1"/>
  <text x="60" y="210" text-anchor="middle" font-size="12">1</text>
  
  <line x1="180" y1="180" x2="180" y2="195" stroke="black" stroke-width="1"/>
  <text x="180" y="210" text-anchor="middle" font-size="12">2</text>
  
  <line x1="300" y1="180" x2="300" y2="195" stroke="black" stroke-width="1"/>
  <text x="300" y="210" text-anchor="middle" font-size="12">3</text>
  
  <line x1="340" y1="180" x2="340" y2="195" stroke="black" stroke-width="1"/>
  <text x="340" y="210" text-anchor="middle" font-size="12">4</text>
  
  <!-- Bars -->
  <!-- Bar 1: Tallest (height 180) -->
  <rect x="60" y="0" width="20" height="180" fill="red"/>
  
  <!-- Bar 2: Height 120 -->
  <rect x="180" y="60" width="20" height="120" fill="blue"/>
  
  <!-- Bar 3: Height 90 -->
  <rect x="300" y="90" width="20" height="90" fill="blue"/>
  
  <!-- Bar 4: Height 60 -->
  <rect x="340" y="120" width="20" height="60" fill="blue"/>
  
  <!-- Bar 5: Height 40 -->
  <rect x="60" y="180" width="20" height="40" fill="blue"/>
  
  <!-- Bar 6: Height 30 -->
  <rect x="180" y="210" width="20" height="30" fill="blue"/>
  
  <!-- Bar 7: Height 20 -->
  <rect x="300" y="240" width="20" height="20" fill="blue"/>
  
  <!-- Bar 8: Height 10 -->
  <rect x="340" y="270" width="20" height="10" fill="blue"/>
</svg>