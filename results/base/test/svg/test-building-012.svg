<svg width="400" height="560" xmlns="http://www.w3.org/2000/svg">
  <!-- Building outline -->
  <rect x="100" y="80" width="200" height="480" fill="#a8c6e9"/>
  
  <!-- Floors (8 floors) -->
  <!-- Floor 1 -->
  <rect x="105" y="100" width="190" height="60" fill="#f0f4f8"/>
  <!-- Floor 2 -->
  <rect x="105" y="170" width="190" height="60" fill="#f0f4f8"/>
  <!-- Floor 3 -->
  <rect x="105" y="240" width="190" height="60" fill="#f0f4f8"/>
  <!-- Floor 4 -->
  <rect x="105" y="310" width="190" height="60" fill="#f0f4f8"/>
  <!-- Floor 5 -->
  <rect x="105" y="380" width="190" height="60" fill="#f0f4f8"/>
  <!-- Floor 6 -->
  <rect x="105" y="450" width="190" height="60" fill="#f0f4f8"/>
  <!-- Floor 7 -->
  <rect x="105" y="520" width="190" height="60" fill="#f0f4f8"/>
  <!-- Floor 8 (Ground level) -->
  <rect x="105" y="590" width="190" height="60" fill="#dceef8"/>

  <!-- Windows: 23 total, 8 floors = 2.875 per floor on average, but we'll distribute evenly as possible -->
  <!-- Floor 1: 3 windows -->
  <rect x="115" y="105" width="30" height="30" fill="#fff9c4"/>
  <rect x="155" y="105" width="30" height="30" fill="#fff9c4"/>
  <rect x="195" y="105" width="30" height="30" fill="#fff9c4"/>
  
  <!-- Floor 2: 3 windows -->
  <rect x="115" y="175" width="30" height="30" fill="#fff9c4"/>
  <rect x="155" y="175" width="30" height="30" fill="#fff9c4"/>
  <rect x="195" y="175" width="30" height="30" fill="#fff9c4"/>
  
  <!-- Floor 3: 3 windows -->
  <rect x="115" y="245" width="30" height="30" fill="#fff9c4"/>
  <rect x="155" y="245" width="30" height="30" fill="#fff9c4"/>
  <rect x="195" y="245" width="30" height="30" fill="#fff9c4"/>
  
  <!-- Floor 4: 3 windows -->
  <rect x="115" y="315" width="30" height="30" fill="#fff9c4"/>
  <rect x="155" y="315" width="30" height="30" fill="#fff9c4"/>
  <rect x="195" y="315" width="30" height="30" fill="#fff9c4"/>
  
  <!-- Floor 5: 3 windows -->
  <rect x="115" y="385" width="30" height="30" fill="#fff9c4"/>
  <rect x="155" y="385" width="30" height="30" fill="#fff9c4"/>
  <rect x="195" y="385" width="30" height="30" fill="#fff9c4"/>
  
  <!-- Floor 6: 3 windows -->
  <rect x="115" y="455" width="30" height="30" fill="#fff9c4"/>
  <rect x="155" y="455" width="30" height="30" fill="#fff9c4"/>
  <rect x="195" y="455" width="30" height="30" fill="#fff9c4"/>
  
  <!-- Floor 7: 3 windows -->
  <rect x="115" y="525" width="30" height="30" fill="#fff9c4"/>
  <rect x="155" y="525" width="30" height="30" fill="#fff9c4"/>
  <rect x="195" y="525" width="30" height="30" fill="#fff9c4"/>
  
  <!-- Floor 8: 2 windows (to make 23 total: 7*3 + 2 = 23) -->
  <rect x="115" y="595" width="30" height="30" fill="#fff9c4"/>
  <rect x="155" y="595" width="30" height="30" fill="#fff9c4"/>
</svg>