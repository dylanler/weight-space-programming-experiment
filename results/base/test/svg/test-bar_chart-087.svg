<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="400" height="300" fill="white"/>

  <!-- Chart margins and data range -->
  <!-- Left margin: 80, Right margin: 20, Top margin: 40, Bottom margin: 60 -->
  <!-- Data range: max value = 100 (red bar), min value = 50 -->
  <!-- Bar width: 40, spacing: 40 -->
  
  <!-- Bars defined by values: 50, 70, 100, 90, 60 -->
  <!-- Blue bars for 1st, 2nd, 4th, 5th; Red bar for 3rd -->
  
  <!-- Bar 1: value 50 -->
  <rect x="80" y="100" width="40" height="50" fill="#1E90FF"/>
  
  <!-- Bar 2: value 70 -->
  <rect x="160" y="100" width="40" height="70" fill="#1E90FF"/>
  
  <!-- Bar 3: value 100 (Tallest, Red) -->
  <rect x="240" y="100" width="40" height="100" fill="#FF0000"/>
  
  <!-- Bar 4: value 90 -->
  <rect x="320" y="100" width="40" height="90" fill="#1E90FF"/>
  
  <!-- Bar 5: value 60 -->
  <rect x="400" y="100" width="40" height="60" fill="#1E90FF"/>

  <!-- Y-axis label -->
  <text x="20" y="250" text-anchor="middle" font-size="14" fill="black">Value</text>
  
  <!-- X-axis label -->
  <text x="200" y="290" text-anchor="middle" font-size="14" fill="black">Category</text>
</svg>