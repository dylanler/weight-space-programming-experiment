<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="200" fill="white"/>

  <!-- Top stripe (red) -->
  <rect x="0" y="0" width="300" height="100" fill="#b22234"/>

  <!-- Middle stripe (white) -->
  <rect x="0" y="100" width="300" height="50" fill="#ffffff"/>

  <!-- Bottom stripe (blue) -->
  <rect x="0" y="150" width="300" height="50" fill="#003399"/>

  <!-- Stars (9 total, evenly distributed across the white middle stripe) -->
  <!-- Row 1: 3 stars -->
  <circle cx="60" cy="125" r="4" fill="#fff"/>
  <circle cx="120" cy="125" r="4" fill="#fff"/>
  <circle cx="180" cy="125" r="4" fill="#fff"/>

  <!-- Row 2: 3 stars -->
  <circle cx="60" cy="175" r="4" fill="#fff"/>
  <circle cx="120" cy="175" r="4" fill="#fff"/>
  <circle cx="180" cy="175" r="4" fill="#fff"/>

  <!-- Row 3: 3 stars -->
  <circle cx="60" cy="225" r="4" fill="#fff"/>
  <circle cx="120" cy="225" r="4" fill="#fff"/>
  <circle cx="180" cy="225" r="4" fill="#fff"/>
</svg>