<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="200" fill="white"/>
  
  <!-- Top stripe (red) -->
  <rect x="0" y="0" width="300" height="100" fill="#b22234"/>
  
  <!-- Middle stripe (white) -->
  <rect x="0" y="100" width="300" height="50" fill="#ffffff"/>
  
  <!-- Bottom stripe (blue) -->
  <rect x="0" y="150" width="300" height="50" fill="#003399"/>
  
  <!-- Stars (9 total, evenly distributed) -->
  <!-- Top stripe: 3 stars -->
  <circle cx="10" cy="20" r="3" fill="#ffffff"/>
  <circle cx="100" cy="20" r="3" fill="#ffffff"/>
  <circle cx="200" cy="20" r="3" fill="#ffffff"/>
  
  <!-- Middle stripe: 3 stars -->
  <circle cx="10" cy="120" r="3" fill="#ffffff"/>
  <circle cx="100" cy="120" r="3" fill="#ffffff"/>
  <circle cx="200" cy="120" r="3" fill="#ffffff"/>
  
  <!-- Bottom stripe: 3 stars -->
  <circle cx="10" cy="170" r="3" fill="#ffffff"/>
  <circle cx="100" cy="170" r="3" fill="#ffffff"/>
  <circle cx="200" cy="170" r="3" fill="#ffffff"/>
</svg>