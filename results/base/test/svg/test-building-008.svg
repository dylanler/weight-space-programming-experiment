<svg width="300" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Building outline -->
  <rect x="100" y="50" width="100" height="300" fill="#8B4513" stroke="#5D2906" stroke-width="2"/>
  
  <!-- Floors (6 floors) -->
  <rect x="100" y="100" width="100" height="50" fill="#A0522D" stroke="#5D2906" stroke-width="2"/>
  <rect x="100" y="150" width="100" height="50" fill="#A0522D" stroke="#5D2906" stroke-width="2"/>
  <rect x="100" y="200" width="100" height="50" fill="#A0522D" stroke="#5D2906" stroke-width="2"/>
  <rect x="100" y="250" width="100" height="50" fill="#A0522D" stroke="#5D2906" stroke-width="2"/>
  <rect x="100" y="300" width="100" height="50" fill="#A0522D" stroke="#5D2906" stroke-width="2"/>
  
  <!-- Windows (8 total, 2 per floor) -->
  <!-- Floor 1 -->
  <rect x="120" y="110" width="20" height="30" fill="#87CEEB" stroke="#00008B" stroke-width="1"/>
  <rect x="140" y="110" width="20" height="30" fill="#87CEEB" stroke="#00008B" stroke-width="1"/>
  <!-- Floor 2 -->
  <rect x="120" y="160" width="20" height="30" fill="#87CEEB" stroke="#00008B" stroke-width="1"/>
  <rect x="140" y="160" width="20" height="30" fill="#87CEEB" stroke="#00008B" stroke-width="1"/>
  <!-- Floor 3 -->
  <rect x="120" y="210" width="20" height="30" fill="#87CEEB" stroke="#00008B" stroke-width="1"/>
  <rect x="140" y="210" width="20" height="30" fill="#87CEEB" stroke="#00008B" stroke-width="1"/>
  <!-- Floor 4 -->
  <rect x="120" y="260" width="20" height="30" fill="#87CEEB" stroke="#00008B" stroke-width="1"/>
  <rect x="140" y="260" width="20" height="30" fill="#87CEEB" stroke="#00008B" stroke-width="1"/>
  <!-- Floor 5 -->
  <rect x="120" y="310" width="20" height="30" fill="#87CEEB" stroke="#00008B" stroke-width="1"/>
  <rect x="140" y="310" width="20" height="30" fill="#87CEEB" stroke="#00008B" stroke-width="1"/>
  <!-- Floor 6 -->
  <rect x="120" y="360" width="20" height="30" fill="#87CEEB" stroke="#00008B" stroke-width="1"/>
  <rect x="140" y="360" width="20" height="30" fill="#87CEEB" stroke="#00008B" stroke-width="1"/>
</svg>