<svg width="300" height="450" xmlns="http://www.w3.org/2000/svg">
  <!-- Building outline -->
  <rect x="100" y="60" width="100" height="330" fill="#8B7355"/>
  
  <!-- Floors (6 floors) -->
  <rect x="100" y="90" width="100" height="50" fill="#AABCBF"/>
  <rect x="100" y="140" width="100" height="50" fill="#AABCBF"/>
  <rect x="100" y="190" width="100" height="50" fill="#AABCBF"/>
  <rect x="100" y="240" width="100" height="50" fill="#AABCBF"/>
  <rect x="100" y="290" width="100" height="50" fill="#AABCBF"/>
  <rect x="100" y="340" width="100" height="50" fill="#AABCBF"/>
  
  <!-- Windows: 8 total, 6 floors = 2 windows per floor -->
  <!-- Floor 1 -->
  <rect x="120" y="100" width="20" height="30" fill="#E0C090"/>
  <rect x="160" y="100" width="20" height="30" fill="#E0C090"/>
  <!-- Floor 2 -->
  <rect x="120" y="150" width="20" height="30" fill="#E0C090"/>
  <rect x="160" y="150" width="20" height="30" fill="#E0C090"/>
  <!-- Floor 3 -->
  <rect x="120" y="200" width="20" height="30" fill="#E0C090"/>
  <rect x="160" y="200" width="20" height="30" fill="#E0C090"/>
  <!-- Floor 4 -->
  <rect x="120" y="250" width="20" height="30" fill="#E0C090"/>
  <rect x="160" y="250" width="20" height="30" fill="#E0C090"/>
  <!-- Floor 5 -->
  <rect x="120" y="300" width="20" height="30" fill="#E0C090"/>
  <rect x="160" y="300" width="20" height="30" fill="#E0C090"/>
</svg>