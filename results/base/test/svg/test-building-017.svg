<svg width="400" height="500" xmlns="http://www.w3.org/2000/svg">
  <!-- Building outline -->
  <rect x="100" y="50" width="200" height="400" fill="#8B4513" stroke="#5D2906" stroke-width="2"/>
  
  <!-- Floor 1 -->
  <rect x="100" y="100" width="200" height="100" fill="#A0522D" stroke="#5D2906" stroke-width="2"/>
  
  <!-- Floor 2 -->
  <rect x="100" y="200" width="200" height="100" fill="#8B4513" stroke="#5D2906" stroke-width="2"/>
  
  <!-- Floor 3 -->
  <rect x="100" y="300" width="200" height="100" fill="#654321" stroke="#5D2906" stroke-width="2"/>
  
  <!-- Windows on Floor 1 (5 windows) -->
  <rect x="110" y="110" width="20" height="20" fill="#87CEEB" stroke="#5D2906" stroke-width="1"/>
  <rect x="140" y="110" width="20" height="20" fill="#87CEEB" stroke="#5D2906" stroke-width="1"/>
  <rect x="170" y="110" width="20" height="20" fill="#87CEEB" stroke="#5D2906" stroke-width="1"/>
  <rect x="200" y="110" width="20" height="20" fill="#87CEEB" stroke="#5D2906" stroke-width="1"/>
  <rect x="230" y="110" width="20" height="20" fill="#87CEEB" stroke="#5D2906" stroke-width="1"/>
  
  <!-- Windows on Floor 2 (5 windows) -->
  <rect x="110" y="210" width="20" height="20" fill="#87CEEB" stroke="#5D2906" stroke-width="1"/>
  <rect x="140" y="210" width="20" height="20" fill="#87CEEB" stroke="#5D2906" stroke-width="1"/>
  <rect x="170" y="210" width="20" height="20" fill="#87CEEB" stroke="#5D2906" stroke-width="1"/>
  <rect x="200" y="210" width="20" height="20" fill="#87CEEB" stroke="#5D2906" stroke-width="1"/>
  <rect x="230" y="210" width="20" height="20" fill="#87CEEB" stroke="#5D2906" stroke-width="1"/>
  
  <!-- Windows on Floor 3 (5 windows) -->
  <rect x="110" y="310" width="20" height="20" fill="#87CEEB" stroke="#5D2906" stroke-width="1"/>
  <rect x="140" y="310" width="20" height="20" fill="#87CEEB" stroke="#5D2906" stroke-width="1"/>
  <rect x="170" y="310" width="20" height="20" fill="#87CEEB" stroke="#5D2906" stroke-width="1"/>
  <rect x="200" y="310" width="20" height="20" fill="#87CEEB" stroke="#5D2906" stroke-width="1"/>
  <rect x="230" y="310" width="20" height="20" fill="#87CEEB" stroke="#5D2906" stroke-width="1"/>
</svg>