<svg width="200" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .apple { fill: #ff4d4d; }
      .leaf { fill: #2d5a27; }
      .stem { stroke: #2d5a27; stroke-width: 1; }
    </style>
  </defs>
  
  <!-- Tree trunk -->
  <rect x="160" y="80" width="40" height="120" rx="5" class="stem"/>
  
  <!-- Main tree branches -->
  <path d="M160 80 L190 100" stroke="#8b4513" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M160 80 L130 120" stroke="#8b4513" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M160 80 L140 140" stroke="#8b4513" stroke-width="8" fill="none" stroke-linecap="round"/>
  
  <!-- Apple 1 -->
  <circle cx="175" cy="95" r="10" class="apple"/>
  
  <!-- Apple 2 -->
  <circle cx="185" cy="110" r="10" class="apple"/>
  
  <!-- Apple 3 -->
  <circle cx="195" cy="125" r="10" class="apple"/>
  
  <!-- Apple 4 -->
  <circle cx="165" cy="135" r="10" class="apple"/>
  
  <!-- Apple 5 -->
  <circle cx="155" cy="150" r="10" class="apple"/>
  
  <!-- Apple 6 -->
  <circle cx="145" cy="165" r="10" class="apple"/>
  
  <!-- Apple 7 -->
  <circle cx="135" cy="180" r="10" class="apple"/>
  
  <!-- Leaves -->
  <path d="M160 100 Q180 80 190 100" class="leaf"/>
  <path d="M160 120 Q180 140 190 120" class="leaf"/>
  <path d="M160 140 Q180 160 190 140" class="leaf"/>
  <path d="M160 160 Q180 180 190 160" class="leaf"/>
  <path d="M160 180 Q180 200 190 180" class="leaf"/>
</svg>