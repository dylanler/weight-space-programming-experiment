<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="200" fill="white"/>

  <!-- Top stripe (red) -->
  <rect x="0" y="0" width="300" height="60" fill="#b22234"/>

  <!-- Middle stripe (white) -->
  <rect x="0" y="60" width="300" height="80" fill="#ffffff"/>

  <!-- Bottom stripe (blue) -->
  <rect x="0" y="140" width="300" height="60" fill="#003399"/>

  <!-- Stars on the white middle stripe -->
  <g fill="#000000">
    <circle cx="50" cy="70" r="4"/>
    <circle cx="100" cy="70" r="4"/>
    <circle cx="150" cy="70" r="4"/>
    <circle cx="200" cy="70" r="4"/>
    <circle cx="250" cy="70" r="4"/>
    <circle cx="30" cy="110" r="4"/>
    <circle cx="70" cy="110" r="4"/>
  </g>
</svg>