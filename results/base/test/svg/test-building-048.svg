<svg width="200" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Building outline -->
  <rect x="50" y="40" width="100" height="220" fill="#8B7355"/>
  
  <!-- Floor 1 (bottom) -->
  <rect x="60" y="100" width="80" height="60" fill="#AABCB9"/>
  <rect x="70" y="100" width="20" height="60" fill="#E0E0E0"/>
  <rect x="90" y="100" width="20" height="60" fill="#E0E0E0"/>
  <rect x="110" y="100" width="20" height="60" fill="#E0E0E0"/>
  <rect x="130" y="100" width="20" height="60" fill="#E0E0E0"/>
  
  <!-- Floor 2 (middle) -->
  <rect x="60" y="160" width="80" height="60" fill="#AABCB9"/>
  <rect x="70" y="160" width="20" height="60" fill="#E0E0E0"/>
  <rect x="90" y="160" width="20" height="60" fill="#E0E0E0"/>
  <rect x="110" y="160" width="20" height="60" fill="#E0E0E0"/>
  <rect x="130" y="160" width="20" height="60" fill="#E0E0E0"/>
  
  <!-- Floor 3 (top) -->
  <rect x="60" y="220" width="80" height="60" fill="#AABCB9"/>
  <rect x="70" y="220" width="20" height="60" fill="#E0E0E0"/>
  <rect x="90" y="220" width="20" height="60" fill="#E0E0E0"/>
  <rect x="110" y="220" width="20" height="60" fill="#E0E0E0"/>
  <rect x="130" y="220" width="20" height="60" fill="#E0E0E0"/>
  
  <!-- Windows on Floor 1 -->
  <rect x="75" y="105" width="10" height="55" fill="#FFFFFF"/>
  <rect x="105" y="105" width="10" height="55" fill="#FFFFFF"/>
  <rect x="135" y="105" width="10" height="55" fill="#FFFFFF"/>
  
  <!-- Windows on Floor 2 -->
  <rect x="75" y="165" width="10" height="55" fill="#FFFFFF"/>
  <rect x="105" y="165" width="10" height="55" fill="#FFFFFF"/>
  <rect x="135" y="165" width="10" height="55" fill="#FFFFFF"/>
  
  <!-- Windows on Floor 3 -->
  <rect x="75" y="225" width="10" height="55" fill="#FFFFFF"/>
  <rect x="105" y="225" width="10" height="55" fill="#FFFFFF"/>
  <rect x="135" y="225" width="10" height="55" fill="#FFFFFF"/>
</svg>