<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .apple { fill: #ff4d4d; }
      .stem { fill: none; stroke: #333; stroke-width: 2; }
      .leaf { fill: #2d5a2d; }
    </style>
  </defs>
  
  <!-- Tree trunk -->
  <rect x="100" y="100" width="10" height="100" fill="#8B4513" />
  
  <!-- Tree branches -->
  <path d="M100 100 L120 120" stroke="#5D4037" stroke-width="4" fill="none" />
  <path d="M100 100 L80 120" stroke="#5D4037" stroke-width="4" fill="none" />
  <path d="M100 100 L120 80" stroke="#5D4037" stroke-width="4" fill="none" />
  
  <!-- Tree leaves -->
  <path d="M100 100 L120 120" stroke="#2d5a2d" stroke-width="2" fill="none" />
  <path d="M100 100 L80 120" stroke="#2d5a2d" stroke-width="2" fill="none" />
  <path d="M100 100 L120 80" stroke="#2d5a2d" stroke-width="2" fill="none" />
  
  <!-- Apples -->
  <circle class="apple" cx="110" cy="110" r="8" />
  <circle class="apple" cx="130" cy="110" r="8" />
  <circle class="apple" cx="110" cy="130" r="8" />
  <circle class="apple" cx="130" cy="130" r="8" />
  <circle class="apple" cx="110" cy="150" r="8" />
</svg>