<svg width="200" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .tree { fill: #4CAF50; }
      .apple { fill: #FF5722; }
      .stem { stroke: #388E3C; stroke-width: 1.5; }
      .leaf { fill: #66BB6A; }
    </style>
  </defs>
  
  <!-- Tree trunk -->
  <rect x="100" y="100" width="10" height="150" class="tree" />
  
  <!-- Main tree branches -->
  <path d="M100 100 L120 150" class="tree" />
  <path d="M100 100 L80 150" class="tree" />
  <path d="M100 100 L120 50" class="tree" />
  <path d="M100 100 L80 50" class="tree" />
  
  <!-- Apple 1 -->
  <circle cx="110" cy="120" r="6" class="apple" />
  <line x1="110" y1="120" x2="110" y2="100" class="stem" />
  
  <!-- Apple 2 -->
  <circle cx="90" cy="130" r="6" class="apple" />
  <line x1="90" y1="130" x2="90" y2="110" class="stem" />
  
  <!-- Apple 3 -->
  <circle cx="120" cy="110" r="6" class="apple" />
  <line x1="120" y1="110" x2="120" y2="90" class="stem" />
  
  <!-- Apple 4 -->
  <circle cx="80" cy="140" r="6" class="apple" />
  <line x1="80" y1="140" x2="80" y2="120" class="stem" />
  
  <!-- Apple 5 -->
  <circle cx="110" cy="150" r="6" class="apple" />
  <line x1="110" y1="150" x2="110" y2="130" class="stem" />
  
  <!-- Leaves -->
  <ellipse cx="120" cy="150" rx="10" ry="15" class="leaf" transform="rotate(-10 120 150)" />
  <ellipse cx="80" cy="150" rx="10" ry="15" class="leaf" transform="rotate(10 80 150)" />
  <ellipse cx="120" cy="50" rx="10" ry="15" class="leaf" transform="rotate(-15 120 50)" />
  <ellipse cx="80" cy="50" rx="10" ry="15" class="leaf" transform="rotate(15 80 50)" />
</svg>