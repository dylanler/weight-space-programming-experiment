<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .apple { fill: #ff4d4d; }
      .stem { fill: none; stroke: #333; stroke-width: 2; }
      .leaf { fill: #2d5a2d; }
    </style>
  </defs>
  
  <!-- Tree trunk -->
  <rect x="100" y="100" width="10" height="100" fill="#8B4513" />
  
  <!-- Tree branches -->
  <path d="M100 100 L120 100" stroke="#5D4037" stroke-width="4" />
  <path d="M100 100 L100 120" stroke="#5D4037" stroke-width="4" />
  <path d="M100 100 L120 120" stroke="#5D4037" stroke-width="4" />
  <path d="M100 100 L100 140" stroke="#5D4037" stroke-width="4" />
  <path d="M100 100 L120 140" stroke="#5D4037" stroke-width="4" />
  <path d="M100 100 L100 160" stroke="#5D4037" stroke-width="4" />
  <path d="M100 100 L120 160" stroke="#5D4037" stroke-width="4" />
  
  <!-- Apple 1 -->
  <circle cx="110" cy="110" r="10" class="apple" />
  <line x1="110" y1="110" x2="110" y2="100" class="stem" />
  <circle cx="110" cy="110" r="5" class="leaf" />
  
  <!-- Apple 2 -->
  <circle cx="130" cy="110" r="10" class="apple" />
  <line x1="130" y1="110" x2="130" y2="100" class="stem" />
  <circle cx="130" cy="110" r="5" class="leaf" />
  
  <!-- Apple 3 -->
  <circle cx="150" cy="110" r="10" class="apple" />
  <line x1="150" y1="110" x2="150" y2="100" class="stem" />
  <circle cx="150" cy="110" r="5" class="leaf" />
  
  <!-- Apple 4 -->
  <circle cx="170" cy="110" r="10" class="apple" />
  <line x1="170" y1="110" x2="170" y2="100" class="stem" />
  <circle cx="170" cy="110" r="5" class="leaf" />
  
  <!-- Apple 5 -->
  <circle cx="190" cy="110" r="10" class="apple" />
  <line x1="190" y1="110" x2="190" y2="100" class="stem" />
  <circle cx="190" cy="110" r="5" class="leaf" />
  
  <!-- Apple 6 -->
  <circle cx="210" cy="110" r="10" class="apple" />
  <line x1="210" y1="110" x2="210" y2="100" class="stem" />
  <circle cx="210" cy="110" r="5" class="leaf" />
</svg>