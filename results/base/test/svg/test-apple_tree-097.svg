<svg width="200" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .apple { fill: #ff4d4d; }
      .leaf { fill: #2d5a27; }
      .stem { stroke: #2d5a27; stroke-width: 1; }
    </style>
  </defs>
  
  <!-- Tree trunk -->
  <rect x="160" y="80" width="40" height="120" rx="5" class="stem"/>
  
  <!-- Main tree branches -->
  <path d="M160 80 L190 100" stroke="#8b4513" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M160 80 L130 120" stroke="#8b4513" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M160 80 L140 140" stroke="#8b4513" stroke-width="8" fill="none" stroke-linecap="round"/>
  
  <!-- Apple 1 -->
  <circle cx="175" cy="95" r="10" class="apple"/>
  
  <!-- Apple 2 -->
  <circle cx="185" cy="110" r="10" class="apple"/>
  
  <!-- Apple 3 -->
  <circle cx="165" cy="130" r="10" class="apple"/>
  
  <!-- Apple 4 -->
  <circle cx="155" cy="145" r="10" class="apple"/>
  
  <!-- Apple 5 -->
  <circle cx="170" cy="160" r="10" class="apple"/>
  
  <!-- Apple 6 -->
  <circle cx="180" cy="175" r="10" class="apple"/>
  
  <!-- Leaves -->
  <path d="M140 100 Q120 110 130 120" class="leaf"/>
  <path d="M190 100 Q210 110 200 120" class="leaf"/>
  <path d="M140 120 Q150 110 160 120" class="leaf"/>
  <path d="M190 120 Q200 110 180 120" class="leaf"/>
  <path d="M140 140 Q150 130 160 140" class="leaf"/>
  <path d="M190 140 Q200 130 180 140" class="leaf"/>
</svg>