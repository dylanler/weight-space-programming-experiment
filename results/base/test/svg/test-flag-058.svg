<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="200" fill="white"/>
  
  <!-- 8 Horizontal Stripes -->
  <rect x="0" y="0" width="300" height="25" fill="#003366"/>
  <rect x="0" y="50" width="300" height="25" fill="#006633"/>
  <rect x="0" y="100" width="300" height="25" fill="#336600"/>
  <rect x="0" y="150" width="300" height="25" fill="#663300"/>
  <rect x="0" y="200" width="300" height="25" fill="#000000"/>
  <rect x="0" y="250" width="300" height="25" fill="#000000"/>
  <rect x="0" y="300" width="300" height="25" fill="#000000"/>
  <rect x="0" y="350" width="300" height="25" fill="#000000"/>
  
  <!-- 5 Stars -->
  <g transform="translate(100, 100)">
    <polygon points="0,0 4,3 2,6 0,3 2,0 4,3" fill="#FFD700"/>
  </g>
  <g transform="translate(150, 100)">
    <polygon points="0,0 4,3 2,6 0,3 2,0 4,3" fill="#FFD700"/>
  </g>
  <g transform="translate(200, 100)">
    <polygon points="0,0 4,3 2,6 0,3 2,0 4,3" fill="#FFD700"/>
  </g>
  <g transform="translate(250, 100)">
    <polygon points="0,0 4,3 2,6 0,3 2,0 4,3" fill="#FFD700"/>
  </g>
  <g transform="translate(300, 100)">
    <polygon points="0,0 4,3 2,6 0,3 2,0 4,3" fill="#FFD700"/>
  </g>
</svg>