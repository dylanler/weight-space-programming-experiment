<svg width="200" height="150" xmlns="http://www.w3.org/2000/svg">
  <!-- Define grid parameters -->
  <!-- 2 rows, 5 columns, total cells = 10 -->
  <!-- Cell size: 20x15 = 300 pixels per row/column -->
  
  <!-- Row 1 (y=0) -->
  <circle cx="20" cy="0" r="8" fill="#4CAF50"/>
  <circle cx="50" cy="0" r="8" fill="#4CAF50"/>
  <circle cx="80" cy="0" r="8" fill="#4CAF50"/>
  <circle cx="110" cy="0" r="8" fill="#4CAF50"/>
  <circle cx="140" cy="0" r="8" fill="#4CAF50"/>
  
  <!-- Row 2 (y=15) -->
  <circle cx="20" cy="15" r="8" fill="#FF9800"/>
  <circle cx="50" cy="15" r="8" fill="#FF9800"/>
  <circle cx="80" cy="15" r="8" fill="#FF9800"/>
  <circle cx="110" cy="15" r="8" fill="#FF9800"/>
  <circle cx="140" cy="15" r="8" fill="#FF9800"/>
</svg>