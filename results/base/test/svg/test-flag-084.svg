<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="200" fill="white"/>

  <!-- Horizontal stripes (8 total) -->
  <rect x="0" y="0" width="300" height="25" fill="#1E90FF"/>
  <rect x="0" y="25" width="300" height="25" fill="#FFD700"/>
  <rect x="0" y="50" width="300" height="25" fill="#FF6347"/>
  <rect x="0" y="75" width="300" height="25" fill="#32CD32"/>
  <rect x="0" y="100" width="300" height="25" fill="#FFA500"/>
  <rect x="0" y="125" width="300" height="25" fill="#00CED1"/>
  <rect x="0" y="150" width="300" height="25" fill="#FF4500"/>
  <rect x="0" y="175" width="300" height="25" fill="#8B4513"/>

  <!-- Stars (5 total, evenly distributed across the flag) -->
  <!-- Star 1: Top stripe -->
  <polygon points="150,5 155,10 160,15 155,20 150,15 145,20 140,15 145,10" fill="#FFFFFF"/>
  
  <!-- Star 2: Second stripe -->
  <polygon points="150,25 155,30 160,35 155,40 150,35 145,40 140,35 145,30" fill="#FFFFFF"/>
  
  <!-- Star 3: Third stripe -->
  <polygon points="150,50 155,55 160,60 155,65 150,60 145,65 140,60 145,55" fill="#FFFFFF"/>
  
  <!-- Star 4: Fourth stripe -->
  <polygon points="150,75 155,80 160,85 155,90 150,85 145,90 140,85 145,80" fill="#FFFFFF"/>
  
  <!-- Star 5: Fifth stripe -->
  <polygon points="150,100 155,105 160,110 155,115 150,110 145,115 140,110 145,105" fill="#FFFFFF"/>
</svg>