<svg width="300" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .apple { fill: #ff4d4d; }
      .leaf { fill: #2d5a27; }
    </style>
  </defs>
  
  <!-- Tree trunk -->
  <rect x="180" y="100" width="60" height="100" rx="5" class="apple"/>
  
  <!-- Main tree branches -->
  <path d="M180,100 L190,120" stroke="#8b4513" stroke-width="8" fill="none"/>
  <path d="M180,100 L170,130" stroke="#8b4513" stroke-width="8" fill="none"/>
  <path d="M180,100 L200,110" stroke="#8b4513" stroke-width="8" fill="none"/>
  
  <!-- Apple 1 -->
  <circle cx="195" cy="125" r="10" class="apple"/>
  
  <!-- Apple 2 -->
  <circle cx="185" cy="135" r="10" class="apple"/>
  
  <!-- Apple 3 -->
  <circle cx="190" cy="145" r="10" class="apple"/>
  
  <!-- Apple 4 -->
  <circle cx="180" cy="155" r="10" class="apple"/>
  
  <!-- Apple 5 -->
  <circle cx="195" cy="165" r="10" class="apple"/>
  
  <!-- Apple 6 -->
  <circle cx="185" cy="175" r="10" class="apple"/>
  
  <!-- Apple 7 -->
  <circle cx="190" cy="185" r="10" class="apple"/>
  
  <!-- Apple 8 -->
  <circle cx="180" cy="195" r="10" class="apple"/>
  
  <!-- Leaves -->
  <path d="M170,120 Q150,100 140,130" class="leaf"/>
  <path d="M210,110 Q230,100 220,130" class="leaf"/>
  <path d="M175,135 Q160,140 155,145" class="leaf"/>
  <path d="M215,125 Q230,130 225,135" class="leaf"/>
  <path d="M180,155 Q165,160 160,165" class="leaf"/>
  <path d="M200,145 Q215,150 210,155" class="leaf"/>
  <path d="M185,175 Q170,180 165,185" class="leaf"/>
  <path d="M205,165 Q220,170 215,175" class="leaf"/>
  <path d="M190,185 Q175,190 170,195" class="leaf"/>
  <path d="M210,175 Q225,180 220,185" class="leaf"/>
</svg>