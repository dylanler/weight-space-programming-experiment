<svg width="300" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .apple { fill: #ff4d4d; }
      .stem { fill: none; stroke: #333; stroke-width: 2; }
      .leaf { fill: #2d5a2d; }
    </style>
  </defs>
  
  <!-- Tree trunk -->
  <rect x="220" y="100" width="60" height="100" rx="5" fill="#8B4513" />
  
  <!-- Tree branches -->
  <line x1="220" y1="100" x2="220" y2="50" stroke="#5D4037" stroke-width="4" />
  <line x1="220" y1="100" x2="260" y2="100" stroke="#5D4037" stroke-width="4" />
  <line x1="220" y1="100" x2="220" y2="150" stroke="#5D4037" stroke-width="4" />
  <line x1="220" y1="100" x2="180" y2="100" stroke="#5D4037" stroke-width="4" />
  <line x1="220" y1="100" x2="180" y2="150" stroke="#5D4037" stroke-width="4" />
  
  <!-- Apple 1 -->
  <circle class="apple" cx="230" cy="110" r="8" />
  <line class="stem" x1="230" y1="110" x2="230" y2="90" />
  
  <!-- Apple 2 -->
  <circle class="apple" cx="240" cy="105" r="8" />
  <line class="stem" x1="240" y1="105" x2="240" y2="85" />
  
  <!-- Apple 3 -->
  <circle class="apple" cx="250" cy="115" r="8" />
  <line class="stem" x1="250" y1="115" x2="250" y2="95" />
  
  <!-- Apple 4 -->
  <circle class="apple" cx="260" cy="100" r="8" />
  <line class="stem" x1="260" y1="100" x2="260" y2="80" />
  
  <!-- Apple 5 -->
  <circle class="apple" cx="270" cy="110" r="8" />
  <line class="stem" x1="270" y1="110" x2="270" y2="90" />
  
  <!-- Apple 6 -->
  <circle class="apple" cx="280" cy="105" r="8" />
  <line class="stem" x1="280" y1="105" x2="280" y2="85" />
  
  <!-- Apple 7 -->
  <circle class="apple" cx="290" cy="115" r="8" />
  <line class="stem" x1="290" y1="115" x2="290" y2="95" />
  
  <!-- Apple 8 -->
  <circle class="apple" cx="300" cy="100" r="8" />
  <line class="stem" x1="300" y1="100" x2="300" y2="80" />
  
  <!-- Leaves -->
  <path class="leaf" d="M220 150 Q200 160 180 150" />
  <path class="leaf" d="M220 150 Q240 160 260 150" />
  <path class="leaf" d="M220 150 Q200 140 180 150" />
  <path class="leaf" d="M220 150 Q240 140 260 150" />
  <path class="leaf" d="M220 150 Q200 160 180 150" />
  <path class="leaf" d="M220 150 Q240 160 260 150" />
</svg>