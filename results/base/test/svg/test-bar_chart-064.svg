<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="400" height="300" fill="white"/>

  <!-- Chart margins and data range assumption: max value = 100, min = 0, bar width = 20, spacing = 60 -->
  <!-- Bar positions (x=50 to x=370) with heights based on values [20, 40, 60, 80, 100] -->
  
  <!-- Bar 1: blue, height 20 -->
  <rect x="50" y="180" width="20" height="20" fill="blue"/>

  <!-- Bar 2: blue, height 40 -->
  <rect x="130" y="120" width="20" height="40" fill="blue"/>

  <!-- Bar 3: blue, height 60 -->
  <rect x="210" y="60" width="20" height="60" fill="blue"/>

  <!-- Bar 4: blue, height 80 -->
  <rect x="290" y="20" width="20" height="80" fill="blue"/>

  <!-- Bar 5: red, height 100 (tallest) -->
  <rect x="370" y="0" width="20" height="100" fill="red"/>
</svg>