  <!-- Windows on each floor (8 windows per floor = 64 total, but we need exactly 8 windows in the entire building) -->
  <!-- We will place 8 windows distributed across all floors. Let's place them evenly: 1 window per floor for simplicity, or spread them out. 
       The prompt says "exactly 8 windows in total". So we'll place 8 windows across the 8 floors.
       Let's place one window per floor to keep it simple and clear. -->

  <!-- Floor 1 Window -->
