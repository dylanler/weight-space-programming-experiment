<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="200" fill="white"/>
  
  <!-- Top stripe (blue) -->
  <rect x="0" y="0" width="300" height="60" fill="#003399"/>
  
  <!-- Second stripe (red) -->
  <rect x="0" y="60" width="300" height="60" fill="#B22234"/>
  
  <!-- Third stripe (yellow) -->
  <rect x="0" y="120" width="300" height="60" fill="#FFCC00"/>
  
  <!-- Bottom stripe (green) -->
  <rect x="0" y="180" width="300" height="60" fill="#006400"/>
  
  <!-- Stars (6 total) -->
  <!-- Top stripe: 2 stars -->
  <circle cx="10" cy="10" r="3" fill="#FFD700"/>
  <circle cx="290" cy="10" r="3" fill="#FFD700"/>
  
  <!-- Second stripe: 2 stars -->
  <circle cx="10" cy="70" r="3" fill="#FFD700"/>
  <circle cx="290" cy="70" r="3" fill="#FFD700"/>
  
  <!-- Third stripe: 2 stars -->
  <circle cx="10" cy="140" r="3" fill="#FFD700"/>
  <circle cx="290" cy="140" r="3" fill="#FFD700"/>
  
  <!-- Bottom stripe: 2 stars -->
  <circle cx="10" cy="190" r="3" fill="#FFD700"/>
  <circle cx="290" cy="190" r="3" fill="#FFD700"/>
</svg>