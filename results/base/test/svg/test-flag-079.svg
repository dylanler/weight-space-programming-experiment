<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="white"/>

  <!-- Flag dimensions: 600x400, stripes are equal height = 50px each -->
  <!-- Top stripe (blue) -->
  <rect x="0" y="0" width="600" height="50" fill="#003399"/>
  
  <!-- Second stripe (red) -->
  <rect x="0" y="50" width="600" height="50" fill="#B22234"/>
  
  <!-- Third stripe (yellow) -->
  <rect x="0" y="100" width="600" height="50" fill="#FFCC00"/>
  
  <!-- Fourth stripe (green) -->
  <rect x="0" y="150" width="600" height="50" fill="#008000"/>
  
  <!-- Fifth stripe (white) -->
  <rect x="0" y="200" width="600" height="50" fill="#FFFFFF"/>
  
  <!-- Sixth stripe (red) -->
  <rect x="0" y="250" width="600" height="50" fill="#B22234"/>
  
  <!-- Seventh stripe (yellow) -->
  <rect x="0" y="300" width="600" height="50" fill="#FFCC00"/>
  
  <!-- Eighth stripe (green) -->
  <rect x="0" y="350" width="600" height="50" fill="#008000"/>

  <!-- Stars (9 stars total, evenly distributed across the flag) -->
  <!-- Each star is centered in a 50px wide column, spaced every 50px vertically -->
  <!-- Row 1: y=50, x positions at 0, 50, 100, 150, 200, 250, 300, 350, 400 -->
  <circle cx="0" cy="50" r="5" fill="#FFD700"/>
  <circle cx="50" cy="50" r="5" fill="#FFD700"/>
  <circle cx="100" cy="50" r="5" fill="#FFD700"/>
  <circle cx="150" cy="50" r="5" fill="#FFD700"/>
  <circle cx="200" cy="50" r="5" fill="#FFD700"/>
  <circle cx="250" cy="50" r="5" fill="#FFD700"/>
  <circle cx="300" cy="50" r="5" fill="#FFD700"/>
  <circle cx="350" cy="50" r="5" fill="#FFD700"/>
  <circle cx="400" cy="50" r="5" fill="#FFD700"/>

  <!-- Row 2: y=100 -->
  <circle cx="0" cy="100" r="5" fill="#FFD700"/>
  <circle cx="50" cy="100" r="5" fill="#FFD700"/>
  <circle cx="100" cy="100" r="5" fill="#FFD700"/>
  <circle cx="150" cy="100" r="5" fill="#FFD700"/>
  <circle cx="200" cy="100" r="5" fill="#FFD700"/>
  <circle cx="250" cy="100" r="5" fill="#FFD700"/>
  <circle cx="300" cy="100" r="5" fill="#FFD700"/>
  <circle cx="350" cy="100" r="5" fill="#FFD700"/>
  <circle cx="400" cy="100" r="5" fill="#FFD700"/>

  <!-- Row 3: y=150 -->
  <circle cx="0" cy="150" r="5" fill="#FFD700"/>
  <circle cx="50" cy="150" r="5" fill="#FFD700"/>
  <circle cx="100" cy="150" r="5" fill="#FFD700"/>
  <circle cx="150" cy="150" r="5" fill="#FFD700"/>
  <circle cx="200" cy="150" r="5" fill="#FFD700"/>
  <circle cx="250" cy="150" r="5" fill="#FFD700"/>
  <circle cx="300" cy="150" r="5" fill="#FFD700"/>
  <circle cx="350" cy="150" r="5" fill="#FFD700"/>
  <circle cx="400" cy="150" r="5" fill="#FFD700"/>

  <!-- Row 4: y=200 -->
  <circle cx="0" cy="200" r="5" fill="#FFD700"/>
  <circle cx="50" cy="200" r="5" fill="#FFD700"/>
  <circle cx="100" cy="200" r="5" fill="#FFD700"/>
  <circle cx="150" cy="200" r="5" fill="#FFD700"/>
  <circle cx="200" cy="200" r="5" fill="#FFD700"/>
  <circle cx="250" cy="200" r="5" fill="#FFD700"/>
  <circle cx="300" cy="200" r="5" fill="#FFD700"/>
  <circle cx="350" cy="200" r="5" fill="#FFD700"/>
  <circle cx="400" cy="200" r="5" fill="#FFD700"/>

  <!-- Row 5: y=250 -->
  <circle cx="0" cy="250" r="5" fill="#FFD700"/>
  <circle cx="50" cy="250" r="5" fill="#FFD700"/>
  <circle cx="100" cy="250" r="5" fill="#FFD700"/>
  <circle cx="150" cy="250" r="5" fill="#FFD700"/>
  <circle cx="200" cy="250" r="5" fill="#FFD700"/>
  <circle cx="250" cy="250" r="5" fill="#FFD700"/>
  <circle cx="300" cy="250" r="5" fill="#FFD700"/>
  <circle cx="350" cy="250" r="5" fill="#FFD700"/>
  <circle cx="400" cy="250" r="5" fill="#FFD700"/>

  <!-- Row 6: y=300 -->
  <circle cx="0" cy="300" r="5" fill="#FFD700"/>
  <circle cx="50" cy="300" r="5" fill="#FFD700"/>
  <circle cx="100" cy="300" r="5" fill="#FFD700"/>
  <circle cx="150" cy="300" r="5" fill="#FFD700"/>
  <circle cx="200" cy="300" r="5" fill="#FFD700"/>
  <circle cx="250" cy="300" r="5" fill="#FFD700"/>
  <circle cx="300" cy="300" r="5" fill="#FFD700"/>
  <circle cx="350" cy="300" r="5" fill="#FFD700"/>
  <circle cx="400" cy="300" r="5" fill="#FFD700"/>

  <!-- Row 7: y=350 -->
  <circle cx="0" cy="350" r="5" fill="#FFD700"/>
  <circle cx="50" cy="350" r="5" fill="#FFD700"/>
  <circle cx="100" cy="350" r="5" fill="#FFD700"/>
  <circle cx="150" cy="350" r="5" fill="#FFD700"/>
  <circle cx="200" cy="350" r="5" fill="#FFD700"/>
  <circle cx="250" cy="350" r="5" fill="#FFD700"/>
  <circle cx="300" cy="350" r="5" fill="#FFD700"/>
  <circle cx="350" cy="350" r="5" fill="#FFD700"/>
  <circle cx="400" cy="350" r="5" fill="#FFD700"/>

  <!-- Row 8: y=400 -->
  <circle cx="0" cy="400" r="5" fill="#FFD700"/>
  <circle cx="50" cy="400" r="5" fill="#FFD700"/>
  <circle cx="100" cy="400" r="5" fill="#FFD700"/>
  <circle cx="150" cy="400" r="5" fill="#FFD700"/>
  <circle cx="200" cy="400" r="5" fill="#FFD700"/>
  <circle cx="250" cy="400" r="5" fill="#FFD700"/>
  <circle cx="300" cy="400" r="5" fill="#FFD700"/>
  <circle cx="350" cy="400" r="5" fill="#FFD700"/>
  <circle cx="400" cy="400" r="5" fill="#FFD700"/>
</svg>