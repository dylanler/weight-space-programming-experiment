<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="400" height="300" fill="white"/>

  <!-- Chart margins and data range assumption: max value = 100, min = 0, bar width = 20, spacing = 50 -->
  <!-- Bar positions (x=50 + i*60): 50, 110, 170, 230, 290, 350, 410 -->
  
  <!-- Bar 1 (blue) -->
  <rect x="50" y="80" width="20" height="120" fill="blue"/>

  <!-- Bar 2 (blue) -->
  <rect x="110" y="80" width="20" height="120" fill="blue"/>

  <!-- Bar 3 (blue) -->
  <rect x="170" y="80" width="20" height="120" fill="blue"/>

  <!-- Bar 4 (red) - tallest at y=20 -->
  <rect x="230" y="20" width="20" height="120" fill="red"/>

  <!-- Bar 5 (blue) -->
  <rect x="290" y="80" width="20" height="120" fill="blue"/>

  <!-- Bar 6 (blue) -->
  <rect x="350" y="80" width="20" height="120" fill="blue"/>

  <!-- Bar 7 (blue) -->
  <rect x="410" y="80" width="20" height="120" fill="blue"/>

  <!-- X-axis labels -->
  <text x="50" y="290" text-anchor="middle" font-size="12">1</text>
  <text x="110" y="290" text-anchor="middle" font-size="12">2</text>
  <text x="170" y="290" text-anchor="middle" font-size="12">3</text>
  <text x="230" y="290" text-anchor="middle" font-size="12">4</text>
  <text x="290" y="290" text-anchor="middle" font-size="12">5</text>
  <text x="350" y="290" text-anchor="middle" font-size="12">6</text>
  <text x="410" y="290" text-anchor="middle" font-size="12">7</text>

  <!-- Y-axis ticks and labels -->
  <line x1="40" y1="80" x2="40" y2="200" stroke="black" stroke-width="1"/>
  <text x="30" y="100" text-anchor="end" font-size="12">0</text>

  <line x1="40" y1="160" x2="40" y2="200" stroke="black" stroke-width="1"/>
  <text x="30" y="180" text-anchor="end" font-size="12">20</text>

  <line x1="40" y1="240" x2="40" y2="200" stroke="black" stroke-width="1"/>
  <text x="30" y="260" text-anchor="end" font-size="12">40</text>

  <line x1="40" y1="320" x2="40" y2="200" stroke="black" stroke-width="1"/>
  <text x="30" y="340" text-anchor="end" font-size="12">60</text>

  <line x1="40" y1="400" x2="40" y2="200" stroke="black" stroke-width="1"/>
  <text x="30" y="420" text-anchor="end" font-size="12">80</text>

  <line x1="40" y1="480" x2="40" y2="200" stroke="black" stroke-width="1"/>
  <text x="30" y="500" text-anchor="end" font-size="12">100</text>
</svg>