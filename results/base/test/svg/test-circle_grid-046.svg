<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Define grid parameters -->
  <!-- 4 rows, 5 columns, total 20 circles -->
  <!-- Cell size: 10x10 units, centered in 200x200 viewBox -->
  
  <!-- Row 1 -->
  <circle cx="10" cy="10" r="8" fill="#e74c3c"/>
  <circle cx="30" cy="10" r="8" fill="#e74c3c"/>
  <circle cx="50" cy="10" r="8" fill="#e74c3c"/>
  <circle cx="70" cy="10" r="8" fill="#e74c3c"/>
  <circle cx="90" cy="10" r="8" fill="#e74c3c"/>

  <!-- Row 2 -->
  <circle cx="10" cy="30" r="8" fill="#f39c12"/>
  <circle cx="30" cy="30" r="8" fill="#f39c12"/>
  <circle cx="50" cy="30" r="8" fill="#f39c12"/>
  <circle cx="70" cy="30" r="8" fill="#f39c12"/>
  <circle cx="90" cy="30" r="8" fill="#f39c12"/>

  <!-- Row 3 -->
  <circle cx="10" cy="50" r="8" fill="#d35400"/>
  <circle cx="30" cy="50" r="8" fill="#d35400"/>
  <circle cx="50" cy="50" r="8" fill="#d35400"/>
  <circle cx="70" cy="50" r="8" fill="#d35400"/>
  <circle cx="90" cy="50" r="8" fill="#d35400"/>

  <!-- Row 4 -->
  <circle cx="10" cy="70" r="8" fill="#c0392b"/>
  <circle cx="30" cy="70" r="8" fill="#c0392b"/>
  <circle cx="50" cy="70" r="8" fill="#c0392b"/>
  <circle cx="70" cy="70" r="8" fill="#c0392b"/>
  <circle cx="90" cy="70" r="8" fill="#c0392b"/>
