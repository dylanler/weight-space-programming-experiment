<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="200" fill="white"/>
  
  <!-- 8 Horizontal Stripes -->
  <rect x="0" y="0" width="300" height="25" fill="#003366"/>
  <rect x="0" y="25" width="300" height="25" fill="#006633"/>
  <rect x="0" y="50" width="300" height="25" fill="#336600"/>
  <rect x="0" y="75" width="300" height="25" fill="#660033"/>
  <rect x="0" y="100" width="300" height="25" fill="#333366"/>
  <rect x="0" y="125" width="300" height="25" fill="#006633"/>
  <rect x="0" y="150" width="300" height="25" fill="#336600"/>
  <rect x="0" y="175" width="300" height="25" fill="#660033"/>
  
  <!-- 3 Stars -->
  <g transform="translate(100, 100)">
    <polygon points="0,-10 5,-2 0,0 -5,-2" fill="#FFD700"/>
  </g>
  <g transform="translate(100, 150)">
    <polygon points="0,-10 5,-2 0,0 -5,-2" fill="#FFD700"/>
  </g>
  <g transform="translate(100, 200)">
    <polygon points="0,-10 5,-2 0,0 -5,-2" fill="#FFD700"/>
  </g>
</svg>