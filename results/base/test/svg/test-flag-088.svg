<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="200" fill="white"/>

  <!-- Horizontal stripes (8 total) -->
  <rect x="0" y="0" width="300" height="25" fill="#1E90FF"/>
  <rect x="0" y="25" width="300" height="25" fill="#FFD700"/>
  <rect x="0" y="50" width="300" height="25" fill="#FF6347"/>
  <rect x="0" y="75" width="300" height="25" fill="#32CD32"/>
  <rect x="0" y="100" width="300" height="25" fill="#FFA500"/>
  <rect x="0" y="125" width="300" height="25" fill="#00CED1"/>
  <rect x="0" y="150" width="300" height="25" fill="#FF4500"/>
  <rect x="0" y="175" width="300" height="25" fill="#8B4513"/>

  <!-- Stars (3 total, centered on each stripe) -->
  <circle cx="150" cy="25" r="4" fill="#FFFFFF"/>
  <circle cx="150" cy="50" r="4" fill="#FFFFFF"/>
  <circle cx="150" cy="75" r="4" fill="#FFFFFF"/>
</svg>