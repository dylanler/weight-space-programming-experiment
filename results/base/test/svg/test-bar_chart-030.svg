<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="400" height="300" fill="white"/>

  <!-- Chart margins and data range assumption: max value = 100, min = 0, bar width = 20, spacing = 60 -->
  <!-- Bars will be at x positions: 60, 120, 180, 240, 300, 360 (for 6 bars), with the 7th at 420 -->
  
  <!-- Bar definitions: blue except 6th (index 5) which is red -->
  <!-- Bar 1: x=60, h=40 -->
  <rect x="60" y="260" width="20" height="40" fill="#1E90FF"/>
  
  <!-- Bar 2: x=120, h=50 -->
  <rect x="120" y="250" width="20" height="50" fill="#1E90FF"/>
  
  <!-- Bar 3: x=180, h=60 -->
  <rect x="180" y="240" width="20" height="60" fill="#1E90FF"/>
  
  <!-- Bar 4: x=240, h=70 -->
  <rect x="240" y="230" width="20" height="70" fill="#1E90FF"/>
  
  <!-- Bar 5: x=300, h=80 -->
  <rect x="300" y="220" width="20" height="80" fill="#1E90FF"/>
  
  <!-- Bar 6: x=360, h=90 (Tallest, colored red) -->
  <rect x="360" y="110" width="20" height="90" fill="#FF0000"/>
  
  <!-- Bar 7: x=420, h=50 -->
  <rect x="420" y="250" width="20" height="50" fill="#1E90FF"/>
</svg>