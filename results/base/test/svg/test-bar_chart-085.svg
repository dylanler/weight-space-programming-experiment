<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="white"/>
  
  <!-- Chart margins -->
  <rect x="60" y="60" width="280" height="180" fill="white"/>
  
  <!-- Grid lines -->
  <line x1="60" y1="60" x2="340" y2="60" stroke="black" stroke-width="1"/>
  <line x1="60" y1="120" x2="340" y2="120" stroke="black" stroke-width="1"/>
  <line x1="60" y1="180" x2="340" y2="180" stroke="black" stroke-width="1"/>
  
  <!-- X-axis labels -->
  <text x="60" y="200" text-anchor="middle" font-family="Arial" font-size="12">1</text>
  <text x="200" y="200" text-anchor="middle" font-family="Arial" font-size="12">2</text>
  <text x="340" y="200" text-anchor="middle" font-family="Arial" font-size="12">3</text>
  
  <!-- Bars -->
  <!-- Bar 1 (blue) -->
  <rect x="60" y="120" width="40" height="60" fill="blue"/>
  
  <!-- Bar 2 (red, tallest) -->
  <rect x="200" y="60" width="40" height="120" fill="red"/>
  
  <!-- Bar 3 (blue) -->
  <rect x="340" y="180" width="40" height="60" fill="blue"/>
</svg>