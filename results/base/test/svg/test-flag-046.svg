<svg width="300" height="250" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="250" fill="white"/>

  <!-- Horizontal stripes (5) -->
  <rect x="0" y="0" width="300" height="50" fill="#1E88E5"/>
  <rect x="0" y="50" width="300" height="50" fill="#4CAF50"/>
  <rect x="0" y="100" width="300" height="50" fill="#FFC107"/>
  <rect x="0" y="150" width="300" height="50" fill="#F44336"/>
  <rect x="0" y="200" width="300" height="50" fill="#9C27B0"/>

  <!-- Stars (5, centered on each stripe) -->
  <g transform="translate(150, 25)">
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
  </g>
  <g transform="translate(150, 100)">
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
  </g>
  <g transform="translate(150, 150)">
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
  </g>
  <g transform="translate(150, 200)">
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
  </g>
</svg>