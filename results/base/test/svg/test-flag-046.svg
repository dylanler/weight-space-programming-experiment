<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="200" fill="white"/>
  
  <!-- 5 Horizontal Stripes -->
  <rect x="0" y="0" width="300" height="40" fill="#006400"/>
  <rect x="0" y="80" width="300" height="40" fill="#009639"/>
  <rect x="0" y="160" width="300" height="40" fill="#00897b"/>
  <rect x="0" y="240" width="300" height="40" fill="#004d00"/>
  <rect x="0" y="320" width="300" height="40" fill="#003300"/>
  
  <!-- 5 Stars (centered on each stripe) -->
  <g transform="translate(150, 40)">
    <polygon points="0,-10 6,-6 0,0 -6,-6 0,10" fill="#FFD700"/>
  </g>
  <g transform="translate(150, 80)">
    <polygon points="0,-10 6,-6 0,0 -6,-6 0,10" fill="#FFD700"/>
  </g>
  <g transform="translate(150, 160)">
    <polygon points="0,-10 6,-6 0,0 -6,-6 0,10" fill="#FFD700"/>
  </g>
  <g transform="translate(150, 240)">
    <polygon points="0,-10 6,-6 0,0 -6,-6 0,10" fill="#FFD700"/>
  </g>
  <g transform="translate(150, 320)">
    <polygon points="0,-10 6,-6 0,0 -6,-6 0,10" fill="#FFD700"/>
  </g>
</svg>