<svg width="400" height="500" xmlns="http://www.w3.org/2000/svg">
  <!-- Building outline -->
  <rect x="100" y="80" width="200" height="320" fill="#8B7355"/>
  
  <!-- Windows per floor (4 windows per floor) -->
  <!-- Floor 1 -->
  <rect x="120" y="120" width="40" height="60" fill="#A89F91"/>
  <rect x="160" y="120" width="40" height="60" fill="#A89F91"/>
  <rect x="200" y="120" width="40" height="60" fill="#A89F91"/>
  <rect x="240" y="120" width="40" height="60" fill="#A89F91"/>
  
  <!-- Floor 2 -->
  <rect x="120" y="180" width="40" height="60" fill="#A89F91"/>
  <rect x="160" y="180" width="40" height="60" fill="#A89F91"/>
  <rect x="200" y="180" width="40" height="60" fill="#A89F91"/>
  <rect x="240" y="180" width="40" height="60" fill="#A89F91"/>
  
  <!-- Floor 3 -->
  <rect x="120" y="240" width="40" height="60" fill="#A89F91"/>
  <rect x="160" y="240" width="40" height="60" fill="#A89F91"/>
  <rect x="200" y="240" width="40" height="60" fill="#A89F91"/>
  <rect x="240" y="240" width="40" height="60" fill="#A89F91"/>
  
  <!-- Floor 4 -->
  <rect x="120" y="300" width="40" height="60" fill="#A89F91"/>
  <rect x="160" y="300" width="40" height="60" fill="#A89F91"/>
  <rect x="200" y="300" width="40" height="60" fill="#A89F91"/>
  <rect x="240" y="300" width="40" height="60" fill="#A89F91"/>
</svg>