<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="200" fill="white"/>

  <!-- Top stripe (blue) -->
  <rect x="0" y="0" width="300" height="60" fill="#0055A4"/>

  <!-- Second stripe (red) -->
  <rect x="0" y="60" width="300" height="60" fill="#B22234"/>

  <!-- Third stripe (yellow) -->
  <rect x="0" y="120" width="300" height="60" fill="#FFCC00"/>

  <!-- Fourth stripe (green) -->
  <rect x="0" y="180" width="300" height="60" fill="#009E49"/>

  <!-- Fifth stripe (white) -->
  <rect x="0" y="240" width="300" height="60" fill="#FFFFFF"/>

  <!-- Sixth stripe (red) -->
  <rect x="0" y="300" width="300" height="60" fill="#B22234"/>

  <!-- Stars (one in the center of the white stripe) -->
  <circle cx="150" cy="270" r="4" fill="#FFD700"/>
</svg>