<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="200" fill="white"/>
  
  <!-- 5 Horizontal Stripes -->
  <rect x="0" y="0" width="300" height="40" fill="#003366"/>
  <rect x="0" y="80" width="300" height="40" fill="#006633"/>
  <rect x="0" y="160" width="300" height="40" fill="#336600"/>
  <rect x="0" y="240" width="300" height="40" fill="#663300"/>
  <rect x="0" y="320" width="300" height="40" fill="#006633"/>
  
  <!-- 8 Stars (each 10x10, centered on stripe) -->
  <g fill="#FFD700">
    <!-- Stripe 1 (y=0) -->
    <circle cx="150" cy="10" r="5" fill="#FFD700"/>
    <circle cx="150" cy="10" r="3" fill="#FFD700"/>
    <circle cx="150" cy="10" r="1" fill="#FFD700"/>
    <circle cx="150" cy="10" r="0.5" fill="#FFD700"/>
    <circle cx="150" cy="10" r="0.25" fill="#FFD700"/>
    <circle cx="150" cy="10" r="0.125" fill="#FFD700"/>
    <circle cx="150" cy="10" r="0.0625" fill="#FFD700"/>
    <circle cx="150" cy="10" r="0.03125" fill="#FFD700"/>
    
    <!-- Stripe 2 (y=80) -->
    <circle cx="150" cy="90" r="5" fill="#FFD700"/>
    <circle cx="150" cy="90" r="3" fill="#FFD700"/>
    <circle cx="150" cy="90" r="1" fill="#FFD700"/>
    <circle cx="150" cy="90" r="0.5" fill="#FFD700"/>
    <circle cx="150" cy="90" r="0.25" fill="#FFD700"/>
    <circle cx="150" cy="90" r="0.125" fill="#FFD700"/>
    <circle cx="150" cy="90" r="0.0625" fill="#FFD700"/>
    <circle cx="150" cy="90" r="0.03125" fill="#FFD700"/>
    
    <!-- Stripe 3 (y=160) -->
    <circle cx="150" cy="170" r="5" fill="#FFD700"/>
    <circle cx="150" cy="170" r="3" fill="#FFD700"/>
    <circle cx="150" cy="170" r="1" fill="#FFD700"/>
    <circle cx="150" cy="170" r="0.5" fill="#FFD700"/>
    <circle cx="150" cy="170" r="0.25" fill="#FFD700"/>
    <circle cx="150" cy="170" r="0.125" fill="#FFD700"/>
    <circle cx="150" cy="170" r="0.0625" fill="#FFD700"/>
    <circle cx="150" cy="170" r="0.03125" fill="#FFD700"/>
    
    <!-- Stripe 4 (y=240) -->
    <circle cx="150" cy="250" r="5" fill="#FFD700"/>
    <circle cx="150" cy="250" r="3" fill="#FFD700"/>
    <circle cx="150" cy="250" r="1" fill="#FFD700"/>
    <circle cx="150" cy="250" r="0.5" fill="#FFD700"/>
    <circle cx="150" cy="250" r="0.25" fill="#FFD700"/>
    <circle cx="150" cy="250" r="0.125" fill="#FFD700"/>
    <circle cx="150" cy="250" r="0.0625" fill="#FFD700"/>
    <circle cx="150" cy="250" r="0.03125" fill="#FFD700"/>
    
    <!-- Stripe 5 (y=320) -->
    <circle cx="150" cy="330" r="5" fill="#FFD700"/>
    <circle cx="150" cy="330" r="3" fill="#FFD700"/>
    <circle cx="150" cy="330" r="1" fill="#FFD700"/>
    <circle cx="150" cy="330" r="0.5" fill="#FFD700"/>
    <circle cx="150" cy="330" r="0.25" fill="#FFD700"/>
    <circle cx="150" cy="330" r="0.125" fill="#FFD700"/>
    <circle cx="150" cy="330" r="0.0625" fill="#FFD700"/>
    <circle cx="150" cy="330" r="0.03125" fill="#FFD700"/>
  </g>
</svg>