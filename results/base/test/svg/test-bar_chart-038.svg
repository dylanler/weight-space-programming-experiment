<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="400" height="300" fill="white"/>

  <!-- Chart margins and data range assumption: max value = 100, min = 0, bar width = 20, spacing = 60 -->
  <!-- Bars will be at x positions: 60, 120, 180, 240, 300, 360, 420 (7th bar at 420) -->
  
  <!-- Bar definitions: index 0 to 8. Index 6 is the tallest (value 100), others are smaller values -->
  <!-- Heights: 50, 40, 30, 20, 10, 5, 1, 0.5, 0.2 -->
  
  <!-- Blue bars (indices 0-5, 7-8) -->
  <rect x="60" y="20" width="20" height="50" fill="#1f77b4"/>
  <rect x="120" y="60" width="20" height="40" fill="#1f77b4"/>
  <rect x="180" y="90" width="20" height="30" fill="#1f77b4"/>
  <rect x="240" y="120" width="20" height="20" fill="#1f77b4"/>
  <rect x="300" y="150" width="20" height="10" fill="#1f77b4"/>
  <rect x="360" y="160" width="20" height="5" fill="#1f77b4"/>
  <rect x="420" y="160.5" width="20" height="0.5" fill="#1f77b4"/>

  <!-- Red bar (index 6, tallest) -->
  <rect x="360" y="160" width="20" height="100" fill="#d62728"/>

  <!-- X-axis labels for clarity -->
  <text x="60" y="290" text-anchor="middle" font-size="12">0</text>
  <text x="120" y="290" text-anchor="middle" font-size="12">20</text>
  <text x="180" y="290" text-anchor="middle" font-size="12">40</text>
  <text x="240" y="290" text-anchor="middle" font-size="12">60</text>
  <text x="300" y="290" text-anchor="middle" font-size="12">80</text>
  <text x="360" y="290" text-anchor="middle" font-size="12">100</text>
  <text x="420" y="290" text-anchor="middle" font-size="12">120</text>
</svg>