<svg width="400" height="500" xmlns="http://www.w3.org/2000/svg">
  <!-- Building outline -->
  <rect x="100" y="50" width="200" height="400" fill="#8B7355"/>
  
  <!-- Floors (6 floors) -->
  <!-- Floor 1 -->
  <rect x="110" y="90" width="180" height="60" fill="#AABCBF"/>
  <!-- Floor 2 -->
  <rect x="110" y="150" width="180" height="60" fill="#AABCBF"/>
  <!-- Floor 3 -->
  <rect x="110" y="210" width="180" height="60" fill="#AABCBF"/>
  <!-- Floor 4 -->
  <rect x="110" y="270" width="180" height="60" fill="#AABCBF"/>
  <!-- Floor 5 -->
  <rect x="110" y="330" width="180" height="60" fill="#AABCBF"/>
  <!-- Floor 6 -->
  <rect x="110" y="390" width="180" height="60" fill="#AABCBF"/>
  
  <!-- Windows: 13 total, 6 per floor = 36 windows. But we need exactly 13. Let's distribute them evenly across floors. -->
  <!-- Floor 1: 3 windows -->
  <rect x="125" y="95" width="30" height="30" fill="#D4C4B0"/>
  <rect x="165" y="95" width="30" height="30" fill="#D4C4B0"/>
  <rect x="205" y="95" width="30" height="30" fill="#D4C4B0"/>
  
  <!-- Floor 2: 3 windows -->
  <rect x="125" y="155" width="30" height="30" fill="#D4C4B0"/>
  <rect x="165" y="155" width="30" height="30" fill="#D4C4B0"/>
  <rect x="205" y="155" width="30" height="30" fill="#D4C4B0"/>
  
  <!-- Floor 3: 3 windows -->
  <rect x="125" y="215" width="30" height="30" fill="#D4C4B0"/>
  <rect x="165" y="215" width="30" height="30" fill="#D4C4B0"/>
  <rect x="205" y="215" width="30" height="30" fill="#D4C4B0"/>
  
  <!-- Floor 4: 3 windows -->
  <rect x="125" y="275" width="30" height="30" fill="#D4C4B0"/>
  <rect x="165" y="275" width="30" height="30" fill="#D4C4B0"/>
  <rect x="205" y="275" width="30" height="30" fill="#D4C4B0"/>
  
  <!-- Floor 5: 3 windows -->
  <rect x="125" y="335" width="30" height="30" fill="#D4C4B0"/>
  <rect x="165" y="335" width="30" height="30" fill="#D4C4B0"/>
  <rect x="205" y="335" width="30" height="30" fill="#D4C4B0"/>
  
  <!-- Floor 6: 3 windows -->
  <rect x="125" y="395" width="30" height="30" fill="#D4C4B0"/>
  <rect x="165" y="395" width="30" height="30" fill="#D4C4B0"/>
  <rect x="205" y="395" width="30" height="30" fill="#D4C4B0"/>
</svg>