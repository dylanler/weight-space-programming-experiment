<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="200" fill="white"/>
  
  <!-- 9 Horizontal Stripes -->
  <rect x="0" y="0" width="300" height="20" fill="#006400"/>
  <rect x="0" y="25" width="300" height="20" fill="#009639"/>
  <rect x="0" y="50" width="300" height="20" fill="#00897b"/>
  <rect x="0" y="75" width="300" height="20" fill="#00796b"/>
  <rect x="0" y="100" width="300" height="20" fill="#006400"/>
  <rect x="0" y="125" width="300" height="20" fill="#009639"/>
  <rect x="0" y="150" width="300" height="20" fill="#00897b"/>
  <rect x="0" y="175" width="300" height="20" fill="#00796b"/>
  <rect x="0" y="200" width="300" height="20" fill="#006400"/>
  
  <!-- 3 Stars -->
  <g transform="translate(100, 50)">
    <polygon points="0,-10 5,0 0,10 -5,0" fill="#ffffff"/>
  </g>
  <g transform="translate(100, 150)">
    <polygon points="0,-10 5,0 0,10 -5,0" fill="#ffffff"/>
  </g>
  <g transform="translate(100, 250)">
    <polygon points="0,-10 5,0 0,10 -5,0" fill="#ffffff"/>
  </g>
</svg>