<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="400" height="300" fill="white"/>

  <!-- Chart margins and data range assumption: max value = 100, min = 0, bar width = 20, spacing = 60 -->
  <!-- Bars will be at x positions: 60, 120, 180, 240, 300, 360 -->
  
  <!-- Bar 1 (blue) -->
  <rect x="60" y="50" width="20" height="100" fill="blue"/>

  <!-- Bar 2 (blue) -->
  <rect x="120" y="50" width="20" height="100" fill="blue"/>

  <!-- Bar 3 (blue) -->
  <rect x="180" y="50" width="20" height="100" fill="blue"/>

  <!-- Bar 4 (red) - tallest (value 100) -->
  <rect x="240" y="0" width="20" height="100" fill="red"/>

  <!-- Bar 5 (blue) -->
  <rect x="300" y="50" width="20" height="100" fill="blue"/>

  <!-- Bar 6 (blue) -->
  <rect x="360" y="50" width="20" height="100" fill="blue"/>

  <!-- X-axis labels -->
  <text x="70" y="290" text-anchor="middle" font-size="12">1</text>
  <text x="130" y="290" text-anchor="middle" font-size="12">2</text>
  <text x="190" y="290" text-anchor="middle" font-size="12">3</text>
  <text x="250" y="290" text-anchor="middle" font-size="12">4</text>
  <text x="310" y="290" text-anchor="middle" font-size="12">5</text>
  <text x="370" y="290" text-anchor="middle" font-size="12">6</text>

  <!-- Y-axis label -->
  <text x="10" y="150" text-anchor="middle" font-size="12" transform="rotate(-90 10 150)">Value</text>
</svg>