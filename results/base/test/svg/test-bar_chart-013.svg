<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="white"/>
  
  <!-- Chart margins -->
  <rect x="60" y="20" width="280" height="260" fill="none" stroke="black" stroke-width="1"/>
  
  <!-- Y-axis -->
  <line x1="60" y1="20" x2="60" y2="260" stroke="black" stroke-width="1"/>
  <!-- X-axis -->
  <line x1="60" y1="260" x2="340" y2="260" stroke="black" stroke-width="1"/>
  
  <!-- Grid lines (optional, for clarity) -->
  <line x1="60" y1="260" x2="340" y2="260" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="60" y1="200" x2="340" y2="200" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="60" y1="140" x2="340" y2="140" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="60" y1="80" x2="340" y2="80" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="60" y1="20" x2="340" y2="20" stroke="#e0e0e0" stroke-width="1"/>
  
  <!-- Bars -->
  <!-- Bar 1: height 40 -->
  <rect x="60" y="220" width="40" height="40" fill="blue"/>
  
  <!-- Bar 2: height 60 -->
  <rect x="120" y="140" width="40" height="60" fill="blue"/>
  
  <!-- Bar 3: height 80 -->
  <rect x="180" y="60" width="40" height="80" fill="blue"/>
  
  <!-- Bar 4: height 120 (tallest, red) -->
  <rect x="240" y="40" width="40" height="120" fill="red"/>
  
  <!-- Bar 5: height 100 -->
  <rect x="300" y="100" width="40" height="100" fill="blue"/>
  
  <!-- Bar 6: height 140 -->
  <rect x="360" y="0" width="40" height="140" fill="blue"/>
  
  <!-- Bar 7: height 160 -->
  <rect x="420" y="-20" width="40" height="160" fill="blue"/>
  
  <!-- Bar 8: height 180 -->
  <rect x="480" y="-40" width="40" height="180" fill="blue"/>
</svg>