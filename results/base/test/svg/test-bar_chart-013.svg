<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="400" height="300" fill="white"/>

  <!-- Chart margins and data range -->
  <!-- Left margin: 60, Right margin: 20, Top margin: 20, Bottom margin: 60 -->
  <!-- Data range: max value = 100 (4th bar), min value = 50 -->
  <!-- Bar width: 40, spacing: 20 -->
  
  <!-- Define common styles -->
  <style>
    .bar { fill: blue; }
    .tall-bar { fill: red; }
  </style>

  <!-- Bars -->
  <!-- Bar 1: 70 -->
  <rect class="bar" x="60" y="20" width="40" height="70"/>
  
  <!-- Bar 2: 80 -->
  <rect class="bar" x="110" y="20" width="40" height="80"/>
  
  <!-- Bar 3: 90 -->
  <rect class="bar" x="160" y="20" width="40" height="90"/>
  
  <!-- Bar 4: 100 (Tallest) -->
  <rect class="tall-bar" x="210" y="20" width="40" height="100"/>
  
  <!-- Bar 5: 60 -->
  <rect class="bar" x="260" y="20" width="40" height="60"/>
  
  <!-- Bar 6: 75 -->
  <rect class="bar" x="310" y="20" width="40" height="75"/>
  
  <!-- Bar 7: 85 -->
  <rect class="bar" x="360" y="20" width="40" height="85"/>
  
  <!-- Bar 8: 95 -->
  <rect class="bar" x="410" y="20" width="40" height="95"/>
</svg>