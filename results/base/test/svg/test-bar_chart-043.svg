<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="400" height="300" fill="white"/>

  <!-- Chart margins and data range assumption: max value = 100, min = 0, bar width = 20, spacing = 60 -->
  <!-- Bar positions (x=20 to x=180) with gaps of 60 between bars -->
  
  <!-- Bar 1: blue -->
  <rect x="20" y="50" width="20" height="100" fill="blue"/>

  <!-- Bar 2: red (tallest) -->
  <rect x="90" y="20" width="20" height="80" fill="red"/>

  <!-- Bar 3: blue -->
  <rect x="160" y="70" width="20" height="30" fill="blue"/>

  <!-- Bar 4: blue -->
  <rect x="230" y="100" width="20" height="50" fill="blue"/>

  <!-- Bar 5: blue -->
  <rect x="300" y="60" width="20" height="40" fill="blue"/>

  <!-- Bar 6: blue -->
  <rect x="370" y="90" width="20" height="10" fill="blue"/>

  <!-- Bar 7: blue -->
  <rect x="440" y="110" width="20" height="90" fill="blue"/>

  <!-- X-axis labels -->
  <text x="20" y="290" text-anchor="middle" font-size="12">Bar 1</text>
  <text x="90" y="290" text-anchor="middle" font-size="12">Bar 2</text>
  <text x="160" y="290" text-anchor="middle" font-size="12">Bar 3</text>
  <text x="230" y="290" text-anchor="middle" font-size="12">Bar 4</text>
  <text x="300" y="290" text-anchor="middle" font-size="12">Bar 5</text>
  <text x="370" y="290" text-anchor="middle" font-size="12">Bar 6</text>
  <text x="440" y="290" text-anchor="middle" font-size="12">Bar 7</text>

  <!-- Y-axis label -->
  <text x="10" y="150" text-anchor="middle" font-size="12" transform="rotate(-90 10 150)">Value</text>
</svg>