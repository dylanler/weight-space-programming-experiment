<svg width="200" height="150" xmlns="http://www.w3.org/2000/svg">
  <!-- Building outline -->
  <rect x="40" y="60" width="120" height="90" fill="#8B7355"/>
  
  <!-- Floor structure (1 floor) -->
  <rect x="40" y="60" width="120" height="90" fill="#AABCBF"/>
  
  <!-- Windows: 8 total, evenly distributed across the building -->
  <!-- Top row: 4 windows -->
  <rect x="50" y="65" width="20" height="20" fill="#E0E0E0"/>
  <rect x="80" y="65" width="20" height="20" fill="#E0E0E0"/>
  <rect x="110" y="65" width="20" height="20" fill="#E0E0E0"/>
  <rect x="140" y="65" width="20" height="20" fill="#E0E0E0"/>
  
  <!-- Middle row: 4 windows -->
  <rect x="50" y="85" width="20" height="20" fill="#E0E0E0"/>
  <rect x="80" y="85" width="20" height="20" fill="#E0E0E0"/>
  <rect x="110" y="85" width="20" height="20" fill="#E0E0E0"/>
  <rect x="140" y="85" width="20" height="20" fill="#E0E0E0"/>
  
  <!-- Bottom row: 4 windows -->
  <rect x="50" y="105" width="20" height="20" fill="#E0E0E0"/>
  <rect x="80" y="105" width="20" height="20" fill="#E0E0E0"/>
  <rect x="110" y="105" width="20" height="20" fill="#E0E0E0"/>
  <rect x="140" y="105" width="20" height="20" fill="#E0E0E0"/>
</svg>