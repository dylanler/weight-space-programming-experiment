<svg width="200" height="150" xmlns="http://www.w3.org/2000/svg">
  <!-- Building outline -->
  <rect x="50" y="20" width="100" height="120" fill="#8B4513" stroke="#5D2906" stroke-width="2"/>
  
  <!-- Floor 1 -->
  <rect x="55" y="25" width="90" height="10" fill="#A0522D" stroke="#5D2906" stroke-width="1"/>
  
  <!-- Windows on floor 1 -->
  <rect x="65" y="30" width="15" height="15" fill="#87CEEB" stroke="#000080" stroke-width="1"/>
  <rect x="85" y="30" width="15" height="15" fill="#87CEEB" stroke="#000080" stroke-width="1"/>
  <rect x="105" y="30" width="15" height="15" fill="#87CEEB" stroke="#000080" stroke-width="1"/>
  <rect x="125" y="30" width="15" height="15" fill="#87CEEB" stroke="#000080" stroke-width="1"/>
  
  <!-- Floor 2 -->
  <rect x="55" y="45" width="90" height="10" fill="#A0522D" stroke="#5D2906" stroke-width="1"/>
  
  <!-- Windows on floor 2 -->
  <rect x="65" y="50" width="15" height="15" fill="#87CEEB" stroke="#000080" stroke-width="1"/>
  <rect x="85" y="50" width="15" height="15" fill="#87CEEB" stroke="#000080" stroke-width="1"/>
  <rect x="105" y="50" width="15" height="15" fill="#87CEEB" stroke="#000080" stroke-width="1"/>
  <rect x="125" y="50" width="15" height="15" fill="#87CEEB" stroke="#000080" stroke-width="1"/>
</svg>