<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="white"/>
  
  <!-- Chart margins -->
  <rect x="60" y="20" width="280" height="260" fill="none" stroke="black" stroke-width="1"/>
  
  <!-- X-axis ticks and labels -->
  <line x1="60" y1="260" x2="60" y2="280" stroke="black" stroke-width="1"/>
  <text x="60" y="295" text-anchor="middle" font-size="12">1</text>
  
  <line x1="140" y1="260" x2="140" y2="280" stroke="black" stroke-width="1"/>
  <text x="140" y="295" text-anchor="middle" font-size="12">2</text>
  
  <line x1="220" y1="260" x2="220" y2="280" stroke="black" stroke-width="1"/>
  <text x="220" y="295" text-anchor="middle" font-size="12">3</text>
  
  <line x1="300" y1="260" x2="300" y2="280" stroke="black" stroke-width="1"/>
  <text x="300" y="295" text-anchor="middle" font-size="12">4</text>
  
  <line x1="380" y1="260" x2="380" y2="280" stroke="black" stroke-width="1"/>
  <text x="380" y="295" text-anchor="middle" font-size="12">5</text>
  
  <!-- Y-axis labels -->
  <text x="50" y="280" text-anchor="end" font-size="12">0</text>
  <text x="50" y="240" text-anchor="end" font-size="12">50</text>
  <text x="50" y="200" text-anchor="end" font-size="12">100</text>
  <text x="50" y="160" text-anchor="end" font-size="12">150</text>
  <text x="50" y="120" text-anchor="end" font-size="12">200</text>
  <text x="50" y="80" text-anchor="end" font-size="12">250</text>
  <text x="50" y="40" text-anchor="end" font-size="12">300</text>
  
  <!-- Bars -->
  <!-- Bar 1: height 100 -->
  <rect x="60" y="160" width="20" height="100" fill="blue"/>
  
  <!-- Bar 2: height 120 -->
  <rect x="140" y="140" width="20" height="120" fill="blue"/>
  
  <!-- Bar 3: height 80 -->
  <rect x="220" y="180" width="20" height="80" fill="blue"/>
  
  <!-- Bar 4: height 150 -->
  <rect x="300" y="110" width="20" height="150" fill="blue"/>
  
  <!-- Bar 5: height 100 -->
  <rect x="380" y="160" width="20" height="100" fill="blue"/>
  
  <!-- Bar 6: height 300 (tallest, red) -->
  <rect x="60" y="0" width="20" height="300" fill="red"/>
  
  <!-- Bar 7: height 120 -->
  <rect x="140" y="140" width="20" height="120" fill="blue"/>
  
  <!-- Bar 8: height 90 -->
  <rect x="220" y="170" width="20" height="90" fill="blue"/>
  
  <!-- Bar 9: height 110 -->
  <rect x="300" y="130" width="20" height="110" fill="blue"/>
</svg>