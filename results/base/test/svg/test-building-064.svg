<svg width="400" height="500" xmlns="http://www.w3.org/2000/svg">
  <!-- Building outline -->
  <rect x="100" y="50" width="200" height="400" fill="#8B7355"/>
  
  <!-- Floors (6 floors) -->
  <!-- Floor 1 -->
  <rect x="110" y="90" width="180" height="60" fill="#AABCBF"/>
  <!-- Floor 2 -->
  <rect x="110" y="150" width="180" height="60" fill="#AABCBF"/>
  <!-- Floor 3 -->
  <rect x="110" y="210" width="180" height="60" fill="#AABCBF"/>
  <!-- Floor 4 -->
  <rect x="110" y="270" width="180" height="60" fill="#AABCBF"/>
  <!-- Floor 5 -->
  <rect x="110" y="330" width="180" height="60" fill="#AABCBF"/>
  <!-- Floor 6 -->
  <rect x="110" y="390" width="180" height="60" fill="#AABCBF"/>
  
  <!-- Windows: 19 total, 6 per floor = 36 windows. But we need exactly 19. Let's distribute them evenly across floors. -->
  <!-- Each floor has 3 windows (18 + 1 = 19). We'll place 3 windows per floor on the right side. -->
  
  <!-- Floor 1 windows -->
  <rect x="130" y="95" width="20" height="20" fill="#D4C5B0"/>
  <rect x="160" y="95" width="20" height="20" fill="#D4C5B0"/>
  <rect x="190" y="95" width="20" height="20" fill="#D4C5B0"/>
  
  <!-- Floor 2 windows -->
  <rect x="130" y="155" width="20" height="20" fill="#D4C5B0"/>
  <rect x="160" y="155" width="20" height="20" fill="#D4C5B0"/>
  <rect x="190" y="155" width="20" height="20" fill="#D4C5B0"/>
  
  <!-- Floor 3 windows -->
  <rect x="130" y="215" width="20" height="20" fill="#D4C5B0"/>
  <rect x="160" y="215" width="20" height="20" fill="#D4C5B0"/>
  <rect x="190" y="215" width="20" height="20" fill="#D4C5B0"/>
  
  <!-- Floor 4 windows -->
  <rect x="130" y="275" width="20" height="20" fill="#D4C5B0"/>
  <rect x="160" y="275" width="20" height="20" fill="#D4C5B0"/>
  <rect x="190" y="275" width="20" height="20" fill="#D4C5B0"/>
  
  <!-- Floor 5 windows -->
  <rect x="130" y="335" width="20" height="20" fill="#D4C5B0"/>
  <rect x="160" y="335" width="20" height="20" fill="#D4C5B0"/>
  <rect x="190" y="335" width="20" height="20" fill="#D4C5B0"/>
  
  <!-- Floor 6 windows -->
  <rect x="130" y="395" width="20" height="20" fill="#D4C5B0"/>
  <rect x="160" y="395" width="20" height="20" fill="#D4C5B0"/>
  <rect x="190" y="395" width="20" height="20" fill="#D4C5B0"/>
</svg>