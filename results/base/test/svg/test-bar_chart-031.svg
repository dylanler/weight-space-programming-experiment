<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Define the chart area -->
  <defs>
    <clipPath id="chartArea">
      <rect x="50" y="50" width="300" height="200"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="400" height="300" fill="white"/>

  <!-- Grid lines (optional, for clarity) -->
  <g stroke="#e0e0e0" stroke-width="1">
    <line x1="50" y1="50" x2="50" y2="250"/>
    <line x1="150" y1="50" x2="150" y2="250"/>
    <line x1="250" y1="50" x2="250" y2="250"/>
    <line x1="350" y1="50" x2="350" y2="250"/>
  </g>

  <!-- Bar group with clipping -->
  <g clip-path="url(#chartArea)">
    <!-- Bar 1: Blue -->
    <rect x="50" y="150" width="40" height="100" fill="blue"/>
    <!-- Bar 2: Blue -->
    <rect x="100" y="150" width="40" height="100" fill="blue"/>
    <!-- Bar 3: Blue -->
    <rect x="150" y="150" width="40" height="100" fill="blue"/>
    <!-- Bar 4: Blue -->
    <rect x="200" y="150" width="40" height="100" fill="blue"/>
    <!-- Bar 5: Blue -->
    <rect x="250" y="150" width="40" height="100" fill="blue"/>
    <!-- Bar 6: Blue -->
    <rect x="300" y="150" width="40" height="100" fill="blue"/>
    <!-- Bar 7: Red (tallest) -->
    <rect x="350" y="50" width="40" height="250" fill="red"/>
  </g>
</svg>