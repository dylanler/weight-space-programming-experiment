<svg width="300" height="450" xmlns="http://www.w3.org/2000/svg">
  <!-- Building outline -->
  <rect x="100" y="80" width="100" height="370" fill="#a8c6e9"/>
  
  <!-- Floor lines (horizontal dividers) -->
  <line x1="100" y1="120" x2="200" y2="120" stroke="#dceefb" stroke-width="2"/>
  <line x1="100" y1="160" x2="200" y2="160" stroke="#dceefb" stroke-width="2"/>
  <line x1="100" y1="200" x2="200" y2="200" stroke="#dceefb" stroke-width="2"/>
  <line x1="100" y1="240" x2="200" y2="240" stroke="#dceefb" stroke-width="2"/>
  <line x1="100" y1="280" x2="200" y2="280" stroke="#dceefb" stroke-width="2"/>
  <line x1="100" y1="320" x2="200" y2="320" stroke="#dceefb" stroke-width="2"/>
  
  <!-- Windows on each floor (7 total, 5 floors) -->
  <!-- Floor 1: 2 windows -->
  <rect x="110" y="125" width="20" height="30" fill="#f0f4f8"/>
  <rect x="140" y="125" width="20" height="30" fill="#f0f4f8"/>
  
  <!-- Floor 2: 2 windows -->
  <rect x="110" y="165" width="20" height="30" fill="#f0f4f8"/>
  <rect x="140" y="165" width="20" height="30" fill="#f0f4f8"/>
  
  <!-- Floor 3: 2 windows -->
  <rect x="110" y="205" width="20" height="30" fill="#f0f4f8"/>
  <rect x="140" y="205" width="20" height="30" fill="#f0f4f8"/>
  
  <!-- Floor 4: 2 windows -->
  <rect x="110" y="245" width="20" height="30" fill="#f0f4f8"/>
  <rect x="140" y="245" width="20" height="30" fill="#f0f4f8"/>
  
  <!-- Floor 5: 2 windows -->
  <rect x="110" y="285" width="20" height="30" fill="#f0f4f8"/>
  <rect x="140" y="285" width="20" height="30" fill="#f0f4f8"/>
</svg>