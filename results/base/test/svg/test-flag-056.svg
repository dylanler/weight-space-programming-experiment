<svg width="300" height="250" viewBox="0 0 300 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="250" fill="#ffffff"/>

  <!-- Horizontal Stripes (7 stripes) -->
  <!-- Stripe 1: Top -->
  <rect x="0" y="0" width="300" height="40" fill="#006837"/>
  <!-- Stripe 2 -->
  <rect x="0" y="40" width="300" height="40" fill="#009639"/>
  <!-- Stripe 3 -->
  <rect x="0" y="80" width="300" height="40" fill="#00C853"/>
  <!-- Stripe 4 -->
  <rect x="0" y="120" width="300" height="40" fill="#00E676"/>
  <!-- Stripe 5 -->
  <rect x="0" y="160" width="300" height="40" fill="#00FF99"/>
  <!-- Stripe 6 -->
  <rect x="0" y="200" width="300" height="40" fill="#00FFD6"/>
  <!-- Stripe 7: Bottom -->
  <rect x="0" y="240" width="300" height="10" fill="#00FFD6"/>

  <!-- Stars (7 stars, evenly distributed across the flag) -->
  <!-- Star 1: Top stripe area -->
  <polygon points="10,10 20,20 30,10 20,0 10,10" fill="#FFFFFF"/>
  <!-- Star 2: Second stripe area -->
  <polygon points="10,30 20,40 30,30 20,20 10,30" fill="#FFFFFF"/>
  <!-- Star 3: Third stripe area -->
  <polygon points="10,50 20,60 30,50 20,40 10,50" fill="#FFFFFF"/>
  <!-- Star 4: Fourth stripe area -->
  <polygon points="10,70 20,80 30,70 20,60 10,70" fill="#FFFFFF"/>
  <!-- Star 5: Fifth stripe area -->
  <polygon points="10,90 20,100 30,90 20,80 10,90" fill="#FFFFFF"/>
  <!-- Star 6: Sixth stripe area -->
  <polygon points="10,110 20,120 30,110 20,100 10,110" fill="#FFFFFF"/>
  <!-- Star 7: Bottom stripe area -->
  <polygon points="10,220 20,230 30,220 20,210 10,220" fill="#FFFFFF"/>
</svg>