<svg width="200" height="100" xmlns="http://www.w3.org/2000/svg">
  <!-- Define grid parameters -->
  <!-- 2 rows, 6 columns -->
  <!-- Cell size: 200/6 ≈ 33.33, 100/2 = 50 -->
  
  <!-- Row 1 -->
  <circle cx="33.33" cy="50" r="10" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="66.67" cy="50" r="10" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="100" cy="50" r="10" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="133.33" cy="50" r="10" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="166.67" cy="50" r="10" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="199.99" cy="50" r="10" fill="white" stroke="black" stroke-width="1"/>
  
  <!-- Row 2 -->
  <circle cx="33.33" cy="100" r="10" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="66.67" cy="100" r="10" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="100" cy="100" r="10" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="133.33" cy="100" r="10" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="166.67" cy="100" r="10" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="199.99" cy="100" r="10" fill="white" stroke="black" stroke-width="1"/>
</svg>