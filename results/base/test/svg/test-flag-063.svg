<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="200" fill="white"/>
  
  <!-- Top stripe (red) -->
  <rect x="0" y="0" width="300" height="50" fill="#b22234"/>
  
  <!-- Second stripe (white) -->
  <rect x="0" y="50" width="300" height="50" fill="#ffffff"/>
  
  <!-- Third stripe (blue) -->
  <rect x="0" y="100" width="300" height="50" fill="#003399"/>
  
  <!-- Fourth stripe (red) -->
  <rect x="0" y="150" width="300" height="50" fill="#b22234"/>
  
  <!-- Fifth stripe (white) -->
  <rect x="0" y="200" width="300" height="50" fill="#ffffff"/>
  
  <!-- Stars -->
  <circle cx="100" cy="25" r="5" fill="#ffffff"/>
  <circle cx="200" cy="25" r="5" fill="#ffffff"/>
</svg>