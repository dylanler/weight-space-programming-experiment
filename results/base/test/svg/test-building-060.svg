<svg width="300" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Building outline -->
  <rect x="100" y="50" width="100" height="300" fill="#8B4513" stroke="#5D2906" stroke-width="2"/>
  
  <!-- Floors (6 floors total) -->
  <!-- Floor 1 -->
  <rect x="105" y="100" width="90" height="40" fill="#A0522D" stroke="#5D2906" stroke-width="1"/>
  <!-- Floor 2 -->
  <rect x="105" y="140" width="90" height="40" fill="#A0522D" stroke="#5D2906" stroke-width="1"/>
  <!-- Floor 3 -->
  <rect x="105" y="180" width="90" height="40" fill="#A0522D" stroke="#5D2906" stroke-width="1"/>
  <!-- Floor 4 -->
  <rect x="105" y="220" width="90" height="40" fill="#A0522D" stroke="#5D2906" stroke-width="1"/>
  <!-- Floor 5 -->
  <rect x="105" y="260" width="90" height="40" fill="#A0522D" stroke="#5D2906" stroke-width="1"/>
  <!-- Floor 6 -->
  <rect x="105" y="300" width="90" height="40" fill="#A0522D" stroke="#5D2906" stroke-width="1"/>
  
  <!-- Windows (4 total, 2 per floor) -->
  <!-- Floor 1: Left and Right -->
  <rect x="115" y="105" width="15" height="35" fill="#87CEEB" stroke="#5D2906" stroke-width="1"/>
  <rect x="165" y="105" width="15" height="35" fill="#87CEEB" stroke="#5D2906" stroke-width="1"/>
  <!-- Floor 2: Left and Right -->
  <rect x="115" y="145" width="15" height="35" fill="#87CEEB" stroke="#5D2906" stroke-width="1"/>
  <rect x="165" y="145" width="15" height="35" fill="#87CEEB" stroke="#5D2906" stroke-width="1"/>
  <!-- Floor 3: Left and Right -->
  <rect x="115" y="185" width="15" height="35" fill="#87CEEB" stroke="#5D2906" stroke-width="1"/>
  <rect x="165" y="185" width="15" height="35" fill="#87CEEB" stroke="#5D2906" stroke-width="1"/>
  <!-- Floor 4: Left and Right -->
  <rect x="115" y="225" width="15" height="35" fill="#87CEEB" stroke="#5D2906" stroke-width="1"/>
  <rect x="165" y="225" width="15" height="35" fill="#87CEEB" stroke="#5D2906" stroke-width="1"/>
</svg>