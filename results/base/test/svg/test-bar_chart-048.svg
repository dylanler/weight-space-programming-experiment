<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="400" height="300" fill="white"/>

  <!-- Chart margins and data range assumption: max value = 100, min = 0, bar width = 20, spacing = 50 -->
  <!-- Bars will be at x positions: 60, 110, 160, 210, 260, 310, 360 -->
  
  <!-- Bar 1 (blue) -->
  <rect x="60" y="80" width="20" height="120" fill="blue"/>

  <!-- Bar 2 (blue) -->
  <rect x="110" y="80" width="20" height="120" fill="blue"/>

  <!-- Bar 3 (blue) -->
  <rect x="160" y="80" width="20" height="120" fill="blue"/>

  <!-- Bar 4 (blue) -->
  <rect x="210" y="80" width="20" height="120" fill="blue"/>

  <!-- Bar 5 (red) - tallest -->
  <rect x="260" y="20" width="20" height="180" fill="red"/>

  <!-- Bar 6 (blue) -->
  <rect x="310" y="80" width="20" height="120" fill="blue"/>

  <!-- Bar 7 (blue) -->
  <rect x="360" y="80" width="20" height="120" fill="blue"/>

  <!-- X-axis labels for clarity -->
  <text x="60" y="290" text-anchor="middle" font-size="12">Bar 1</text>
  <text x="110" y="290" text-anchor="middle" font-size="12">Bar 2</text>
  <text x="160" y="290" text-anchor="middle" font-size="12">Bar 3</text>
  <text x="210" y="290" text-anchor="middle" font-size="12">Bar 4</text>
  <text x="260" y="290" text-anchor="middle" font-size="12">Bar 5</text>
  <text x="310" y="290" text-anchor="middle" font-size="12">Bar 6</text>
  <text x="360" y="290" text-anchor="middle" font-size="12">Bar 7</text>

  <!-- Y-axis label -->
  <text x="20" y="150" text-anchor="middle" font-size="12" transform="rotate(-90 20 150)">Value</text>
</svg>