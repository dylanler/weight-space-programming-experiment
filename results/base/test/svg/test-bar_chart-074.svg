<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="400" height="300" fill="white"/>

  <!-- Bar chart data (assuming equal widths for simplicity) -->
  <!-- Bar 1: value 50, Bar 2: value 100 (tallest), Bar 3: value 75 -->
  
  <!-- Bar 1 (Blue) -->
  <rect x="50" y="80" width="60" height="120" fill="#1f77b4"/>
  
  <!-- Bar 2 (Red) - Tallest -->
  <rect x="150" y="80" width="60" height="220" fill="#d62728"/>
  
  <!-- Bar 3 (Blue) -->
  <rect x="250" y="80" width="60" height="120" fill="#1f77b4"/>

  <!-- X-axis labels -->
  <text x="50" y="290" text-anchor="middle" font-size="12">Bar 1</text>
  <text x="150" y="290" text-anchor="middle" font-size="12">Bar 2</text>
  <text x="250" y="290" text-anchor="middle" font-size="12">Bar 3</text>

  <!-- Y-axis label -->
  <text x="10" y="150" text-anchor="middle" font-size="12" transform="rotate(-90 10 150)">Value</text>
</svg>