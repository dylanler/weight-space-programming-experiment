<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .tree { fill: #2d5a27; }
      .apple { fill: #d32f2f; }
      .stem { fill: none; stroke: #2d5a27; stroke-width: 2; }
    </style>
  </defs>
  <g transform="translate(50,50)">
    <path class="tree" d="M0,0 L0,100 L100,100 L100,0 Z" />
    <path class="apple" d="M20,20 L30,20 L30,25 L20,25 Z" />
    <path class="apple" d="M180,20 L190,20 L190,25 L180,25 Z" />
    <line x1="0" y1="100" x2="100" y2="100" class="stem" />
  </g>
</svg>