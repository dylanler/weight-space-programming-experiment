<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="400" height="300" fill="white"/>

  <!-- Chart margins and data range assumption: max value = 100, min = 0, bar width = 20, spacing = 60 -->
  <!-- Bars will be at x positions: 60, 120, 180, 240, 300 (5th bar is tallest) -->
  
  <!-- Bar 1 (blue) -->
  <rect x="60" y="100" width="20" height="100" fill="blue"/>

  <!-- Bar 2 (blue) -->
  <rect x="120" y="100" width="20" height="100" fill="blue"/>

  <!-- Bar 3 (blue) -->
  <rect x="180" y="100" width="20" height="100" fill="blue"/>

  <!-- Bar 4 (blue) -->
  <rect x="240" y="100" width="20" height="100" fill="blue"/>

  <!-- Bar 5 (red) - Tallest (height = 100) -->
  <rect x="300" y="0" width="20" height="100" fill="red"/>

  <!-- Axis lines -->
  <line x1="60" y1="30" x2="360" y2="30" stroke="black" stroke-width="2"/>
  <line x1="60" y1="100" x2="360" y2="100" stroke="black" stroke-width="2"/>

  <!-- X-axis ticks and labels -->
  <line x1="60" y1="100" x2="60" y2="110" stroke="black" stroke-width="1"/>
  <text x="60" y="120" text-anchor="middle" font-size="12">1</text>

  <line x1="120" y1="100" x2="120" y2="110" stroke="black" stroke-width="1"/>
  <text x="120" y="120" text-anchor="middle" font-size="12">2</text>

  <line x1="180" y1="100" x2="180" y2="110" stroke="black" stroke-width="1"/>
  <text x="180" y="120" text-anchor="middle" font-size="12">3</text>

  <line x1="240" y1="100" x2="240" y2="110" stroke="black" stroke-width="1"/>
  <text x="240" y="120" text-anchor="middle" font-size="12">4</text>

  <line x1="300" y1="100" x2="300" y2="110" stroke="black" stroke-width="1"/>
  <text x="300" y="120" text-anchor="middle" font-size="12">5</text>

  <line x1="360" y1="100" x2="360" y2="110" stroke="black" stroke-width="1"/>
  <text x="360" y="120" text-anchor="middle" font-size="12">6</text>

  <!-- Y-axis label -->
  <text x="20" y="150" text-anchor="middle" font-size="14" transform="rotate(-90 20 150)">Value</text>
</svg>