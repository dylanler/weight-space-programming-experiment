<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="200" fill="white"/>
  
  <!-- Top stripe (red) -->
  <rect x="0" y="0" width="300" height="100" fill="#b22234"/>
  
  <!-- Middle stripe (white) -->
  <rect x="0" y="100" width="300" height="50" fill="#ffffff"/>
  
  <!-- Bottom stripe (blue) -->
  <rect x="0" y="150" width="300" height="50" fill="#003399"/>
  
  <!-- Stars (7 total) -->
  <!-- Top stripe: 3 stars -->
  <circle cx="10" cy="20" r="4" fill="#ffffff"/>
  <circle cx="20" cy="20" r="4" fill="#ffffff"/>
  <circle cx="30" cy="20" r="4" fill="#ffffff"/>
  
  <!-- Middle stripe: 2 stars -->
  <circle cx="10" cy="120" r="4" fill="#ffffff"/>
  <circle cx="20" cy="120" r="4" fill="#ffffff"/>
  
  <!-- Bottom stripe: 2 stars -->
  <circle cx="10" cy="170" r="4" fill="#ffffff"/>
  <circle cx="20" cy="170" r="4" fill="#ffffff"/>
</svg>