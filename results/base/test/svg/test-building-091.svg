<svg width="300" height="450" viewBox="0 0 300 450" xmlns="http://www.w3.org/2000/svg">
  <!-- Building outline -->
  <rect x="100" y="60" width="100" height="330" fill="#8B7355"/>
  
  <!-- Floor lines (horizontal) -->
  <line x1="100" y1="90" x2="200" y2="90" stroke="#5D4E3A" stroke-width="2"/>
  <line x1="100" y1="120" x2="200" y2="120" stroke="#5D4E3A" stroke-width="2"/>
  <line x1="100" y1="150" x2="200" y2="150" stroke="#5D4E3A" stroke-width="2"/>
  <line x1="100" y1="180" x2="200" y2="180" stroke="#5D4E3A" stroke-width="2"/>
  <line x1="100" y1="210" x2="200" y2="210" stroke="#5D4E3A" stroke-width="2"/>
  <line x1="100" y1="240" x2="200" y2="240" stroke="#5D4E3A" stroke-width="2"/>
  <line x1="100" y1="270" x2="200" y2="270" stroke="#5D4E3A" stroke-width="2"/>
  <line x1="100" y1="300" x2="200" y2="300" stroke="#5D4E3A" stroke-width="2"/>

  <!-- Windows on each floor (7 floors, 2 windows per floor = 14 total) -->
  <!-- Floor 1: top row -->
  <rect x="120" y="90" width="20" height="20" fill="#A8C8F0"/>
  <rect x="160" y="90" width="20" height="20" fill="#A8C8F0"/>
  
  <!-- Floor 2 -->
  <rect x="120" y="120" width="20" height="20" fill="#A8C8F0"/>
  <rect x="160" y="120" width="20" height="20" fill="#A8C8F0"/>
  
  <!-- Floor 3 -->
  <rect x="120" y="150" width="20" height="20" fill="#A8C8F0"/>
  <rect x="160" y="150" width="20" height="20" fill="#A8C8F0"/>
  
  <!-- Floor 4 -->
  <rect x="120" y="180" width="20" height="20" fill="#A8C8F0"/>
  <rect x="160" y="180" width="20" height="20" fill="#A8C8F0"/>
  
  <!-- Floor 5 -->
  <rect x="120" y="210" width="20" height="20" fill="#A8C8F0"/>
  <rect x="160" y="210" width="20" height="20" fill="#A8C8F0"/>
  
  <!-- Floor 6 -->
  <rect x="120" y="240" width="20" height="20" fill="#A8C8F0"/>
  <rect x="160" y="240" width="20" height="20" fill="#A8C8F0"/>
  
  <!-- Floor 7: bottom row -->
  <rect x="120" y="270" width="20" height="20" fill="#A8C8F0"/>
  <rect x="160" y="270" width="20" height="20" fill="#A8C8F0"/>
</svg>