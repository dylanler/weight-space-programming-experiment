<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="400" height="300" fill="white"/>

  <!-- Chart margins and data range -->
  <!-- Left margin: 60, Right margin: 20, Top margin: 20, Bottom margin: 60 -->
  <!-- Data range: max value = 100 (8th bar), min value = 50 -->
  <!-- Bar width: 40, spacing: 20 -->
  
  <!-- Define styles -->
  <defs>
    <style>
      .bar { fill: blue; }
      .tall-bar { fill: red; }
    </style>
  </defs>

  <!-- Y-axis line -->
  <line x1="60" y1="20" x2="60" y2="240" stroke="black" stroke-width="2"/>

  <!-- X-axis line -->
  <line x1="60" y1="240" x2="380" y2="240" stroke="black" stroke-width="2"/>

  <!-- Bars -->
  <!-- Bar 1: value 70 -->
  <rect x="90" y="180" width="40" height="60" class="bar"/>
  
  <!-- Bar 2: value 80 -->
  <rect x="130" y="160" width="40" height="80" class="bar"/>
  
  <!-- Bar 3: value 60 -->
  <rect x="170" y="200" width="40" height="40" class="bar"/>
  
  <!-- Bar 4: value 90 -->
  <rect x="210" y="140" width="40" height="100" class="bar"/>
  
  <!-- Bar 5: value 50 -->
  <rect x="250" y="190" width="40" height="50" class="bar"/>
  
  <!-- Bar 6: value 75 -->
  <rect x="290" y="150" width="40" height="90" class="bar"/>
  
  <!-- Bar 7: value 85 -->
  <rect x="330" y="130" width="40" height="110" class="bar"/>
  
  <!-- Bar 8: value 100 (tallest, red) -->
  <rect x="370" y="100" width="40" height="140" class="tall-bar"/>
</svg>