<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="white"/>
  
  <!-- Chart margins -->
  <rect x="60" y="60" width="280" height="180" fill="white"/>
  
  <!-- Y-axis line -->
  <line x1="60" y1="60" x2="60" y2="180" stroke="black" stroke-width="2"/>
  
  <!-- X-axis line -->
  <line x1="60" y1="180" x2="340" y2="180" stroke="black" stroke-width="2"/>
  
  <!-- X-axis ticks and labels -->
  <line x1="60" y1="180" x2="60" y2="195" stroke="black" stroke-width="1"/>
  <text x="60" y="205" text-anchor="middle" font-size="12">1</text>
  
  <line x1="180" y1="180" x2="180" y2="195" stroke="black" stroke-width="1"/>
  <text x="180" y="205" text-anchor="middle" font-size="12">2</text>
  
  <line x1="300" y1="180" x2="300" y2="195" stroke="black" stroke-width="1"/>
  <text x="300" y="205" text-anchor="middle" font-size="12">3</text>
  
  <line x1="340" y1="180" x2="340" y2="195" stroke="black" stroke-width="1"/>
  <text x="340" y="205" text-anchor="middle" font-size="12">4</text>
  
  <!-- Bars -->
  <!-- Bar 1: height 40 -->
  <rect x="60" y="140" width="40" height="40" fill="blue"/>
  
  <!-- Bar 2: height 60 -->
  <rect x="180" y="120" width="40" height="60" fill="blue"/>
  
  <!-- Bar 3: height 80 -->
  <rect x="300" y="100" width="40" height="80" fill="blue"/>
  
  <!-- Bar 4: height 100 -->
  <rect x="340" y="80" width="40" height="100" fill="blue"/>
  
  <!-- Bar 5: height 120 -->
  <rect x="60" y="60" width="40" height="120" fill="blue"/>
  
  <!-- Bar 6: height 140 -->
  <rect x="180" y="40" width="40" height="140" fill="blue"/>
  
  <!-- Bar 7: height 160 -->
  <rect x="300" y="20" width="40" height="160" fill="blue"/>
  
  <!-- Bar 8: height 180 (tallest, red) -->
  <rect x="340" y="0" width="40" height="180" fill="red"/>
</svg>