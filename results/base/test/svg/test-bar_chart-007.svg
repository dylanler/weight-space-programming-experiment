<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="400" height="300" fill="white"/>

  <!-- Chart margins and grid area -->
  <!-- Left margin: 60, Right margin: 20, Top margin: 20, Bottom margin: 60 -->
  <!-- Plot area: x from 60 to 380, y from 20 to 240 -->

  <!-- Bar widths and heights (scaled for visual clarity) -->
  <!-- Heights in data units: 10, 15, 20, 25, 30, 35 -->
  <!-- Scale factor: 35 units = 70px height, so 1 unit = 2px -->
  
  <!-- Bar definitions: index 0-5, with barWidth=40, spacing=20 between bars -->
  <!-- Bar 0: height=10 -->
  <!-- Bar 1: height=15 -->
  <!-- Bar 2: height=20 -->
  <!-- Bar 3: height=25 -->
  <!-- Bar 4: height=30 -->
  <!-- Bar 5: height=35 (tallest, red) -->

  <!-- Define styles -->
  <style>
    .bar { stroke: #0000FF; stroke-width: 2; fill: none; }
    .bar.tall { stroke: #FF0000; stroke-width: 2; fill: none; }
  </style>

  <!-- Bar 0 (blue, height 10) -->
  <rect class="bar" x="60" y="20" width="40" height="20" />

  <!-- Bar 1 (blue, height 15) -->
  <rect class="bar" x="100" y="20" width="40" height="30" />

  <!-- Bar 2 (blue, height 20) -->
  <rect class="bar" x="140" y="20" width="40" height="40" />

  <!-- Bar 3 (blue, height 25) -->
  <rect class="bar" x="180" y="20" width="40" height="50" />

  <!-- Bar 4 (blue, height 30) -->
  <rect class="bar" x="220" y="20" width="40" height="60" />

  <!-- Bar 5 (red, height 35 - tallest) -->
  <rect class="bar tall" x="260" y="20" width="40" height="70" />

</svg>