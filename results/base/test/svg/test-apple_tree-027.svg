  <ellipse cx="290" cy="100" rx="15" ry="10" class="leaf"/>
  <ellipse cx="310" cy="100" rx="15" ry="10" class="leaf"/>
  <ellipse cx="290" cy="120" rx="12" ry="8" class="leaf"/>
  <ellipse cx="310" cy="120" rx="12" ry="8" class="leaf"/>
  <ellipse cx="290" cy="140" rx="10" ry="6" class="leaf"/>
  <ellipse cx="310" cy="140" rx="10" ry="6" class="leaf"/>
  <ellipse cx="290" cy="160" rx="8" ry="5" class="leaf"/>
  <ellipse cx="310" cy="160" rx="8" ry="5" class="leaf"/>
  <ellipse cx="290" cy="180" rx="6" ry="4" class="leaf"/>
  <ellipse cx="310" cy="180" rx="6" ry="4" class="leaf"/>
  <ellipse cx="290" cy="200" rx="4" ry="3" class="leaf"/>
  <ellipse cx="310" cy="200" rx="4" ry="3" class="leaf"/>
</svg>