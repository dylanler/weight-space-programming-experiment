<svg width="400" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Define styles -->
  <style>
    .bar { fill: blue; }
    .tall-bar { fill: red; }
  </style>

  <!-- Background -->
  <rect width="400" height="200" fill="white"/>

  <!-- Bar positions (x=100, 150, 200, 250, 300, 350, 400) -->
  <!-- Heights: 100, 120, 140, 160, 180, 200, 220 -->
  
  <!-- Bar 1 -->
  <rect x="100" y="80" width="50" height="120" class="bar"/>
  
  <!-- Bar 2 -->
  <rect x="150" y="60" width="50" height="140" class="bar"/>
  
  <!-- Bar 3 -->
  <rect x="200" y="40" width="50" height="160" class="bar"/>
  
  <!-- Bar 4 -->
  <rect x="250" y="20" width="50" height="180" class="bar"/>
  
  <!-- Bar 5 -->
  <rect x="300" y="0" width="50" height="200" class="bar"/>
  
  <!-- Bar 6 (Tallest, Red) -->
  <rect x="350" y="0" width="50" height="220" class="tall-bar"/>
  
  <!-- Bar 7 -->
  <rect x="400" y="20" width="50" height="180" class="bar"/>
</svg>