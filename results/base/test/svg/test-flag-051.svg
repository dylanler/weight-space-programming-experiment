<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="200" fill="white"/>
  
  <!-- Top stripe (red) -->
  <rect x="0" y="0" width="300" height="40" fill="#b22234"/>
  
  <!-- Second stripe (white) -->
  <rect x="0" y="40" width="300" height="40" fill="#ffffff"/>
  
  <!-- Third stripe (blue) -->
  <rect x="0" y="80" width="300" height="40" fill="#003399"/>
  
  <!-- Fourth stripe (red) -->
