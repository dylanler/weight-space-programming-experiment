<svg width="300" height="450" xmlns="http://www.w3.org/2000/svg">
  <!-- Building outline -->
  <rect x="100" y="80" width="100" height="370" fill="#a8c6e9"/>
  
  <!-- Floor 1 (bottom) -->
  <rect x="110" y="120" width="80" height="60" fill="#f0f0f0"/>
  <rect x="120" y="120" width="20" height="60" fill="#d0d0d0"/>
  <rect x="140" y="120" width="20" height="60" fill="#d0d0d0"/>
  <rect x="160" y="120" width="20" height="60" fill="#d0d0d0"/>
  <rect x="180" y="120" width="20" height="60" fill="#d0d0d0"/>
  <rect x="200" y="120" width="20" height="60" fill="#d0d0d0"/>
  <rect x="220" y="120" width="20" height="60" fill="#d0d0d0"/>
  <rect x="240" y="120" width="20" height="60" fill="#d0d0d0"/>
  <rect x="260" y="120" width="20" height="60" fill="#d0d0d0"/>
  <rect x="280" y="120" width="20" height="60" fill="#d0d0d0"/>
  
  <!-- Floor 2 -->
  <rect x="110" y="180" width="80" height="60" fill="#f0f0f0"/>
  <rect x="120" y="180" width="20" height="60" fill="#d0d0d0"/>
  <rect x="140" y="180" width="20" height="60" fill="#d0d0d0"/>
  <rect x="160" y="180" width="20" height="60" fill="#d0d0d0"/>
  <rect x="180" y="180" width="20" height="60" fill="#d0d0d0"/>
  <rect x="200" y="180" width="20" height="60" fill="#d0d0d0"/>
  <rect x="220" y="180" width="20" height="60" fill="#d0d0d0"/>
  <rect x="240" y="180" width="20" height="60" fill="#d0d0d0"/>
  <rect x="260" y="180" width="20" height="60" fill="#d0d0d0"/>
  <rect x="280" y="180" width="20" height="60" fill="#d0d0d0"/>
  
  <!-- Floor 3 -->
  <rect x="110" y="240" width="80" height="60" fill="#f0f0f0"/>
  <rect x="120" y="240" width="20" height="60" fill="#d0d0d0"/>
  <rect x="140" y="240" width="20" height="60" fill="#d0d0d0"/>
  <rect x="160" y="240" width="20" height="60" fill="#d0d0d0"/>
  <rect x="180" y="240" width="20" height="60" fill="#d0d0d0"/>
  <rect x="200" y="240" width="20" height="60" fill="#d0d0d0"/>
  <rect x="220" y="240" width="20" height="60" fill="#d0d0d0"/>
  <rect x="240" y="240" width="20" height="60" fill="#d0d0d0"/>
  <rect x="260" y="240" width="20" height="60" fill="#d0d0d0"/>
  <rect x="280" y="240" width="20" height="60" fill="#d0d0d0"/>
  
  <!-- Floor 4 (top) -->
  <rect x="110" y="300" width="80" height="60" fill="#f0f0f0"/>
  <rect x="120" y="300" width="20" height="60" fill="#d0d0d0"/>
  <rect x="140" y="300" width="20" height="60" fill="#d0d0d0"/>
  <rect x="160" y="300" width="20" height="60" fill="#d0d0d0"/>
  <rect x="180" y="300" width="20" height="60" fill="#d0d0d0"/>
  <rect x="200" y="300" width="20" height="60" fill="#d0d0d0"/>
  <rect x="220" y="300" width="20" height="60" fill="#d0d0d0"/>
  <rect x="240" y="300" width="20" height="60" fill="#d0d0d0"/>
  <rect x="260" y="300" width="20" height="60" fill="#d0d0d0"/>
  <rect x="280" y="300" width="20" height="60" fill="#d0d0d0"/>
  
  <!-- Windows on each floor (7 per floor = 28 total, but we need exactly 7 windows in total) -->
  <!-- Re-interpret: "exactly 7 windows in total" means 7 across all floors combined -->
  <!-- Let's place 7 windows distributed across the 4 floors -->
  
  <!-- Floor 1: 2 windows -->
  <rect x="130" y="120" width="20" height="60" fill="#fff"/>
  <rect x="150" y="120" width="20" height="60" fill="#fff"/>
  
  <!-- Floor 2: 2 windows -->
  <rect x="130" y="180" width="20" height="60" fill="#fff"/>
  <rect x="150" y="180" width="20" height="60" fill="#fff"/>
  
  <!-- Floor 3: 2 windows -->
  <rect x="130" y="240" width="20" height="60" fill="#fff"/>
  <rect x="150" y="240" width="20" height="60" fill="#fff"/>
  
  <!-- Floor 4: 1 window -->
  <rect x="130" y="300" width="20" height="60" fill="#fff"/>
</svg>