<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="200" fill="white"/>

  <!-- Top stripe (blue) -->
  <rect x="0" y="0" width="300" height="60" fill="#0055A4"/>

  <!-- Second stripe (red) -->
  <rect x="0" y="60" width="300" height="60" fill="#D52B1E"/>

  <!-- Third stripe (yellow) -->
  <rect x="0" y="120" width="300" height="60" fill="#FFCC00"/>

  <!-- Fourth stripe (green) -->
  <rect x="0" y="180" width="300" height="60" fill="#009B4A"/>

  <!-- Fifth stripe (blue) -->
  <rect x="0" y="240" width="300" height="60" fill="#0055A4"/>

  <!-- Sixth stripe (red) -->
  <rect x="0" y="300" width="300" height="60" fill="#D52B1E"/>

  <!-- Stars (one in the center of the yellow stripe) -->
  <circle cx="150" cy="120" r="4" fill="#FFFFFF"/>
</svg>