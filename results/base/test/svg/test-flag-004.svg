<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="200" fill="white"/>

  <!-- Top stripe (red) -->
  <rect x="0" y="0" width="300" height="66.6667" fill="#b22234"/>

  <!-- Middle stripe (white) -->
  <rect x="0" y="66.6667" width="300" height="66.6667" fill="#ffffff"/>

  <!-- Bottom stripe (blue) -->
  <rect x="0" y="133.3334" width="300" height="66.6667" fill="#003399"/>

  <!-- Stars (9 total, evenly distributed across the flag) -->
  <!-- Row 1: 3 stars in top half -->
  <circle cx="50" cy="33.3334" r="4" fill="#FFD700"/>
  <circle cx="100" cy="33.3334" r="4" fill="#FFD700"/>
  <circle cx="150" cy="33.3334" r="4" fill="#FFD700"/>

  <!-- Row 2: 3 stars in middle half -->
  <circle cx="50" cy="83.3334" r="4" fill="#FFD700"/>
  <circle cx="100" cy="83.3334" r="4" fill="#FFD700"/>
  <circle cx="150" cy="83.3334" r="4" fill="#FFD700"/>

  <!-- Row 3: 3 stars in bottom half -->
  <circle cx="50" cy="133.3334" r="4" fill="#FFD700"/>
  <circle cx="100" cy="133.3334" r="4" fill="#FFD700"/>
  <circle cx="150" cy="133.3334" r="4" fill="#FFD700"/>
</svg>