<svg width="200" height="100" xmlns="http://www.w3.org/2000/svg">
  <!-- Define grid parameters -->
  <!-- 2 rows, 5 columns, total width 200, total height 100 -->
  <!-- Cell width = 200/5 = 40, Cell height = 100/2 = 50 -->
  
  <!-- Row 1 -->
  <circle cx="40" cy="50" r="10" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="80" cy="50" r="10" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="120" cy="50" r="10" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="160" cy="50" r="10" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="200" cy="50" r="10" fill="white" stroke="black" stroke-width="1"/>
  
  <!-- Row 2 -->
  <circle cx="40" cy="100" r="10" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="80" cy="100" r="10" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="120" cy="100" r="10" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="160" cy="100" r="10" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="200" cy="100" r="10" fill="white" stroke="black" stroke-width="1"/>
</svg>