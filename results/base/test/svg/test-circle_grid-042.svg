  <circle cx="150" cy="125" r="10" fill="white"/>
  
  <!-- Row 3 -->
  <circle cx="50" cy="175" r="10" fill="white"/>
  <circle cx="100" cy="175" r="10" fill="white"/>
  <circle cx="150" cy="175" r="10" fill="white"/>
  
  <!-- Row 4 -->
  <circle cx="50" cy="225" r="10" fill="white"/>
