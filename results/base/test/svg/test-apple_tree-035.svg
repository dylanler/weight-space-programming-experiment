<svg width="300" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .apple { fill: #ff4d4d; }
      .leaf { fill: #2d5a27; }
    </style>
  </defs>
  
  <!-- Tree trunk -->
  <rect x="180" y="100" width="60" height="100" rx="5" class="apple"/>
  
  <!-- Main tree branches -->
  <path d="M190 100 L210 100 L210 120 L190 120 Z" class="apple"/>
  <path d="M190 100 L210 100 L210 140 L190 140 Z" class="apple"/>
  <path d="M190 100 L210 100 L210 160 L190 160 Z" class="apple"/>
  
  <!-- Left branch with leaves -->
  <path d="M190 100 L170 100 L170 120 L190 120 Z" class="apple"/>
  <path d="M190 100 L170 100 L170 140 L190 140 Z" class="apple"/>
  <path d="M190 100 L170 100 L170 160 L190 160 Z" class="apple"/>
  <path d="M190 100 L170 100 L170 180 L190 180 Z" class="apple"/>
  
  <!-- Right branch with leaves -->
  <path d="M210 100 L230 100 L230 120 L210 120 Z" class="apple"/>
  <path d="M210 100 L230 100 L230 140 L210 140 Z" class="apple"/>
  <path d="M210 100 L230 100 L230 160 L210 160 Z" class="apple"/>
  <path d="M210 100 L230 100 L230 180 L210 180 Z" class="apple"/>
  
  <!-- Apple positions (10 total) -->
  <!-- Top row -->
  <circle cx="195" cy="105" r="6" class="apple"/>
  <circle cx="205" cy="105" r="6" class="apple"/>
  <circle cx="215" cy="105" r="6" class="apple"/>
  
  <!-- Middle row -->
  <circle cx="185" cy="115" r="6" class="apple"/>
  <circle cx="195" cy="115" r="6" class="apple"/>
  <circle cx="205" cy="115" r="6" class="apple"/>
  <circle cx="215" cy="115" r="6" class="apple"/>
  
  <!-- Bottom row -->
  <circle cx="175" cy="125" r="6" class="apple"/>
  <circle cx="185" cy="125" r="6" class="apple"/>
  <circle cx="195" cy="125" r="6" class="apple"/>
  <circle cx="205" cy="125" r="6" class="apple"/>
  <circle cx="215" cy="125" r="6" class="apple"/>
</svg>