<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="400" height="300" fill="white"/>

  <!-- Chart margins and data range assumption: max value = 100, min = 0, bar width = 60, spacing = 40 -->
  <!-- Bar positions (left): 80, 140, 200, 260 -->
  
  <!-- Bar 1 (blue) -->
  <rect x="80" y="50" width="60" height="100" fill="blue"/>

  <!-- Bar 2 (red, tallest) -->
  <rect x="140" y="20" width="60" height="80" fill="red"/>

  <!-- Bar 3 (blue) -->
  <rect x="200" y="70" width="60" height="30" fill="blue"/>

  <!-- Bar 4 (blue) -->
  <rect x="260" y="90" width="60" height="10" fill="blue"/>

  <!-- X-axis labels -->
  <text x="100" y="290" text-anchor="middle" font-size="12">Bar 1</text>
  <text x="220" y="290" text-anchor="middle" font-size="12">Bar 2</text>
  <text x="340" y="290" text-anchor="middle" font-size="12">Bar 3</text>
  <text x="460" y="290" text-anchor="middle" font-size="12">Bar 4</text>

  <!-- Y-axis label -->
  <text x="20" y="150" text-anchor="middle" font-size="12" transform="rotate(-90 20 150)">Value</text>
</svg>