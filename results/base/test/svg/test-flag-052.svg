  <rect x="0" y="50" width="300" height="25" fill="#009639"/>
  <rect x="0" y="75" width="300" height="25" fill="#00897b"/>
  <rect x="0" y="100" width="300" height="25" fill="#00796b"/>
  <rect x="0" y="125" width="300" height="25" fill="#006400"/>
  <rect x="0" y="150" width="300" height="25" fill="#009639"/>
  <rect x="0" y="175" width="300" height="25" fill="#00897b"/>
  <rect x="0" y="200" width="300" height="25" fill="#00796b"/>
  
  <!-- 1 Star -->
  <polygon points="150,30 165,45 180,45 180,30 165,15 150,30 135,45 150,45" fill="#ffffff"/>
