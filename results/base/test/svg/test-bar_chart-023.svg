<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Define styles -->
  <defs>
    <style>
      .bar { fill: blue; }
      .tall-bar { fill: red; }
    </style>
  </defs>
  
  <!-- Chart margins and axes -->
  <rect x="60" y="60" width="280" height="180" fill="white" stroke="black" stroke-width="1"/>
  
  <!-- X-axis ticks and labels -->
  <line x1="60" y1="220" x2="60" y2="240" stroke="black" stroke-width="1"/>
  <line x1="120" y1="220" x2="120" y2="240" stroke="black" stroke-width="1"/>
  <line x1="180" y1="220" x2="180" y2="240" stroke="black" stroke-width="1"/>
  <line x1="240" y1="220" x2="240" y2="240" stroke="black" stroke-width="1"/>
  <line x1="300" y1="220" x2="300" y2="240" stroke="black" stroke-width="1"/>
  
  <!-- X-axis labels -->
  <text x="60" y="260" text-anchor="middle" font-size="12">1</text>
  <text x="120" y="260" text-anchor="middle" font-size="12">2</text>
  <text x="180" y="260" text-anchor="middle" font-size="12">3</text>
  <text x="240" y="260" text-anchor="middle" font-size="12">4</text>
  <text x="300" y="260" text-anchor="middle" font-size="12">5</text>
  
  <!-- Y-axis ticks and labels -->
  <line x1="50" y1="220" x2="40" y2="220" stroke="black" stroke-width="1"/>
  <line x1="50" y1="160" x2="40" y2="160" stroke="black" stroke-width="1"/>
  <line x1="50" y1="100" x2="40" y2="100" stroke="black" stroke-width="1"/>
  <line x1="50" y1="40" x2="40" y2="40" stroke="black" stroke-width="1"/>
  <line x1="50" y1="20" x2="40" y2="20" stroke="black" stroke-width="1"/>
  
  <!-- Y-axis labels -->
  <text x="40" y="240" text-anchor="end" font-size="12">100</text>
  <text x="40" y="160" text-anchor="end" font-size="12">200</text>
  <text x="40" y="100" text-anchor="end" font-size="12">300</text>
  <text x="40" y="40" text-anchor="end" font-size="12">400</text>
  <text x="40" y="20" text-anchor="end" font-size="12">500</text>
  
  <!-- Bars -->
  <!-- Bar 1 -->
  <rect x="60" y="180" width="20" height="40" class="bar"/>
  <!-- Bar 2 -->
  <rect x="120" y="140" width="20" height="60" class="bar"/>
  <!-- Bar 3 -->
  <rect x="180" y="100" width="20" height="100" class="bar"/>
  <!-- Bar 4 -->
  <rect x="240" y="60" width="20" height="140" class="bar"/>
  <!-- Bar 5 (Tallest, Red) -->
  <rect x="300" y="20" width="20" height="180" class="tall-bar"/>
  <!-- Bar 6 -->
  <rect x="360" y="120" width="20" height="80" class="bar"/>
  <!-- Bar 7 -->
  <rect x="420" y="80" width="20" height="120" class="bar"/>
  <!-- Bar 8 -->
  <rect x="480" y="40" width="20" height="160" class="bar"/>
  <!-- Bar 9 -->
  <rect x="540" y="100" width="20" height="100" class="bar"/>
</svg>