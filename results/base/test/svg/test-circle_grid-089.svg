  <circle cx="100" cy="50" r="15" fill="white" stroke="black" stroke-width="2"/>
  <circle cx="150" cy="50" r="15" fill="white" stroke="black" stroke-width="2"/>
  <circle cx="50" cy="100" r="15" fill="white" stroke="black" stroke-width="2"/>
  <circle cx="100" cy="100" r="15" fill="white" stroke="black" stroke-width="2"/>
  <circle cx="150" cy="100" r="15" fill="white" stroke="black" stroke-width="2"/>
  <circle cx="50" cy="150" r="15" fill="white" stroke="black" stroke-width="2"/>
  <circle cx="100" cy="150" r="15" fill="white" stroke="black" stroke-width="2"/>
  <circle cx="150" cy="150" r="15" fill="white" stroke="black" stroke-width="2"/>
</svg>