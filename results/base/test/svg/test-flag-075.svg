<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="200" fill="white"/>
  
  <!-- 9 Horizontal Stripes -->
  <rect x="0" y="0" width="300" height="20" fill="#003366"/>
  <rect x="0" y="25" width="300" height="20" fill="#0066cc"/>
  <rect x="0" y="50" width="300" height="20" fill="#0099ff"/>
  <rect x="0" y="75" width="300" height="20" fill="#00ccff"/>
  <rect x="0" y="100" width="300" height="20" fill="#00ffff"/>
  <rect x="0" y="125" width="300" height="20" fill="#0088ff"/>
  <rect x="0" y="150" width="300" height="20" fill="#003366"/>
  <rect x="0" y="175" width="300" height="20" fill="#0066cc"/>
  <rect x="0" y="200" width="300" height="20" fill="#0099ff"/>
  
  <!-- 4 Stars -->
  <g transform="translate(100, 50)">
    <polygon points="0,-6 3,0 0,6 -3,0" fill="#ffffff"/>
  </g>
  <g transform="translate(100, 100)">
    <polygon points="0,-6 3,0 0,6 -3,0" fill="#ffffff"/>
  </g>
  <g transform="translate(100, 150)">
    <polygon points="0,-6 3,0 0,6 -3,0" fill="#ffffff"/>
  </g>
  <g transform="translate(100, 190)">
    <polygon points="0,-6 3,0 0,6 -3,0" fill="#ffffff"/>
  </g>
</svg>