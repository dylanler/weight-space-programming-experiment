<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="400" height="300" fill="white"/>

  <!-- Chart margins and data range -->
  <!-- Left margin: 60, Right margin: 20, Top margin: 20, Bottom margin: 60 -->
  <!-- Data range: max value = 100 (red bar), min value = 50 -->
  <!-- Bar width: 40, spacing: 20 -->
  
  <!-- Define styles -->
  <defs>
    <style>
      .bar { fill: #ff0000; }
      .other-bar { fill: #0000ff; }
    </style>
  </defs>

  <!-- Bars -->
  <!-- Bar 1: Height 100 (tallest) -->
  <rect class="bar" x="60" y="20" width="40" height="80"/>
  
  <!-- Bar 2: Height 70 -->
  <rect class="other-bar" x="110" y="30" width="40" height="70"/>
  
  <!-- Bar 3: Height 50 -->
  <rect class="other-bar" x="160" y="50" width="40" height="50"/>
  
  <!-- Bar 4: Height 40 -->
  <rect class="other-bar" x="210" y="60" width="40" height="40"/>
  
  <!-- Bar 5: Height 30 -->
  <rect class="other-bar" x="260" y="70" width="40" height="30"/>
</svg>