<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="400" height="300" fill="white"/>

  <!-- Chart margins and data range -->
  <!-- Left margin: 60, Right margin: 20, Top margin: 20, Bottom margin: 60 -->
  <!-- Data range: max value = 100 (bar 2), min value = 50 -->
  <!-- Bar width: 40, spacing: 20 -->
  
  <!-- Bars defined by x position and height (proportional to value) -->
  <!-- Bar 1: x=60, height=80 (value 80) -->
  <rect x="60" y="20" width="40" height="80" fill="#1E90FF"/>
  
  <!-- Bar 2: x=100, height=100 (value 100) - Tallest, colored red -->
  <rect x="100" y="10" width="40" height="90" fill="#FF0000"/>
  
  <!-- Bar 3: x=140, height=70 (value 70) -->
  <rect x="140" y="30" width="40" height="70" fill="#1E90FF"/>
  
  <!-- Bar 4: x=180, height=50 (value 50) -->
  <rect x="180" y="50" width="40" height="50" fill="#1E90FF"/>
  
  <!-- Bar 5: x=220, height=60 (value 60) -->
  <rect x="220" y="40" width="40" height="60" fill="#1E90FF"/>
  
  <!-- Bar 6: x=260, height=40 (value 40) -->
  <rect x="260" y="60" width="40" height="40" fill="#1E90FF"/>

  <!-- X-axis labels -->
  <text x="60" y="280" text-anchor="middle" font-size="12">1</text>
  <text x="100" y="280" text-anchor="middle" font-size="12">2</text>
  <text x="140" y="280" text-anchor="middle" font-size="12">3</text>
  <text x="180" y="280" text-anchor="middle" font-size="12">4</text>
  <text x="220" y="280" text-anchor="middle" font-size="12">5</text>
  <text x="260" y="280" text-anchor="middle" font-size="12">6</text>

  <!-- Y-axis label -->
  <text x="20" y="150" text-anchor="middle" font-size="12" transform="rotate(-90, 20, 150)">Value</text>
</svg>