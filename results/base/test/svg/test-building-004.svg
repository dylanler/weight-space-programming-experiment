<svg width="300" height="450" xmlns="http://www.w3.org/2000/svg">
  <!-- Building outline -->
  <rect x="100" y="60" width="100" height="330" fill="#8B7355"/>
  
  <!-- Floors (7 floors) -->
  <!-- Floor 1 -->
  <rect x="105" y="90" width="90" height="40" fill="#AABCBF"/>
  <!-- Floor 2 -->
  <rect x="105" y="130" width="90" height="40" fill="#AABCBF"/>
  <!-- Floor 3 -->
  <rect x="105" y="170" width="90" height="40" fill="#AABCBF"/>
  <!-- Floor 4 -->
  <rect x="105" y="210" width="90" height="40" fill="#AABCBF"/>
  <!-- Floor 5 -->
  <rect x="105" y="250" width="90" height="40" fill="#AABCBF"/>
  
  <!-- Windows: 5 total, 1 per floor on each side (except top/bottom edges) -->
  <!-- Floor 1: Left and Right windows -->
  <rect x="115" y="95" width="10" height="35" fill="#E0C090"/>
  <rect x="175" y="95" width="10" height="35" fill="#E0C090"/>
  <!-- Floor 2: Left and Right windows -->
  <rect x="115" y="135" width="10" height="35" fill="#E0C090"/>
  <rect x="175" y="135" width="10" height="35" fill="#E0C090"/>
  <!-- Floor 3: Left and Right windows -->
  <rect x="115" y="175" width="10" height="35" fill="#E0C090"/>
  <rect x="175" y="175" width="10" height="35" fill="#E0C090"/>
  <!-- Floor 4: Left and Right windows -->
  <rect x="115" y="215" width="10" height="35" fill="#E0C090"/>
  <rect x="175" y="215" width="10" height="35" fill="#E0C090"/>
  <!-- Floor 5: Left and Right windows -->
  <rect x="115" y="255" width="10" height="35" fill="#E0C090"/>
  <rect x="175" y="255" width="10" height="35" fill="#E0C090"/>

  <!-- Roof line -->
  <line x1="100" y1="60" x2="200" y2="60" stroke="#5D4E37" stroke-width="2"/>
</svg>