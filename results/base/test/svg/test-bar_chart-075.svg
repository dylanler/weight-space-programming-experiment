<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Define styles -->
  <defs>
    <style>
      .bar { fill: blue; }
      .tall-bar { fill: red; }
    </style>
  </defs>

  <!-- Chart margins and dimensions -->
  <!-- Left margin: 60, Right margin: 20, Top margin: 20, Bottom margin: 60 -->
  <!-- Plot area: x from 60 to 380, y from 20 to 240 -->
  
  <!-- Bar widths (each bar = 50px) -->
  <!-- Bars at positions: 100, 150, 200, 250, 300 -->
  
  <!-- Bar 1 (x=100) -->
  <rect x="100" y="20" width="50" height="120" class="bar" />
  
  <!-- Bar 2 (x=150) -->
  <rect x="150" y="20" width="50" height="120" class="bar" />
  
  <!-- Bar 3 (x=200) - Tallest, colored red -->
  <rect x="200" y="20" width="50" height="200" class="tall-bar" />
  
  <!-- Bar 4 (x=250) -->
  <rect x="250" y="20" width="50" height="120" class="bar" />
  
  <!-- Bar 5 (x=300) -->
  <rect x="300" y="20" width="50" height="120" class="bar" />
</svg>