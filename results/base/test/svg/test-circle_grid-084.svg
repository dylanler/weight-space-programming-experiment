<svg width="200" height="150" xmlns="http://www.w3.org/2000/svg">
  <!-- Define grid parameters -->
  <!-- 3 rows, 5 columns, total cells = 15 -->
  <!-- Cell size: 200 / 5 = 40px per cell horizontally; 150 / 3 = 50px per cell vertically -->
  
  <!-- Row 1 (y=0) -->
  <circle cx="40" cy="0" r="8" fill="#e74c3c"/>
  <circle cx="80" cy="0" r="8" fill="#3498db"/>
  <circle cx="120" cy="0" r="8" fill="#f1c40f"/>
  <circle cx="160" cy="0" r="8" fill="#9b59b6"/>
  <circle cx="200" cy="0" r="8" fill="#2ecc71"/>

  <!-- Row 2 (y=50) -->
  <circle cx="40" cy="50" r="8" fill="#e74c3c"/>
  <circle cx="80" cy="50" r="8" fill="#3498db"/>
  <circle cx="120" cy="50" r="8" fill="#f1c40f"/>
  <circle cx="160" cy="50" r="8" fill="#9b59b6"/>
  <circle cx="200" cy="50" r="8" fill="#2ecc71"/>

  <!-- Row 3 (y=100) -->
  <circle cx="40" cy="100" r="8" fill="#e74c3c"/>
  <circle cx="80" cy="100" r="8" fill="#3498db"/>
  <circle cx="120" cy="100" r="8" fill="#f1c40f"/>
  <circle cx="160" cy="100" r="8" fill="#9b59b6"/>
  <circle cx="200" cy="100" r="8" fill="#2ecc71"/>
</svg>