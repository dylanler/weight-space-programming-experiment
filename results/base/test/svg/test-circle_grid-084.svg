<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Define grid parameters -->
  <!-- 3 rows, 5 columns, total 15 circles -->
  <!-- Cell size: 200 / 15 ≈ 13.33 px -->
  
  <!-- Row 1 -->
  <circle cx="20" cy="20" r="10" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="50" cy="20" r="10" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="80" cy="20" r="10" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="110" cy="20" r="10" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="140" cy="20" r="10" fill="white" stroke="black" stroke-width="1"/>
  
  <!-- Row 2 -->
  <circle cx="20" cy="50" r="10" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="50" cy="50" r="10" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="80" cy="50" r="10" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="110" cy="50" r="10" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="140" cy="50" r="10" fill="white" stroke="black" stroke-width="1"/>
  
  <!-- Row 3 -->
  <circle cx="20" cy="80" r="10" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="50" cy="80" r="10" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="80" cy="80" r="10" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="110" cy="80" r="10" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="140" cy="80" r="10" fill="white" stroke="black" stroke-width="1"/>
</svg>