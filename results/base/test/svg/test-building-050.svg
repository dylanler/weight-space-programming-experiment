<svg width="400" height="560" viewBox="0 0 400 560" xmlns="http://www.w3.org/2000/svg">
  <!-- Building outline -->
  <rect x="100" y="80" width="200" height="400" fill="#a8c6d9"/>
  
  <!-- Floors (8 floors) -->
  <!-- Floor 1 -->
  <rect x="110" y="120" width="180" height="60" fill="#e8f4f7"/>
  <!-- Floor 2 -->
  <rect x="110" y="180" width="180" height="60" fill="#e8f4f7"/>
  <!-- Floor 3 -->
  <rect x="110" y="240" width="180" height="60" fill="#e8f4f7"/>
  <!-- Floor 4 -->
  <rect x="110" y="300" width="180" height="60" fill="#e8f4f7"/>
  <!-- Floor 5 -->
  <rect x="110" y="360" width="180" height="60" fill="#e8f4f7"/>
