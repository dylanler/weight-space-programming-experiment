<svg width="400" height="560" xmlns="http://www.w3.org/2000/svg">
  <!-- Building outline -->
  <rect x="100" y="80" width="200" height="480" fill="#a8c6e9"/>
  
  <!-- Floors (7 floors) -->
  <!-- Floor 1 -->
  <rect x="110" y="100" width="180" height="60" fill="#f0f4f8"/>
  <!-- Floor 2 -->
  <rect x="110" y="160" width="180" height="60" fill="#f0f4f8"/>
  <!-- Floor 3 -->
  <rect x="110" y="220" width="180" height="60" fill="#f0f4f8"/>
  <!-- Floor 4 -->
  <rect x="110" y="280" width="180" height="60" fill="#f0f4f8"/>
  <!-- Floor 5 -->
  <rect x="110" y="340" width="180" height="60" fill="#f0f4f8"/>
  <!-- Floor 6 -->
  <rect x="110" y="400" width="180" height="60" fill="#f0f4f8"/>
  <!-- Floor 7 (Ground level) -->
  <rect x="110" y="460" width="180" height="60" fill="#dceef8"/>
  
  <!-- Windows: 23 total, 7 per floor = 49 windows. But requirement says exactly 23 windows in total. 
       So we need to reduce the number of windows while keeping 7 floors.
       Let's place 23 windows distributed across the 7 floors.
       We'll place them on every other floor or alternate to get 23.
       For example: 4 + 4 + 4 + 4 + 4 + 4 + 1 = 25 (too many).
       Let's do: 3+3+3+3+3+3+1 = 21 (too few).
       Try: 4+4+4+4+3+3+1 = 23. Perfect.
       
       Floor 1: 4 windows
       Floor 2: 4 windows
       Floor 3: 4 windows
       Floor 4: 4 windows
       Floor 5: 3 windows
       Floor 6: 3 windows
       Floor 7: 1 window
       
       Total: 4+4+4+4+3+3+1 = 23 windows.
     -->

  <!-- Floor 1: 4 windows -->
  <rect x="120" y="100" width="20" height="60" fill="#fff"/>
  <rect x="140" y="100" width="20" height="60" fill="#fff"/>
  <rect x="160" y="100" width="20" height="60" fill="#fff"/>
  <rect x="180" y="100" width="20" height="60" fill="#fff"/>

  <!-- Floor 2: 4 windows -->
  <rect x="120" y="160" width="20" height="60" fill="#fff"/>
  <rect x="140" y="160" width="20" height="60" fill="#fff"/>
  <rect x="160" y="160" width="20" height="60" fill="#fff"/>
  <rect x="180" y="160" width="20" height="60" fill="#fff"/>

  <!-- Floor 3: 4 windows -->
  <rect x="120" y="220" width="20" height="60" fill="#fff"/>
  <rect x="140" y="220" width="20" height="60" fill="#fff"/>
  <rect x="160" y="220" width="20" height="60" fill="#fff"/>
  <rect x="180" y="220" width="20" height="60" fill="#fff"/>

  <!-- Floor 4: 4 windows -->
  <rect x="120" y="280" width="20" height="60" fill="#fff"/>
  <rect x="140" y="280" width="20" height="60" fill="#fff"/>
  <rect x="160" y="280" width="20" height="60" fill="#fff"/>
  <rect x="180" y="280" width="20" height="60" fill="#fff"/>

  <!-- Floor 5: 3 windows -->
  <rect x="120" y="340" width="20" height="60" fill="#fff"/>
  <rect x="140" y="340" width="20" height="60" fill="#fff"/>
  <rect x="160" y="340" width="20" height="60" fill="#fff"/>

  <!-- Floor 6: 3 windows -->
  <rect x="120" y="400" width="20" height="60" fill="#fff"/>
  <rect x="140" y="400" width="20" height="60" fill="#fff"/>
  <rect x="160" y="400" width="20" height="60" fill="#fff"/>

  <!-- Floor 7: 1 window -->
  <rect x="120" y="460" width="20" height="60" fill="#fff"/>
</svg>