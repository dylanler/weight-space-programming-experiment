<svg width="400" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Define styles -->
  <defs>
    <style>
      .bar { fill: blue; }
      .tall-bar { fill: red; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect x="0" y="0" width="400" height="200" fill="white"/>
  
  <!-- Bar positions (assuming equal width of 50px, starting at x=50) -->
  <!-- Bar 1: x=50, height=40 -->
  <rect x="50" y="120" width="50" height="40" class="bar"/>
  
  <!-- Bar 2: x=100, height=30 -->
  <rect x="100" y="130" width="50" height="30" class="bar"/>
  
  <!-- Bar 3: x=150, height=80 (tallest, red) -->
  <rect x="150" y="100" width="50" height="80" class="tall-bar"/>
  
  <!-- Bar 4: x=200, height=50 -->
  <rect x="200" y="110" width="50" height="50" class="bar"/>
  
  <!-- Bar 5: x=250, height=20 -->
  <rect x="250" y="140" width="50" height="20" class="bar"/>
  
  <!-- Bar 6: x=300, height=60 -->
  <rect x="300" y="80" width="50" height="60" class="bar"/>
  
  <!-- Bar 7: x=350, height=35 -->
  <rect x="350" y="115" width="50" height="35" class="bar"/>
</svg>