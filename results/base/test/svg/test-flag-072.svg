<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="200" fill="white"/>

  <!-- Top stripe (red) -->
  <rect x="0" y="0" width="300" height="60" fill="#b22234"/>

  <!-- Middle stripe (white) -->
  <rect x="0" y="60" width="300" height="80" fill="#ffffff"/>

  <!-- Bottom stripe (blue) -->
  <rect x="0" y="140" width="300" height="60" fill="#003399"/>

  <!-- Stars (9 total, evenly distributed across the white middle stripe) -->
  <!-- Row 1: 3 stars -->
  <circle cx="50" cy="100" r="4" fill="#fff"/>
  <circle cx="100" cy="100" r="4" fill="#fff"/>
  <circle cx="150" cy="100" r="4" fill="#fff"/>

  <!-- Row 2: 3 stars -->
  <circle cx="50" cy="140" r="4" fill="#fff"/>
  <circle cx="100" cy="140" r="4" fill="#fff"/>
  <circle cx="150" cy="140" r="4" fill="#fff"/>

  <!-- Row 3: 3 stars -->
  <circle cx="50" cy="180" r="4" fill="#fff"/>
  <circle cx="100" cy="180" r="4" fill="#fff"/>
  <circle cx="150" cy="180" r="4" fill="#fff"/>
</svg>