<svg width="300" height="450" viewBox="0 0 300 450" xmlns="http://www.w3.org/2000/svg">
  <!-- Building outline -->
  <rect x="100" y="60" width="100" height="330" fill="#8B7355"/>
  
  <!-- Floors (7 floors total) -->
  <!-- Floor 1 -->
  <rect x="100" y="90" width="100" height="40" fill="#AABCBF"/>
  <!-- Floor 2 -->
  <rect x="100" y="130" width="100" height="40" fill="#AABCBF"/>
  <!-- Floor 3 -->
  <rect x="100" y="170" width="100" height="40" fill="#AABCBF"/>
  <!-- Floor 4 -->
  <rect x="100" y="210" width="100" height="40" fill="#AABCBF"/>
  <!-- Floor 5 -->
  <rect x="100" y="250" width="100" height="40" fill="#AABCBF"/>
  <!-- Floor 6 -->
  <rect x="100" y="290" width="100" height="40" fill="#AABCBF"/>
  <!-- Floor 7 (top floor) -->
  <rect x="100" y="330" width="100" height="40" fill="#AABCBF"/>
  
  <!-- Windows: 3 windows in total, distributed across floors -->
  <!-- Window on Floor 1 (left) -->
  <rect x="120" y="95" width="20" height="35" fill="#E0CBA8"/>
  <!-- Window on Floor 2 (right) -->
  <rect x="120" y="135" width="20" height="35" fill="#E0CBA8"/>
  <!-- Window on Floor 3 (center) -->
  <rect x="120" y="175" width="20" height="35" fill="#E0CBA8"/>
