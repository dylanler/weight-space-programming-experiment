<svg width="300" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Building outline -->
  <rect x="100" y="50" width="100" height="300" fill="#8B4513" stroke="#5D2906" stroke-width="2"/>
  
  <!-- Floor lines (7 floors) -->
  <line x1="100" y1="50" x2="200" y2="50" stroke="#5D2906" stroke-width="1"/>
  <line x1="100" y1="100" x2="200" y2="100" stroke="#5D2906" stroke-width="1"/>
  <line x1="100" y1="150" x2="200" y2="150" stroke="#5D2906" stroke-width="1"/>
  <line x1="100" y1="200" x2="200" y2="200" stroke="#5D2906" stroke-width="1"/>
  <line x1="100" y1="250" x2="200" y2="250" stroke="#5D2906" stroke-width="1"/>
  <line x1="100" y1="300" x2="200" y2="300" stroke="#5D2906" stroke-width="1"/>
  <line x1="100" y1="350" x2="200" y2="350" stroke="#5D2906" stroke-width="1"/>
  
  <!-- Windows (3 total, 1 per floor) -->
  <!-- Floor 1 -->
  <rect x="120" y="60" width="20" height="30" fill="#A9A9A9" stroke="#5D2906" stroke-width="1"/>
  <rect x="160" y="60" width="20" height="30" fill="#A9A9A9" stroke="#5D2906" stroke-width="1"/>
  
  <!-- Floor 2 -->
  <rect x="120" y="110" width="20" height="30" fill="#A9A9A9" stroke="#5D2906" stroke-width="1"/>
  <rect x="160" y="110" width="20" height="30" fill="#A9A9A9" stroke="#5D2906" stroke-width="1"/>
  
  <!-- Floor 3 -->
  <rect x="120" y="160" width="20" height="30" fill="#A9A9A9" stroke="#5D2906" stroke-width="1"/>
  <rect x="160" y="160" width="20" height="30" fill="#A9A9A9" stroke="#5D2906" stroke-width="1"/>
</svg>