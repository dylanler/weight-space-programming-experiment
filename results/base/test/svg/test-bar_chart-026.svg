<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="white"/>
  
  <!-- Chart margins -->
  <rect x="60" y="20" width="280" height="260" fill="none" stroke="black" stroke-width="1"/>
  
  <!-- Y-axis labels -->
  <text x="50" y="100" text-anchor="end" font-size="12">0</text>
  <text x="50" y="140" text-anchor="end" font-size="12">50</text>
  <text x="50" y="180" text-anchor="end" font-size="12">100</text>
  <text x="50" y="220" text-anchor="end" font-size="12">150</text>
  <text x="50" y="260" text-anchor="end" font-size="12">200</text>
  
  <!-- X-axis labels -->
  <text x="100" y="290" text-anchor="middle" font-size="12">1</text>
  <text x="160" y="290" text-anchor="middle" font-size="12">2</text>
  <text x="220" y="290" text-anchor="middle" font-size="12">3</text>
  <text x="280" y="290" text-anchor="middle" font-size="12">4</text>
  <text x="340" y="290" text-anchor="middle" font-size="12">5</text>
  
  <!-- Bars -->
  <!-- Bar 1 (blue) -->
  <rect x="60" y="100" width="20" height="100" fill="blue"/>
  
  <!-- Bar 2 (blue) -->
  <rect x="120" y="100" width="20" height="100" fill="blue"/>
  
  <!-- Bar 3 (blue) -->
  <rect x="180" y="100" width="20" height="100" fill="blue"/>
  
  <!-- Bar 4 (blue) -->
  <rect x="240" y="100" width="20" height="100" fill="blue"/>
  
  <!-- Bar 5 (red) - tallest -->
  <rect x="300" y="20" width="20" height="200" fill="red"/>
  
  <!-- Bar 6 (blue) -->
  <rect x="360" y="100" width="20" height="100" fill="blue"/>
  
  <!-- Bar 7 (blue) -->
  <rect x="420" y="100" width="20" height="100" fill="blue"/>
  
  <!-- Bar 8 (blue) -->
  <rect x="480" y="100" width="20" height="100" fill="blue"/>
  
  <!-- Bar 9 (blue) -->
  <rect x="540" y="100" width="20" height="100" fill="blue"/>
</svg>