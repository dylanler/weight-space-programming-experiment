<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="400" height="300" fill="white"/>

  <!-- Chart margins and data range assumption: max value = 100, min = 0, bar width = 20, spacing = 60 -->
  <!-- Bars will be at x positions: 60, 120, 180, 240, 300 (5th bar), 360, 420, 480, 540 -->
  
  <!-- Bar definitions: height proportional to value. Let's assume values: [20, 30, 40, 50, 100, 60, 70, 80, 90] -->
  <!-- Blue bars except 5th (red) -->
  
  <!-- Bar 1: x=60, h=20 -->
  <rect x="60" y="20" width="20" height="20" fill="#1E90FF"/>
  
  <!-- Bar 2: x=120, h=30 -->
  <rect x="120" y="70" width="20" height="30" fill="#1E90FF"/>
  
  <!-- Bar 3: x=180, h=40 -->
  <rect x="180" y="60" width="20" height="40" fill="#1E90FF"/>
  
  <!-- Bar 4: x=240, h=50 -->
  <rect x="240" y="50" width="20" height="50" fill="#1E90FF"/>
  
  <!-- Bar 5: x=300, h=100 (TALLER, RED) -->
  <rect x="300" y="0" width="20" height="100" fill="#FF0000"/>
  
  <!-- Bar 6: x=360, h=60 -->
  <rect x="360" y="40" width="20" height="60" fill="#1E90FF"/>
  
  <!-- Bar 7: x=420, h=70 -->
  <rect x="420" y="30" width="20" height="70" fill="#1E90FF"/>
  
  <!-- Bar 8: x=480, h=80 -->
  <rect x="480" y="20" width="20" height="80" fill="#1E90FF"/>
  
  <!-- Bar 9: x=540, h=90 -->
  <rect x="540" y="10" width="20" height="90" fill="#1E90FF"/>
</svg>