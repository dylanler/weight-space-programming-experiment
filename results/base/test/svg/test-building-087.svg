<svg width="200" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Building outline -->
  <rect x="50" y="40" width="100" height="220" fill="#8B7355"/>
  
  <!-- Floor 1 (ground floor) -->
  <rect x="60" y="90" width="80" height="60" fill="#AABCBF"/>
  <rect x="70" y="90" width="60" height="60" fill="#E0E0E0"/>
  
  <!-- Floor 2 -->
  <rect x="60" y="150" width="80" height="60" fill="#AABCBF"/>
  <rect x="70" y="150" width="60" height="60" fill="#E0E0E0"/>
  
  <!-- Floor 3 -->
  <rect x="60" y="210" width="80" height="60" fill="#AABCBF"/>
  <rect x="70" y="210" width="60" height="60" fill="#E0E0E0"/>
  
  <!-- Windows on Floor 1 -->
  <rect x="80" y="100" width="20" height="40" fill="#FFFFFF"/>
  <rect x="110" y="100" width="20" height="40" fill="#FFFFFF"/>
  
  <!-- Windows on Floor 2 -->
  <rect x="80" y="160" width="20" height="40" fill="#FFFFFF"/>
  <rect x="110" y="160" width="20" height="40" fill="#FFFFFF"/>
</svg>