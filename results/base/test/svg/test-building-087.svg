<svg width="200" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Building outline -->
  <rect x="50" y="50" width="100" height="200" fill="#8B4513" stroke="#5D2906" stroke-width="2"/>
  
  <!-- Floor 1 -->
  <rect x="60" y="100" width="80" height="60" fill="#A0522D" stroke="#5D2906" stroke-width="2"/>
  
  <!-- Floor 2 -->
  <rect x="60" y="160" width="80" height="60" fill="#A0522D" stroke="#5D2906" stroke-width="2"/>
  
  <!-- Floor 3 -->
  <rect x="60" y="220" width="80" height="60" fill="#A0522D" stroke="#5D2906" stroke-width="2"/>
  
  <!-- Window 1 (Floor 1) -->
  <rect x="75" y="110" width="20" height="40" fill="#E0E0E0" stroke="#5D2906" stroke-width="1"/>
  
  <!-- Window 2 (Floor 2) -->
  <rect x="75" y="170" width="20" height="40" fill="#E0E0E0" stroke="#5D2906" stroke-width="1"/>
</svg>