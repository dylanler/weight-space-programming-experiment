<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="white"/>
  
  <!-- Chart margins -->
  <rect x="60" y="60" width="280" height="180" fill="white"/>
  
  <!-- Grid lines -->
  <line x1="60" y1="60" x2="340" y2="60" stroke="black" stroke-width="1"/>
  <line x1="60" y1="120" x2="340" y2="120" stroke="black" stroke-width="1"/>
  <line x1="60" y1="180" x2="340" y2="180" stroke="black" stroke-width="1"/>
  
  <!-- X-axis ticks and labels -->
  <line x1="60" y1="180" x2="60" y2="185" stroke="black" stroke-width="1"/>
  <text x="60" y="200" text-anchor="middle" font-size="12">1</text>
  
  <line x1="180" y1="180" x2="180" y2="185" stroke="black" stroke-width="1"/>
  <text x="180" y="200" text-anchor="middle" font-size="12">2</text>
  
  <line x1="300" y1="180" x2="300" y2="185" stroke="black" stroke-width="1"/>
  <text x="300" y="200" text-anchor="middle" font-size="12">3</text>
  
  <line x1="420" y1="180" x2="420" y2="185" stroke="black" stroke-width="1"/>
  <text x="420" y="200" text-anchor="middle" font-size="12">4</text>
  
  <!-- Y-axis ticks and labels -->
  <line x1="55" y1="60" x2="60" y2="60" stroke="black" stroke-width="1"/>
  <text x="50" y="65" text-anchor="end" font-size="12">0</text>
  
  <line x1="55" y1="120" x2="60" y2="120" stroke="black" stroke-width="1"/>
  <text x="50" y="125" text-anchor="end" font-size="12">50</text>
  
  <line x1="55" y1="180" x2="60" y2="180" stroke="black" stroke-width="1"/>
  <text x="50" y="185" text-anchor="end" font-size="12">100</text>
  
  <!-- Bars -->
  <!-- Bar 1: height 50 -->
  <rect x="60" y="120" width="40" height="50" fill="blue"/>
  
  <!-- Bar 2: height 150 (tallest, red) -->
  <rect x="180" y="30" width="40" height="150" fill="red"/>
  
  <!-- Bar 3: height 75 -->
  <rect x="300" y="110" width="40" height="70" fill="blue"/>
  
  <!-- Bar 4: height 100 -->
  <rect x="420" y="80" width="40" height="100" fill="blue"/>
  
  <!-- Bar 5: height 50 -->
  <rect x="60" y="120" width="40" height="50" fill="blue"/>
  
  <!-- Bar 6: height 100 -->
  <rect x="180" y="80" width="40" height="100" fill="blue"/>
  
  <!-- Bar 7: height 75 -->
  <rect x="300" y="110" width="40" height="70" fill="blue"/>
</svg>