<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="400" height="300" fill="white"/>

  <!-- Chart margins and data range -->
  <!-- Left margin: 60, Right margin: 20, Top margin: 20, Bottom margin: 60 -->
  <!-- Data range: max value = 100 (bar 2), min value = 50 -->
  <!-- Bar width: 40, spacing: 20 -->
  
  <!-- Bar 1 (blue) -->
  <rect x="60" y="80" width="40" height="50" fill="blue"/>
  
  <!-- Bar 2 (red) - tallest -->
  <rect x="120" y="40" width="40" height="60" fill="red"/>
  
  <!-- Bar 3 (blue) -->
  <rect x="180" y="120" width="40" height="40" fill="blue"/>
  
  <!-- Bar 4 (blue) -->
  <rect x="240" y="100" width="40" height="50" fill="blue"/>
  
  <!-- Bar 5 (blue) -->
  <rect x="300" y="90" width="40" height="60" fill="blue"/>

  <!-- X-axis labels -->
  <text x="70" y="290" text-anchor="middle" font-size="12">1</text>
  <text x="130" y="290" text-anchor="middle" font-size="12">2</text>
  <text x="190" y="290" text-anchor="middle" font-size="12">3</text>
  <text x="250" y="290" text-anchor="middle" font-size="12">4</text>
  <text x="310" y="290" text-anchor="middle" font-size="12">5</text>

  <!-- Y-axis label -->
  <text x="20" y="150" text-anchor="middle" font-size="12" transform="rotate(-90, 20, 150)">Value</text>
</svg>