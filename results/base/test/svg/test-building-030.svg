<svg width="400" height="500" xmlns="http://www.w3.org/2000/svg">
  <!-- Building outline -->
  <rect x="100" y="50" width="200" height="400" fill="#8B4513" stroke="#5D2906" stroke-width="2"/>
  
  <!-- Floors (8 floors) -->
  <!-- Floor 1 -->
  <rect x="110" y="100" width="180" height="60" fill="#A0522D" stroke="#5D2906" stroke-width="1"/>
  <!-- Floor 2 -->
  <rect x="110" y="160" width="180" height="60" fill="#A0522D" stroke="#5D2906" stroke-width="1"/>
  <!-- Floor 3 -->
  <rect x="110" y="220" width="180" height="60" fill="#A0522D" stroke="#5D2906" stroke-width="1"/>
  <!-- Floor 4 -->
  <rect x="110" y="280" width="180" height="60" fill="#A0522D" stroke="#5D2906" stroke-width="1"/>
  <!-- Floor 5 -->
  <rect x="110" y="340" width="180" height="60" fill="#A0522D" stroke="#5D2906" stroke-width="1"/>
  <!-- Floor 6 -->
  <rect x="110" y="400" width="180" height="60" fill="#A0522D" stroke="#5D2906" stroke-width="1"/>
  <!-- Floor 7 -->
  <rect x="110" y="460" width="180" height="60" fill="#A0522D" stroke="#5D2906" stroke-width="1"/>
  <!-- Floor 8 (Ground) -->
  <rect x="110" y="520" width="180" height="60" fill="#A0522D" stroke="#5D2906" stroke-width="1"/>
  
  <!-- Windows (12 total, 3 per floor) -->
  <!-- Floor 1: 3 windows -->
  <rect x="130" y="110" width="20" height="40" fill="#87CEEB" stroke="#000080" stroke-width="1"/>
  <rect x="160" y="110" width="20" height="40" fill="#87CEEB" stroke="#000080" stroke-width="1"/>
  <rect x="190" y="110" width="20" height="40" fill="#87CEEB" stroke="#000080" stroke-width="1"/>
  
  <!-- Floor 2: 3 windows -->
  <rect x="130" y="170" width="20" height="40" fill="#87CEEB" stroke="#000080" stroke-width="1"/>
  <rect x="160" y="170" width="20" height="40" fill="#87CEEB" stroke="#000080" stroke-width="1"/>
  <rect x="190" y="170" width="20" height="40" fill="#87CEEB" stroke="#000080" stroke-width="1"/>
  
  <!-- Floor 3: 3 windows -->
  <rect x="130" y="230" width="20" height="40" fill="#87CEEB" stroke="#000080" stroke-width="1"/>
  <rect x="160" y="230" width="20" height="40" fill="#87CEEB" stroke="#000080" stroke-width="1"/>
  <rect x="190" y="230" width="20" height="40" fill="#87CEEB" stroke="#000080" stroke-width="1"/>
  
  <!-- Floor 4: 3 windows -->
  <rect x="130" y="290" width="20" height="40" fill="#87CEEB" stroke="#000080" stroke-width="1"/>
  <rect x="160" y="290" width="20" height="40" fill="#87CEEB" stroke="#000080" stroke-width="1"/>
  <rect x="190" y="290" width="20" height="40" fill="#87CEEB" stroke="#000080" stroke-width="1"/>
  
  <!-- Floor 5: 3 windows -->
  <rect x="130" y="350" width="20" height="40" fill="#87CEEB" stroke="#000080" stroke-width="1"/>
  <rect x="160" y="350" width="20" height="40" fill="#87CEEB" stroke="#000080" stroke-width="1"/>
  <rect x="190" y="350" width="20" height="40" fill="#87CEEB" stroke="#000080" stroke-width="1"/>
  
  <!-- Floor 6: 3 windows -->
  <rect x="130" y="410" width="20" height="40" fill="#87CEEB" stroke="#000080" stroke-width="1"/>
  <rect x="160" y="410" width="20" height="40" fill="#87CEEB" stroke="#000080" stroke-width="1"/>
  <rect x="190" y="410" width="20" height="40" fill="#87CEEB" stroke="#000080" stroke-width="1"/>
  
  <!-- Floor 7: 3 windows -->
  <rect x="130" y="470" width="20" height="40" fill="#87CEEB" stroke="#000080" stroke-width="1"/>
  <rect x="160" y="470" width="20" height="40" fill="#87CEEB" stroke="#000080" stroke-width="1"/>
  <rect x="190" y="470" width="20" height="40" fill="#87CEEB" stroke="#000080" stroke-width="1"/>
  
  <!-- Floor 8 (Ground): 3 windows -->
  <rect x="130" y="530" width="20" height="40" fill="#87CEEB" stroke="#000080" stroke-width="1"/>
  <rect x="160" y="530" width="20" height="40" fill="#87CEEB" stroke="#000080" stroke-width="1"/>
  <rect x="190" y="530" width="20" height="40" fill="#87CEEB" stroke="#000080" stroke-width="1"/>
</svg>