<svg width="300" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Building outline -->
  <rect x="100" y="50" width="100" height="300" fill="#8B4513" stroke="#5D2906" stroke-width="2"/>
  
  <!-- Floor 1 -->
  <rect x="105" y="100" width="90" height="60" fill="#A0522D" stroke="#5D2906" stroke-width="2"/>
  
  <!-- Floor 2 -->
  <rect x="105" y="160" width="90" height="60" fill="#A0522D" stroke="#5D2906" stroke-width="2"/>
  
  <!-- Floor 3 -->
  <rect x="105" y="220" width="90" height="60" fill="#A0522D" stroke="#5D2906" stroke-width="2"/>
  
  <!-- Floor 4 -->
  <rect x="105" y="280" width="90" height="60" fill="#A0522D" stroke="#5D2906" stroke-width="2"/>
  
  <!-- Floor 5 (Top) -->
  <rect x="105" y="340" width="90" height="60" fill="#A0522D" stroke="#5D2906" stroke-width="2"/>
  
  <!-- Windows -->
  <!-- Floor 1: 2 windows -->
  <rect x="115" y="105" width="20" height="55" fill="#87CEEB" stroke="#5D2906" stroke-width="2"/>
  <rect x="135" y="105" width="20" height="55" fill="#87CEEB" stroke="#5D2906" stroke-width="2"/>
  
  <!-- Floor 2: 2 windows -->
  <rect x="115" y="165" width="20" height="55" fill="#87CEEB" stroke="#5D2906" stroke-width="2"/>
  <rect x="135" y="165" width="20" height="55" fill="#87CEEB" stroke="#5D2906" stroke-width="2"/>
  
  <!-- Floor 3: 2 windows -->
  <rect x="115" y="225" width="20" height="55" fill="#87CEEB" stroke="#5D2906" stroke-width="2"/>
  <rect x="135" y="225" width="20" height="55" fill="#87CEEB" stroke="#5D2906" stroke-width="2"/>
  
  <!-- Floor 4: 2 windows -->
  <rect x="115" y="285" width="20" height="55" fill="#87CEEB" stroke="#5D2906" stroke-width="2"/>
  <rect x="135" y="285" width="20" height="55" fill="#87CEEB" stroke="#5D2906" stroke-width="2"/>
  
  <!-- Floor 5: 1 window -->
  <rect x="115" y="345" width="20" height="55" fill="#87CEEB" stroke="#5D2906" stroke-width="2"/>
</svg>