<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="200" fill="white"/>

  <!-- Top stripe (red) -->
  <rect x="0" y="0" width="300" height="60" fill="#b22234"/>

  <!-- Middle stripe (white) -->
  <rect x="0" y="60" width="300" height="80" fill="#ffffff"/>

  <!-- Bottom stripe (blue) -->
  <rect x="0" y="140" width="300" height="60" fill="#003399"/>

  <!-- Stars in the middle stripe -->
  <g fill="#000000">
    <circle cx="75" cy="90" r="4"/>
    <circle cx="125" cy="90" r="4"/>
    <circle cx="175" cy="90" r="4"/>
    <circle cx="225" cy="90" r="4"/>
    <circle cx="275" cy="90" r="4"/>
    <circle cx="30" cy="90" r="4"/>
    <circle cx="60" cy="90" r="4"/>
  </g>
</svg>