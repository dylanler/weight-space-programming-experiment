  <!-- Floor 1 (Ground floor) - 2 windows -->
  <rect x="110" y="100" width="30" height="60" fill="#A89F9F"/>
  <rect x="140" y="100" width="30" height="60" fill="#A89F9F"/>
  
  <!-- Floor 2 - 2 windows -->
  <rect x="110" y="160" width="30" height="60" fill="#A89F9F"/>
  <rect x="140" y="160" width="30" height="60" fill="#A89F9F"/>
  
  <!-- Floor 3 - 2 windows -->
  <rect x="110" y="220" width="30" height="60" fill="#A89F9F"/>
  <rect x="140" y="220" width="30" height="60" fill="#A89F9F"/>
  
  <!-- Floor 4 (Top floor) - 2 windows -->
  <rect x="110" y="280" width="30" height="60" fill="#A89F9F"/>
  <rect x="140" y="280" width="30" height="60" fill="#A89F9F"/>
