<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="white"/>
  
  <!-- Chart margins -->
  <rect x="60" y="20" width="280" height="260" fill="white"/>
  
  <!-- Grid lines -->
  <line x1="60" y1="20" x2="340" y2="20" stroke="black" stroke-width="1"/>
  <line x1="60" y1="100" x2="340" y2="100" stroke="black" stroke-width="1"/>
  <line x1="60" y1="180" x2="340" y2="180" stroke="black" stroke-width="1"/>
  <line x1="60" y1="260" x2="340" y2="260" stroke="black" stroke-width="1"/>
  
  <!-- X-axis ticks and labels -->
  <line x1="60" y1="260" x2="60" y2="270" stroke="black" stroke-width="1"/>
  <text x="60" y="290" text-anchor="middle" font-size="12">1</text>
  
  <line x1="180" y1="260" x2="180" y2="270" stroke="black" stroke-width="1"/>
  <text x="180" y="290" text-anchor="middle" font-size="12">2</text>
  
  <line x1="300" y1="260" x2="300" y2="270" stroke="black" stroke-width="1"/>
  <text x="300" y="290" text-anchor="middle" font-size="12">3</text>
  
  <line x1="340" y1="260" x2="340" y2="270" stroke="black" stroke-width="1"/>
  <text x="340" y="290" text-anchor="middle" font-size="12">4</text>
  
  <!-- Y-axis ticks and labels -->
  <line x1="50" y1="20" x2="60" y2="20" stroke="black" stroke-width="1"/>
  <text x="40" y="25" text-anchor="end" font-size="12">0</text>
  
  <line x1="50" y1="100" x2="60" y2="100" stroke="black" stroke-width="1"/>
  <text x="40" y="105" text-anchor="end" font-size="12">25</text>
  
  <line x1="50" y1="180" x2="60" y2="180" stroke="black" stroke-width="1"/>
  <text x="40" y="185" text-anchor="end" font-size="12">50</text>
  
  <line x1="50" y1="260" x2="60" y2="260" stroke="black" stroke-width="1"/>
  <text x="40" y="265" text-anchor="end" font-size="12">75</text>
  
  <!-- Bars -->
  <!-- Bar 1: height 25 -->
  <rect x="60" y="100" width="40" height="60" fill="blue"/>
  
  <!-- Bar 2: height 50 -->
  <rect x="180" y="180" width="40" height="80" fill="blue"/>
  
  <!-- Bar 3: height 25 -->
  <rect x="300" y="100" width="40" height="60" fill="blue"/>
  
  <!-- Bar 4: height 50 -->
  <rect x="340" y="180" width="40" height="80" fill="blue"/>
  
  <!-- Bar 5: height 25 -->
  <rect x="60" y="260" width="40" height="60" fill="blue"/>
  
  <!-- Bar 6: height 100 (tallest, red) -->
  <rect x="180" y="100" width="40" height="100" fill="red"/>
  
  <!-- Bar 7: height 50 -->
  <rect x="300" y="180" width="40" height="80" fill="blue"/>
  
  <!-- Bar 8: height 25 -->
  <rect x="340" y="100" width="40" height="60" fill="blue"/>
</svg>