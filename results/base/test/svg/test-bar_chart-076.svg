<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="400" height="300" fill="white"/>

  <!-- Chart margins and data range -->
  <!-- Left margin: 60, Right margin: 20, Top margin: 20, Bottom margin: 60 -->
  <!-- Data range: max value = 100 (red bar), min value = 50 -->
  <!-- Bar width: 40, spacing: 20 -->
  
  <!-- Define styles -->
  <defs>
    <style>
      .bar { fill: #ff0000; }
      .other-bar { fill: #0000ff; }
    </style>
  </defs>

  <!-- Bars -->
  <!-- Bar 1: tallest (value 100) -->
  <rect class="bar" x="60" y="20" width="40" height="80"/>
  
  <!-- Bar 2: value 70 -->
  <rect class="other-bar" x="110" y="20" width="40" height="80"/>
  
  <!-- Bar 3: value 50 -->
  <rect class="other-bar" x="160" y="20" width="40" height="80"/>
  
  <!-- Bar 4: value 30 -->
  <rect class="other-bar" x="210" y="20" width="40" height="80"/>
  
  <!-- Bar 5: value 10 -->
  <rect class="other-bar" x="260" y="20" width="40" height="80"/>
</svg>