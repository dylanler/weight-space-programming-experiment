<svg width="400" height="560" xmlns="http://www.w3.org/2000/svg">
  <!-- Building outline -->
  <rect x="100" y="80" width="200" height="480" fill="#a8c6e9"/>
  
  <!-- Floors (7 floors) -->
  <!-- Floor 1 -->
  <rect x="110" y="100" width="180" height="60" fill="#f0f4f8"/>
  <!-- Floor 2 -->
  <rect x="110" y="160" width="180" height="60" fill="#f0f4f8"/>
  <!-- Floor 3 -->
  <rect x="110" y="220" width="180" height="60" fill="#f0f4f8"/>
