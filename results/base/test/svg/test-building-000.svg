  <rect x="110" y="400" width="180" height="60" fill="#f0f4f8"/>
  <!-- Floor 7 (Ground level) -->
  <rect x="110" y="460" width="180" height="60" fill="#dceef8"/>
  
  <!-- Windows: 22 total, 4 per floor = 28 slots, but we need exactly 22 windows. Let's place them strategically. -->
  <!-- Floor 1: 5 windows -->
  <rect x="120" y="105" width="20" height="20" fill="#fff9c4"/>
