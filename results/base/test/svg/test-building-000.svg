  <rect x="180" y="405" width="20" height="20" fill="#fff9c4"/>
  <rect x="210" y="405" width="20" height="20" fill="#fff9c4"/>
  <rect x="240" y="405" width="20" height="20" fill="#fff9c4"/>
  
  <!-- Floor 7 (Ground): 5 windows -->
  <rect x="120" y="465" width="20" height="20" fill="#fff9c4"/>
  <rect x="150" y="465" width="20" height="20" fill="#fff9c4"/>
  <rect x="180" y="465" width="20" height="20" fill="#fff9c4"/>
  <rect x="210" y="465" width="20" height="20" fill="#fff9c4"/>
