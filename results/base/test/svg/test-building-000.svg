  <rect x="210" y="105" width="20" height="20" fill="#fff9c4"/>
  <rect x="240" y="105" width="20" height="20" fill="#fff9c4"/>
  
  <!-- Floor 2: 5 windows -->
  <rect x="120" y="165" width="20" height="20" fill="#fff9c4"/>
  <rect x="150" y="165" width="20" height="20" fill="#fff9c4"/>
  <rect x="180" y="165" width="20" height="20" fill="#fff9c4"/>
  <rect x="210" y="165" width="20" height="20" fill="#fff9c4"/>
  <rect x="240" y="165" width="20" height="20" fill="#fff9c4"/>
  
  <!-- Floor 3: 5 windows -->
  <rect x="120" y="225" width="20" height="20" fill="#fff9c4"/>
  <rect x="150" y="225" width="20" height="20" fill="#fff9c4"/>
  <rect x="180" y="225" width="20" height="20" fill="#fff9c4"/>
  <rect x="210" y="225" width="20" height="20" fill="#fff9c4"/>
  <rect x="240" y="225" width="20" height="20" fill="#fff9c4"/>
  
  <!-- Floor 4: 5 windows -->
  <rect x="120" y="285" width="20" height="20" fill="#fff9c4"/>
  <rect x="150" y="285" width="20" height="20" fill="#fff9c4"/>
  <rect x="180" y="285" width="20" height="20" fill="#fff9c4"/>
  <rect x="210" y="285" width="20" height="20" fill="#fff9c4"/>
  <rect x="240" y="285" width="20" height="20" fill="#fff9c4"/>
  
  <!-- Floor 5: 5 windows -->
  <rect x="120" y="345" width="20" height="20" fill="#fff9c4"/>
  <rect x="150" y="345" width="20" height="20" fill="#fff9c4"/>
  <rect x="180" y="345" width="20" height="20" fill="#fff9c4"/>
  <rect x="210" y="345" width="20" height="20" fill="#fff9c4"/>
  <rect x="240" y="345" width="20" height="20" fill="#fff9c4"/>
  
  <!-- Floor 6: 5 windows -->
  <rect x="120" y="405" width="20" height="20" fill="#fff9c4"/>
