<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .apple { fill: #ff4d4d; }
      .stem { fill: #888888; }
      .leaf { fill: #228b22; }
    </style>
  </defs>
  
  <!-- Tree trunk -->
  <rect x="200" y="150" width="40" height="100" fill="#8B4513" />
  
  <!-- Tree branches -->
  <path d="M200 150 L160 100" stroke="#8B4513" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M200 150 L240 100" stroke="#8B4513" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M200 150 L180 180" stroke="#8B4513" stroke-width="8" fill="none" stroke-linecap="round"/>
  
  <!-- Apples -->
  <circle class="apple" cx="200" cy="100" r="12" />
  <circle class="apple" cx="200" cy="100" r="10" />
  <circle class="apple" cx="200" cy="100" r="8" />
  <circle class="apple" cx="200" cy="100" r="14" />
  <circle class="apple" cx="200" cy="100" r="11" />
  <circle class="apple" cx="200" cy="100" r="13" />
  <circle class="apple" cx="200" cy="100" r="10" />
  <circle class="apple" cx="200" cy="100" r="12" />
  <circle class="apple" cx="200" cy="100" r="11" />
  <circle class="apple" cx="200" cy="100" r="13" />
  <circle class="apple" cx="200" cy="100" r="10" />
  <circle class="apple" cx="200" cy="100" r="12" />
  
  <!-- Leaves -->
  <path class="leaf" d="M180 120 Q160 130 150 120" stroke="none" fill="none"/>
  <path class="leaf" d="M220 120 Q240 130 250 120" stroke="none" fill="none"/>
  <path class="leaf" d="M190 140 Q200 150 210 140" stroke="none" fill="none"/>
  <path class="leaf" d="M210 140 Q200 150 190 140" stroke="none" fill="none"/>
  <path class="leaf" d="M170 160 Q180 170 190 160" stroke="none" fill="none"/>
  <path class="leaf" d="M230 160 Q240 170 230 160" stroke="none" fill="none"/>
</svg>