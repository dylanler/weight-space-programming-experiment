<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="200" fill="white"/>
  
  <!-- 5 Horizontal Stripes -->
  <rect x="0" y="0" width="300" height="40" fill="#006400"/>
  <rect x="0" y="80" width="300" height="40" fill="#009639"/>
  <rect x="0" y="160" width="300" height="40" fill="#00897b"/>
  <rect x="0" y="240" width="300" height="40" fill="#004d00"/>
  <rect x="0" y="320" width="300" height="40" fill="#003300"/>
  
  <!-- 5 Stars (centered on each stripe) -->
  <g fill="#ffffff">
    <circle cx="150" cy="40" r="10"/>
    <circle cx="150" cy="40" r="3" fill="#000000"/>
    <circle cx="150" cy="40" r="5" fill="#000000"/>
    <circle cx="150" cy="40" r="7" fill="#000000"/>
    <circle cx="150" cy="40" r="9" fill="#000000"/>
    
    <circle cx="150" cy="120" r="10"/>
    <circle cx="150" cy="120" r="3" fill="#000000"/>
    <circle cx="150" cy="120" r="5" fill="#000000"/>
    <circle cx="150" cy="120" r="7" fill="#000000"/>
    <circle cx="150" cy="120" r="9" fill="#000000"/>
    
    <circle cx="150" cy="200" r="10"/>
    <circle cx="150" cy="200" r="3" fill="#000000"/>
    <circle cx="150" cy="200" r="5" fill="#000000"/>
    <circle cx="150" cy="200" r="7" fill="#000000"/>
    <circle cx="150" cy="200" r="9" fill="#000000"/>
    
    <circle cx="150" cy="300" r="10"/>
    <circle cx="150" cy="300" r="3" fill="#000000"/>
    <circle cx="150" cy="300" r="5" fill="#000000"/>
    <circle cx="150" cy="300" r="7" fill="#000000"/>
    <circle cx="150" cy="300" r="9" fill="#000000"/>
  </g>
</svg>