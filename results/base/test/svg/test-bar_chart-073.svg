<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="400" height="300" fill="white"/>

  <!-- Chart margins and grid area -->
  <!-- Left margin: 60, Right margin: 20, Top margin: 20, Bottom margin: 60 -->
  <!-- Plot area: x from 60 to 380, y from 20 to 240 -->

  <!-- Bar widths (each bar = 50px) -->
  <!-- Bars at positions: 100, 150, 200, 250, 300 -->
  
  <!-- Bar 1: Blue -->
  <rect x="100" y="20" width="50" height="120" fill="#1E90FF"/>

  <!-- Bar 2: Blue -->
  <rect x="150" y="20" width="50" height="120" fill="#1E90FF"/>

  <!-- Bar 3: Blue -->
  <rect x="200" y="20" width="50" height="120" fill="#1E90FF"/>

  <!-- Bar 4: Blue -->
  <rect x="250" y="20" width="50" height="120" fill="#1E90FF"/>

  <!-- Bar 5: Red (tallest) -->
  <rect x="300" y="20" width="50" height="240" fill="#FF0000"/>

  <!-- X-axis labels -->
  <text x="100" y="280" text-anchor="middle" font-size="12">Bar 1</text>
  <text x="150" y="280" text-anchor="middle" font-size="12">Bar 2</text>
  <text x="200" y="280" text-anchor="middle" font-size="12">Bar 3</text>
  <text x="250" y="280" text-anchor="middle" font-size="12">Bar 4</text>
  <text x="300" y="280" text-anchor="middle" font-size="12">Bar 5</text>

  <!-- Y-axis label -->
  <text x="20" y="170" text-anchor="middle" font-size="12" transform="rotate(-90, 20, 170)">Value</text>
</svg>