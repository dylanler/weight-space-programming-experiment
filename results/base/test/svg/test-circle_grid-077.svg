  <circle cx="160" cy="110" r="10" fill="white"/>
  <circle cx="200" cy="110" r="10" fill="white"/>
  <circle cx="240" cy="110" r="10" fill="white"/>

  <!-- Row 3 -->
  <circle cx="80" cy="150" r="10" fill="white"/>
  <circle cx="120" cy="150" r="10" fill="white"/>
  <circle cx="160" cy="150" r="10" fill="white"/>
