<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="400" height="300" fill="white"/>

  <!-- Chart margins and data range assumption: max value = 100, min = 0, bar width = 60, spacing = 40 -->
  <!-- Bar positions (left): 80, 140, 200, 260 -->
  
  <!-- Bar 1 (blue) -->
  <rect x="80" y="50" width="60" height="100" fill="blue"/>

  <!-- Bar 2 (blue) -->
  <rect x="140" y="50" width="60" height="100" fill="blue"/>

  <!-- Bar 3 (red) - tallest at 100 -->
  <rect x="200" y="0" width="60" height="100" fill="red"/>

  <!-- Bar 4 (blue) -->
  <rect x="260" y="50" width="60" height="100" fill="blue"/>

  <!-- X-axis labels -->
  <text x="100" y="290" text-anchor="middle" font-size="12">Bar 1</text>
  <text x="200" y="290" text-anchor="middle" font-size="12">Bar 2</text>
  <text x="300" y="290" text-anchor="middle" font-size="12">Bar 3</text>
  <text x="400" y="290" text-anchor="middle" font-size="12">Bar 4</text>

  <!-- Y-axis label -->
  <text x="170" y="310" text-anchor="middle" font-size="12" transform="rotate(-90, 170, 310)">Value</text>
</svg>