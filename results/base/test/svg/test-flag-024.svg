<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="200" fill="white"/>
  
  <!-- Top stripe (blue) -->
  <rect x="0" y="0" width="300" height="50" fill="#003399"/>
  
  <!-- Second stripe (red) -->
  <rect x="0" y="50" width="300" height="50" fill="#B22234"/>
  
  <!-- Third stripe (yellow) -->
  <rect x="0" y="100" width="300" height="50" fill="#FFCC00"/>
  
  <!-- Bottom stripe (green) -->
  <rect x="0" y="150" width="300" height="50" fill="#006400"/>
  
  <!-- Stars in the center of each stripe -->
  <circle cx="150" cy="25" r="8" fill="#FFFFFF"/>
  <circle cx="150" cy="125" r="8" fill="#FFFFFF"/>
  <circle cx="150" cy="200" r="8" fill="#FFFFFF"/>
</svg>