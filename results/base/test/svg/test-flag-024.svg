<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="200" fill="white"/>
  
  <!-- Top stripe (blue) -->
  <rect x="0" y="0" width="300" height="50" fill="#003399"/>
  
  <!-- Second stripe (white) -->
  <rect x="0" y="50" width="300" height="50" fill="#ffffff"/>
  
  <!-- Third stripe (red) -->
  <rect x="0" y="100" width="300" height="50" fill="#cc0000"/>
  
  <!-- Bottom stripe (yellow) -->
  <rect x="0" y="150" width="300" height="50" fill="#ffcc00"/>
  
  <!-- Stars (1 star in the center of the red stripe) -->
  <circle cx="150" cy="125" r="10" fill="#ffffff"/>
</svg>