<svg width="200" height="150" xmlns="http://www.w3.org/2000/svg">
  <!-- Define grid parameters -->
  <!-- Rows: 3, Columns: 2 -->
  <!-- Cell size: 60x60 (total 180x180) -->
  
  <!-- Row 1 -->
  <circle cx="40" cy="60" r="15" fill="white"/>
  <circle cx="100" cy="60" r="15" fill="white"/>
  
  <!-- Row 2 -->
  <circle cx="40" cy="120" r="15" fill="white"/>
  <circle cx="100" cy="120" r="15" fill="white"/>
  
  <!-- Row 3 -->
  <circle cx="40" cy="180" r="15" fill="white"/>
  <circle cx="100" cy="180" r="15" fill="white"/>
</svg>