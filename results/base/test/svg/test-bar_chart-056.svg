<svg width="400" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Define styles -->
  <defs>
    <style>
      .bar { fill: blue; }
      .tall-bar { fill: red; }
    </style>
  </defs>

  <!-- Background (optional, for clarity) -->
  <rect x="0" y="0" width="400" height="200" fill="white"/>

  <!-- Bar positions and heights (assuming max height is 100 units) -->
  <!-- Bars 1-5: height = 20 -->
  <!-- Bar 6: height = 80 (tallest) -->
  <!-- Bar 7: height = 20 -->
  
  <!-- Bar 1 -->
  <rect x="50" y="90" width="40" height="20" class="bar"/>
  
  <!-- Bar 2 -->
  <rect x="100" y="90" width="40" height="20" class="bar"/>
  
  <!-- Bar 3 -->
  <rect x="150" y="90" width="40" height="20" class="bar"/>
  
  <!-- Bar 4 -->
  <rect x="200" y="90" width="40" height="20" class="bar"/>
  
  <!-- Bar 5 -->
  <rect x="250" y="90" width="40" height="20" class="bar"/>
  
  <!-- Bar 6 (Tallest, Red) -->
  <rect x="300" y="20" width="40" height="80" class="tall-bar"/>
  
  <!-- Bar 7 -->
  <rect x="350" y="90" width="40" height="20" class="bar"/>
</svg>