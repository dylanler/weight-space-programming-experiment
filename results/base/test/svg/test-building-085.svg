<svg width="300" height="450" viewBox="0 0 300 450" xmlns="http://www.w3.org/2000/svg">
  <!-- Building outline -->
  <rect x="100" y="60" width="100" height="330" fill="#8B7355"/>
  
  <!-- Floors (each floor is a rectangle) -->
  <!-- Floor 1 -->
  <rect x="100" y="90" width="100" height="60" fill="#AABCBF"/>
  <!-- Floor 2 -->
  <rect x="100" y="150" width="100" height="60" fill="#AABCBF"/>
  <!-- Floor 3 -->
  <rect x="100" y="210" width="100" height="60" fill="#AABCBF"/>
  <!-- Floor 4 -->
  <rect x="100" y="270" width="100" height="60" fill="#AABCBF"/>
  <!-- Floor 5 -->
  <rect x="100" y="330" width="100" height="60" fill="#AABCBF"/>
  
  <!-- Windows on each floor (2 per floor = 8 total) -->
  <!-- Floor 1: left, right -->
  <rect x="110" y="95" width="20" height="55" fill="#E0F7FA"/>
  <rect x="180" y="95" width="20" height="55" fill="#E0F7FA"/>
  <!-- Floor 2: left, right -->
  <rect x="110" y="155" width="20" height="55" fill="#E0F7FA"/>
  <rect x="180" y="155" width="20" height="55" fill="#E0F7FA"/>
  <!-- Floor 3: left, right -->
  <rect x="110" y="215" width="20" height="55" fill="#E0F7FA"/>
  <rect x="180" y="215" width="20" height="55" fill="#E0F7FA"/>
  <!-- Floor 4: left, right -->
  <rect x="110" y="275" width="20" height="55" fill="#E0F7FA"/>
  <rect x="180" y="275" width="20" height="55" fill="#E0F7FA"/>
  <!-- Floor 5: left, right -->
  <rect x="110" y="335" width="20" height="55" fill="#E0F7FA"/>
  <rect x="180" y="335" width="20" height="55" fill="#E0F7FA"/>
</svg>