<svg width="200" height="150" xmlns="http://www.w3.org/2000/svg">
  <!-- Building outline -->
  <rect x="40" y="60" width="120" height="90" fill="#8B7355"/>
  
  <!-- Floor structure (1 floor) -->
  <rect x="40" y="60" width="120" height="90" fill="#AABCBF"/>
  
  <!-- Windows: 5 total, evenly distributed across the building -->
  <!-- Top row: 2 windows -->
  <rect x="60" y="50" width="20" height="20" fill="#E0E0E0"/>
  <rect x="100" y="50" width="20" height="20" fill="#E0E0E0"/>
  
  <!-- Middle row: 2 windows -->
  <rect x="60" y="80" width="20" height="20" fill="#E0E0E0"/>
  <rect x="100" y="80" width="20" height="20" fill="#E0E0E0"/>
  
  <!-- Bottom row: 1 window -->
  <rect x="140" y="110" width="20" height="20" fill="#E0E0E0"/>
</svg>