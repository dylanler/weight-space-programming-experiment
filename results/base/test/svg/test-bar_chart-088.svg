<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="white"/>
  
  <!-- Chart margins -->
  <rect x="60" y="60" width="280" height="180" fill="white"/>
  
  <!-- Grid lines -->
  <line x1="60" y1="120" x2="340" y2="120" stroke="black" stroke-width="1"/>
  <line x1="60" y1="180" x2="340" y2="180" stroke="black" stroke-width="1"/>
  
  <!-- Bars -->
  <!-- Bar 1: Blue, height 40 -->
  <rect x="60" y="120" width="40" height="40" fill="blue"/>
  
  <!-- Bar 2: Blue, height 60 -->
  <rect x="120" y="120" width="40" height="60" fill="blue"/>
  
  <!-- Bar 3: Red, height 100 (tallest) -->
  <rect x="180" y="120" width="40" height="100" fill="red"/>
  
  <!-- Bar 4: Blue, height 80 -->
  <rect x="240" y="120" width="40" height="80" fill="blue"/>
  
  <!-- X-axis labels -->
  <text x="60" y="200" text-anchor="middle" font-size="12">1</text>
  <text x="120" y="200" text-anchor="middle" font-size="12">2</text>
  <text x="180" y="200" text-anchor="middle" font-size="12">3</text>
  <text x="240" y="200" text-anchor="middle" font-size="12">4</text>
  
  <!-- Y-axis label -->
  <text x="20" y="180" text-anchor="middle" font-size="12" transform="rotate(-90 20 180)">Value</text>
</svg>