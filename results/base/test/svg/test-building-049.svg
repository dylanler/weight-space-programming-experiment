<svg width="400" height="560" xmlns="http://www.w3.org/2000/svg">
  <!-- Building outline -->
  <rect x="100" y="80" width="200" height="480" fill="#a8c6e9"/>
  
  <!-- Floors (8 floors) -->
  <!-- Floor 1 -->
  <rect x="110" y="100" width="180" height="60" fill="#f0f4f8"/>
  <!-- Floor 2 -->
  <rect x="110" y="170" width="180" height="60" fill="#f0f4f8"/>
  <!-- Floor 3 -->
  <rect x="110" y="240" width="180" height="60" fill="#f0f4f8"/>
  <!-- Floor 4 -->
  <rect x="110" y="310" width="180" height="60" fill="#f0f4f8"/>
  <!-- Floor 5 -->
  <rect x="110" y="380" width="180" height="60" fill="#f0f4f8"/>
  <!-- Floor 6 -->
  <rect x="110" y="450" width="180" height="60" fill="#f0f4f8"/>
  <!-- Floor 7 -->
  <rect x="110" y="520" width="180" height="60" fill="#f0f4f8"/>
  <!-- Floor 8 (Ground level) -->
  <rect x="110" y="590" width="180" height="60" fill="#dceef8"/>

  <!-- Windows: 14 total, 2 per floor = 8 floors * 2 = 16? Wait, need exactly 14 windows.
       Let's do 2 windows per floor except one floor has 1 window to make it 14.
       Or distribute differently. Let's try: 2,2,2,2,2,2,2,1 = 15? No.
       Try: 2,2,2,2,2,2,1,1 = 14. That works.
       
       Floor 1: 2 windows
       Floor 2: 2 windows
       Floor 3: 2 windows
       Floor 4: 2 windows
       Floor 5: 2 windows
       Floor 6: 2 windows
       Floor 7: 1 window
       Floor 8: 1 window
       
       Total: 2+2+2+2+2+2+1+1 = 14 ✓
       
       Positioning:
       Floor 1 (y=100): x=120,140
       Floor 2 (y=170): x=120,140
       Floor 3 (y=240): x=120,140
       Floor 4 (y=310): x=120,140
       Floor 5 (y=380): x=120,140
       Floor 6 (y=450): x=120,140
       Floor 7 (y=520): x=120
       Floor 8 (y=590): x=120
      -->

  <!-- Windows on each floor -->
  <!-- Floor 1 -->
  <rect x="120" y="100" width="20" height="60" fill="#fff9c4"/>
  <rect x="140" y="100" width="20" height="60" fill="#fff9c4"/>
  <!-- Floor 2 -->
  <rect x="120" y="170" width="20" height="60" fill="#fff9c4"/>
  <rect x="140" y="170" width="20" height="60" fill="#fff9c4"/>
  <!-- Floor 3 -->
  <rect x="120" y="240" width="20" height="60" fill="#fff9c4"/>
  <rect x="140" y="240" width="20" height="60" fill="#fff9c4"/>
  <!-- Floor 4 -->
  <rect x="120" y="310" width="20" height="60" fill="#fff9c4"/>
  <rect x="140" y="310" width="20" height="60" fill="#fff9c4"/>
  <!-- Floor 5 -->
  <rect x="120" y="380" width="20" height="60" fill="#fff9c4"/>
  <rect x="140" y="380" width="20" height="60" fill="#fff9c4"/>
  <!-- Floor 6 -->
  <rect x="120" y="450" width="20" height="60" fill="#fff9c4"/>
  <rect x="140" y="450" width="20" height="60" fill="#fff9c4"/>
  <!-- Floor 7 -->
  <rect x="120" y="520" width="20" height="60" fill="#fff9c4"/>
  <!-- Floor 8 -->
  <rect x="120" y="590" width="20" height="60" fill="#fff9c4"/>
</svg>