<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="white"/>

  <!-- Flag dimensions: 600x400, stripes are equal height = 100px each -->
  <!-- Top stripe (blue) -->
  <rect x="0" y="0" width="600" height="100" fill="#003399"/>
  
  <!-- Second stripe (red) -->
  <rect x="0" y="100" width="600" height="100" fill="#B22234"/>
  
  <!-- Third stripe (yellow) -->
  <rect x="0" y="200" width="600" height="100" fill="#FFCC00"/>
  
  <!-- Fourth stripe (green) -->
  <rect x="0" y="300" width="600" height="100" fill="#006400"/>
  
  <!-- Fifth stripe (white) -->
  <rect x="0" y="400" width="600" height="100" fill="#FFFFFF"/>

  <!-- Stars (8 stars total, evenly distributed across the flag) -->
  <!-- Each star centered in a 50px wide column, spaced every 75px horizontally -->
  <!-- Columns at x positions: 0, 75, 150, 225, 300, 375, 450, 525 -->
  
  <!-- Star 1 (top-left area) -->
  <polygon points="75,100 100,125 125,100 100,75 75,100" fill="#FFD700"/>
  
  <!-- Star 2 -->
  <polygon points="150,100 175,125 200,100 175,75 150,100" fill="#FFD700"/>
  
  <!-- Star 3 -->
  <polygon points="225,100 250,125 275,100 250,75 225,100" fill="#FFD700"/>
  
  <!-- Star 4 -->
  <polygon points="300,100 325,125 350,100 325,75 300,100" fill="#FFD700"/>
  
  <!-- Star 5 -->
  <polygon points="375,100 400,125 425,100 400,75 375,100" fill="#FFD700"/>
  
  <!-- Star 6 -->
  <polygon points="450,100 475,125 500,100 475,75 450,100" fill="#FFD700"/>
  
  <!-- Star 7 -->
  <polygon points="525,100 550,125 575,100 550,75 525,100" fill="#FFD700"/>
</svg>