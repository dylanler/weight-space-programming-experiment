<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="400" height="300" fill="white"/>

  <!-- Chart margins and data range -->
  <!-- Left margin: 60, Right margin: 20, Top margin: 20, Bottom margin: 60 -->
  <!-- Data range: max value = 100 (red bar), min value = 50 -->
  <!-- Bar width: 40, spacing: 20 -->
  
  <!-- Define styles -->
  <defs>
    <style>
      .bar { fill: #ff0000; }
      .other-bar { fill: #0000ff; }
    </style>
  </defs>

  <!-- Bars -->
  <!-- Bar 1: tallest (value 100) -->
  <rect x="60" y="80" width="40" height="120" class="bar"/>
  
  <!-- Bar 2: value 70 -->
  <rect x="120" y="100" width="40" height="90" class="other-bar"/>
  
  <!-- Bar 3: value 50 -->
  <rect x="180" y="120" width="40" height="80" class="other-bar"/>
  
  <!-- Bar 4: value 30 -->
  <rect x="240" y="140" width="40" height="60" class="other-bar"/>
  
  <!-- Bar 5: value 20 -->
  <rect x="300" y="160" width="40" height="40" class="other-bar"/>

</svg>