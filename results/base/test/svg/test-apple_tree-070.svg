<svg width="200" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .tree { fill: #4CAF50; }
      .apple { fill: #FF5722; }
      .stem { stroke: #388E3C; stroke-width: 2; }
      .leaf { fill: #66BB6A; }
    </style>
  </defs>
  
  <!-- Tree trunk -->
  <rect x="100" y="100" width="10" height="150" class="tree" />
  
  <!-- Main tree branches -->
  <path d="M100,100 L120,100 L120,150 L100,150 Z" class="tree" />
  <path d="M100,100 L90,100 L90,150 L100,150 Z" class="tree" />
  <path d="M100,100 L110,100 L110,150 L100,150 Z" class="tree" />
  
  <!-- Apple 1 -->
  <circle cx="110" cy="110" r="10" class="apple" />
  <line x1="110" y1="110" x2="110" y2="100" class="stem" />
  
  <!-- Apple 2 -->
  <circle cx="130" cy="120" r="10" class="apple" />
  <line x1="130" y1="120" x2="130" y2="110" class="stem" />
  
  <!-- Apple 3 -->
  <circle cx="150" cy="130" r="10" class="apple" />
  <line x1="150" y1="130" x2="150" y2="120" class="stem" />
  
  <!-- Leaves -->
  <path d="M100,100 L120,100 L120,150 L100,150 Z" class="leaf" />
  <path d="M100,100 L90,100 L90,150 L100,150 Z" class="leaf" />
  <path d="M100,100 L110,100 L110,150 L100,150 Z" class="leaf" />
</svg>