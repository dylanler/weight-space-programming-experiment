<svg width="200" height="150" xmlns="http://www.w3.org/2000/svg">
  <!-- Define grid parameters -->
  <!-- Rows: 5, Columns: 3 -->
  <!-- Cell size: 40x30 (to fit within 200x150) -->
  
  <!-- Row 1 -->
  <circle cx="40" cy="60" r="8" fill="white"/>
  <circle cx="80" cy="60" r="8" fill="white"/>
  <circle cx="120" cy="60" r="8" fill="white"/>
  
  <!-- Row 2 -->
  <circle cx="40" cy="90" r="8" fill="white"/>
  <circle cx="80" cy="90" r="8" fill="white"/>
  <circle cx="120" cy="90" r="8" fill="white"/>
  
  <!-- Row 3 -->
  <circle cx="40" cy="120" r="8" fill="white"/>
  <circle cx="80" cy="120" r="8" fill="white"/>
  <circle cx="120" cy="120" r="8" fill="white"/>
  
  <!-- Row 4 -->
  <circle cx="40" cy="150" r="8" fill="white"/>
  <circle cx="80" cy="150" r="8" fill="white"/>
  <circle cx="120" cy="150" r="8" fill="white"/>
  
  <!-- Row 5 -->
  <circle cx="40" cy="180" r="8" fill="white"/>
  <circle cx="80" cy="180" r="8" fill="white"/>
  <circle cx="120" cy="180" r="8" fill="white"/>
</svg>