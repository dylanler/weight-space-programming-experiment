<svg width="400" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Define styles -->
  <defs>
    <style>
      .bar { fill: blue; }
      .tall-bar { fill: red; }
    </style>
  </defs>

  <!-- Chart margins and grid -->
  <rect x="60" y="20" width="280" height="160" fill="white"/>
  
  <!-- Y-axis labels (simplified) -->
  <text x="50" y="190" text-anchor="end" font-size="12">0</text>
  <text x="50" y="170" text-anchor="end" font-size="12">50</text>
  <text x="50" y="150" text-anchor="end" font-size="12">100</text>
  <text x="50" y="130" text-anchor="end" font-size="12">150</text>
  <text x="50" y="110" text-anchor="end" font-size="12">200</text>
  <text x="50" y="90" text-anchor="end" font-size="12">250</text>
  <text x="50" y="70" text-anchor="end" font-size="12">300</text>
  <text x="50" y="50" text-anchor="end" font-size="12">350</text>
  <text x="50" y="30" text-anchor="end" font-size="12">400</text>

  <!-- X-axis ticks and labels -->
  <line x1="60" y1="160" x2="60" y2="180" stroke="black" stroke-width="1"/>
  <text x="60" y="200" text-anchor="middle" font-size="12">1</text>

  <line x1="120" y1="160" x2="120" y2="180" stroke="black" stroke-width="1"/>
  <text x="120" y="200" text-anchor="middle" font-size="12">2</text>

  <line x1="180" y1="160" x2="180" y2="180" stroke="black" stroke-width="1"/>
  <text x="180" y="200" text-anchor="middle" font-size="12">3</text>

  <line x1="240" y1="160" x2="240" y2="180" stroke="black" stroke-width="1"/>
  <text x="240" y="200" text-anchor="middle" font-size="12">4</text>

  <line x1="300" y1="160" x2="300" y2="180" stroke="black" stroke-width="1"/>
  <text x="300" y="200" text-anchor="middle" font-size="12">5</text>

  <line x1="360" y1="160" x2="360" y2="180" stroke="black" stroke-width="1"/>
  <text x="360" y="200" text-anchor="middle" font-size="12">6</text>

  <!-- Bars -->
  <!-- Bar 1 -->
  <rect x="60" y="140" width="20" height="20" class="bar"/>
  <!-- Bar 2 -->
  <rect x="120" y="120" width="20" height="40" class="bar"/>
  <!-- Bar 3 -->
  <rect x="180" y="100" width="20" height="60" class="bar"/>
  <!-- Bar 4 -->
  <rect x="240" y="80" width="20" height="80" class="bar"/>
  <!-- Bar 5 (Tallest, Red) -->
  <rect x="300" y="40" width="20" height="120" class="tall-bar"/>
  <!-- Bar 6 -->
  <rect x="360" y="60" width="20" height="100" class="bar"/>
  <!-- Bar 7 -->
  <rect x="420" y="100" width="20" height="60" class="bar"/>
</svg>