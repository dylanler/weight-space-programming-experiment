<svg width="200" height="150" xmlns="http://www.w3.org/2000/svg">
  <!-- Define grid parameters -->
  <!-- Rows: 4, Columns: 2 -->
  <!-- Cell size: 50x50 (total 200x200) -->
  
  <!-- Row 1 -->
  <circle cx="50" cy="50" r="15" fill="white"/>
  <circle cx="150" cy="50" r="15" fill="white"/>
  
  <!-- Row 2 -->
  <circle cx="50" cy="100" r="15" fill="white"/>
  <circle cx="150" cy="100" r="15" fill="white"/>
  
  <!-- Row 3 -->
  <circle cx="50" cy="150" r="15" fill="white"/>
  <circle cx="150" cy="150" r="15" fill="white"/>
  
  <!-- Row 4 -->
  <circle cx="50" cy="200" r="15" fill="white"/>
  <circle cx="150" cy="200" r="15" fill="white"/>
</svg>