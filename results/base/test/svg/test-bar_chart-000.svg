<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="400" height="300" fill="white"/>

  <!-- Chart margins and grid area -->
  <!-- Left margin: 60, Right margin: 20, Top margin: 20, Bottom margin: 60 -->
  <!-- Plot area: x from 60 to 380, y from 20 to 240 -->

  <!-- Define bar widths for 6 bars with equal spacing -->
  <!-- Bar width = 50, gap = 10, total width per bar group = 70 -->
  <!-- Bars at positions: 0, 1, 2, 3, 4 (tallest), 5 -->
  
  <!-- Bar 1 (index 0) - blue -->
  <rect x="60" y="190" width="50" height="50" fill="#1E90FF"/>

  <!-- Bar 2 (index 1) - blue -->
  <rect x="130" y="190" width="50" height="50" fill="#1E90FF"/>

  <!-- Bar 3 (index 2) - blue -->
  <rect x="200" y="190" width="50" height="50" fill="#1E90FF"/>

  <!-- Bar 4 (index 3) - blue -->
  <rect x="270" y="190" width="50" height="50" fill="#1E90FF"/>

  <!-- Bar 5 (index 4) - tallest, red -->
  <rect x="340" y="190" width="50" height="100" fill="#FF0000"/>

  <!-- Bar 6 (index 5) - blue -->
  <rect x="410" y="190" width="50" height="50" fill="#1E90FF"/>

  <!-- X-axis labels -->
  <text x="60" y="245" text-anchor="middle" font-size="12">Bar 1</text>
  <text x="130" y="245" text-anchor="middle" font-size="12">Bar 2</text>
  <text x="200" y="245" text-anchor="middle" font-size="12">Bar 3</text>
  <text x="270" y="245" text-anchor="middle" font-size="12">Bar 4</text>
  <text x="340" y="245" text-anchor="middle" font-size="12" fill="red">Bar 5</text>
  <text x="410" y="245" text-anchor="middle" font-size="12">Bar 6</text>

  <!-- Y-axis label -->
  <text x="20" y="150" text-anchor="middle" font-size="12" transform="rotate(-90 20 150)">Value</text>
</svg>