  <line x1="10" y1="140" x2="190" y2="140" stroke="#eee" stroke-width="1"/>
  
  <!-- Circles -->
  <circle cx="10" cy="20" r="10" fill="none" stroke="#333" stroke-width="2"/>
  <circle cx="70" cy="20" r="10" fill="none" stroke="#333" stroke-width="2"/>
  <circle cx="140" cy="20" r="10" fill="none" stroke="#333" stroke-width="2"/>
  
