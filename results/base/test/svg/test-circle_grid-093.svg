  <circle cx="10" cy="60" r="10" fill="none" stroke="#333" stroke-width="2"/>
  <circle cx="70" cy="60" r="10" fill="none" stroke="#333" stroke-width="2"/>
  <circle cx="140" cy="60" r="10" fill="none" stroke="#333" stroke-width="2"/>
  
  <circle cx="10" cy="80" r="10" fill="none" stroke="#333" stroke-width="2"/>
