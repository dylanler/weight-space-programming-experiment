  <circle cx="140" cy="80" r="10" fill="none" stroke="#333" stroke-width="2"/>
  
  <circle cx="10" cy="100" r="10" fill="none" stroke="#333" stroke-width="2"/>
  <circle cx="70" cy="100" r="10" fill="none" stroke="#333" stroke-width="2"/>
  <circle cx="140" cy="100" r="10" fill="none" stroke="#333" stroke-width="2"/>
  
  <circle cx="10" cy="120" r="10" fill="none" stroke="#333" stroke-width="2"/>
  <circle cx="70" cy="120" r="10" fill="none" stroke="#333" stroke-width="2"/>
  <circle cx="140" cy="120" r="10" fill="none" stroke="#333" stroke-width="2"/>
  
  <circle cx="10" cy="140" r="10" fill="none" stroke="#333" stroke-width="2"/>
  <circle cx="70" cy="140" r="10" fill="none" stroke="#333" stroke-width="2"/>
  <circle cx="140" cy="140" r="10" fill="none" stroke="#333" stroke-width="2"/>
</svg>