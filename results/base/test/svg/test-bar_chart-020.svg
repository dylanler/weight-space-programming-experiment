<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="400" height="300" fill="white"/>

  <!-- Chart margins and data range assumption: max value = 100, min = 0, bar width = 20, spacing = 60 -->
  <!-- Bars will be at x positions: 60, 120, 180, 240, 300, 360, 420 (7th bar at 420) -->
  
  <!-- Bar definitions: index 0 to 6 (7 bars total), index 6 is tallest (value=100) and red, others blue with same height except the tallest one -->
  <!-- Let's assume all bars have base height 50, but the 7th bar is taller. 
       To make it visually clear, let's set heights: 50, 50, 50, 50, 50, 50, 100 -->
  
  <!-- Bar 1 (index 0): x=60, h=50 -->
  <rect x="60" y="200" width="20" height="50" fill="#1E90FF"/>
  
  <!-- Bar 2 (index 1): x=120, h=50 -->
  <rect x="120" y="200" width="20" height="50" fill="#1E90FF"/>
  
  <!-- Bar 3 (index 2): x=180, h=50 -->
  <rect x="180" y="200" width="20" height="50" fill="#1E90FF"/>
  
  <!-- Bar 4 (index 3): x=240, h=50 -->
  <rect x="240" y="200" width="20" height="50" fill="#1E90FF"/>
  
  <!-- Bar 5 (index 4): x=300, h=50 -->
  <rect x="300" y="200" width="20" height="50" fill="#1E90FF"/>
  
  <!-- Bar 6 (index 5): x=360, h=50 -->
  <rect x="360" y="200" width="20" height="50" fill="#1E90FF"/>
  
  <!-- Bar 7 (index 6): x=420, h=100 (tallest, red) -->
  <rect x="420" y="100" width="20" height="100" fill="#FF0000"/>
</svg>