<svg width="300" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Building outline -->
  <rect x="100" y="50" width="100" height="300" fill="#8B4513" stroke="#5D2906" stroke-width="2"/>
  
  <!-- Floor 1 -->
  <rect x="110" y="80" width="80" height="60" fill="#A0522D" stroke="#5D2906" stroke-width="2"/>
  <!-- Floor 1 windows -->
  <rect x="120" y="85" width="20" height="40" fill="#696969" stroke="#5D2906" stroke-width="1"/>
  <rect x="140" y="85" width="20" height="40" fill="#696969" stroke="#5D2906" stroke-width="1"/>
  <rect x="160" y="85" width="20" height="40" fill="#696969" stroke="#5D2906" stroke-width="1"/>
  <rect x="180" y="85" width="20" height="40" fill="#696969" stroke="#5D2906" stroke-width="1"/>
  
  <!-- Floor 2 -->
  <rect x="110" y="140" width="80" height="60" fill="#A0522D" stroke="#5D2906" stroke-width="2"/>
  <!-- Floor 2 windows -->
  <rect x="120" y="145" width="20" height="40" fill="#696969" stroke="#5D2906" stroke-width="1"/>
  <rect x="140" y="145" width="20" height="40" fill="#696969" stroke="#5D2906" stroke-width="1"/>
  <rect x="160" y="145" width="20" height="40" fill="#696969" stroke="#5D2906" stroke-width="1"/>
  <rect x="180" y="145" width="20" height="40" fill="#696969" stroke="#5D2906" stroke-width="1"/>
</svg>