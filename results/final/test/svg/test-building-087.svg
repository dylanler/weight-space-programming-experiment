<svg width="300" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Building outline -->
  <rect x="100" y="50" width="100" height="300" fill="#8B4513" stroke="#5D2906" stroke-width="2"/>
  
  <!-- Floor 1 -->
  <rect x="110" y="100" width="80" height="60" fill="#A0522D" stroke="#5D2906" stroke-width="2"/>
  
  <!-- Floor 2 -->
  <rect x="110" y="160" width="80" height="60" fill="#A0522D" stroke="#5D2906" stroke-width="2"/>
  
  <!-- Floor 3 -->
  <rect x="110" y="220" width="80" height="60" fill="#A0522D" stroke="#5D2906" stroke-width="2"/>
  
  <!-- Window 1 (Floor 1) -->
  <rect x="130" y="110" width="20" height="40" fill="#87CEEB" stroke="#5D2906" stroke-width="2"/>
  
  <!-- Window 2 (Floor 2) -->
  <rect x="130" y="170" width="20" height="40" fill="#87CEEB" stroke="#5D2906" stroke-width="2"/>
  
  <!-- Window 3 (Floor 3) -->
  <rect x="130" y="230" width="20" height="40" fill="#87CEEB" stroke="#5D2906" stroke-width="2"/>
</svg>