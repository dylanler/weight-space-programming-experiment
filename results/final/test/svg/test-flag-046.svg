<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="200" fill="white"/>
  
  <!-- 5 Horizontal Stripes -->
  <rect x="0" y="0" width="300" height="40" fill="#006400"/>
  <rect x="0" y="80" width="300" height="40" fill="#009639"/>
  <rect x="0" y="160" width="300" height="40" fill="#00897b"/>
  <rect x="0" y="240" width="300" height="40" fill="#004d00"/>
  <rect x="0" y="320" width="300" height="40" fill="#003300"/>
  
  <!-- 5 Stars (centered on each stripe) -->
  <!-- Star 1: Top stripe -->
  <polygon points="150,20 145,25 140,20 135,25 130,20 125,25 120,20 115,25 110,20 105,25 100,20 95,25 90,20 85,25 80,20 75,25 70,20 65,25 60,20 55,25 50,20 45,25 40,20 35,25 30,20 25,25 20,20 15,25 10,20 5,25 0,20" fill="#FFD700"/>
  
  <!-- Star 2: Second stripe -->
  <polygon points="150,80 145,85 140,80 135,85 130,80 125,85 120,80 115,85 110,80 105,85 100,80 95,85 90,80 85,85 80,80 75,85 70,80 65,85 60,80 55,85 50,80 45,85 40,80 35,85 30,80 25,85 20,80 15,85 10,80 5,85 0,80" fill="#FFD700"/>
  
  <!-- Star 3: Third stripe -->
  <polygon points="150,160 145,165 140,160 135,165 130,160 125,165 120,160 115,165 110,160 105,165 100,160 95,165 90,160 85,165 80,160 75,165 70,160 65,165 60,160 55,165 50,160 45,165 40,160 35,165 30,160 25,165 20,160 15,165 10,160 5,165 0,160" fill="#FFD700"/>
  
  <!-- Star 4: Fourth stripe -->
  <polygon points="150,240 145,245 140,240 135,245 130,240 125,245 120,240 115,245 110,240 105,245 100,240 95,245 90,240 85,245 80,240 75,245 70,240 65,245 60,240 55,245 50,240 45,245 40,240 35,245 30,240 25,245 20,240 15,245 10,240 5,245 0,240" fill="#FFD700"/>
  
  <!-- Star 5: Bottom stripe -->
  <polygon points="150,320 145,325 140,320 135,325 130,320 125,325 120,320 115,325 110,320 105,325 100,320 95,325 90,320 85,325 80,320 75,325 70,320 65,325 60,320 55,325 50,320 45,325 40,320 35,325 30,320 25,325 20,320 15,325 10,320 5,325 0,320" fill="#FFD700"/>
</svg>