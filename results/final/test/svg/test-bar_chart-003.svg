<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="white"/>
  
  <!-- Chart margins -->
  <rect x="60" y="20" width="280" height="260" fill="none" stroke="black" stroke-width="1"/>
  
  <!-- Y-axis line -->
  <line x1="60" y1="20" x2="60" y2="40" stroke="black" stroke-width="1"/>
  
  <!-- X-axis line -->
  <line x1="60" y1="40" x2="340" y2="40" stroke="black" stroke-width="1"/>
  
  <!-- X-axis ticks and labels -->
  <line x1="60" y1="40" x2="60" y2="45" stroke="black" stroke-width="1"/>
  <text x="60" y="60" text-anchor="middle" font-size="12">1</text>
  
  <line x1="180" y1="40" x2="180" y2="45" stroke="black" stroke-width="1"/>
  <text x="180" y="60" text-anchor="middle" font-size="12">2</text>
  
  <line x1="300" y1="40" x2="300" y2="45" stroke="black" stroke-width="1"/>
  <text x="300" y="60" text-anchor="middle" font-size="12">3</text>
  
  <line x1="340" y1="40" x2="340" y2="45" stroke="black" stroke-width="1"/>
  <text x="340" y="60" text-anchor="middle" font-size="12">4</text>
  
  <!-- Y-axis labels -->
  <text x="40" y="45" text-anchor="end" font-size="12">100</text>
  <text x="40" y="80" text-anchor="end" font-size="12">200</text>
  <text x="40" y="115" text-anchor="end" font-size="12">300</text>
  <text x="40" y="150" text-anchor="end" font-size="12">400</text>
  <text x="40" y="185" text-anchor="end" font-size="12">500</text>
  <text x="40" y="220" text-anchor="end" font-size="12">600</text>
  <text x="40" y="255" text-anchor="end" font-size="12">700</text>
  <text x="40" y="290" text-anchor="end" font-size="12">800</text>
  
  <!-- Bars -->
  <!-- Bar 1: height 100 -->
  <rect x="60" y="100" width="40" height="100" fill="blue"/>
  
  <!-- Bar 2: height 150 -->
  <rect x="180" y="150" width="40" height="150" fill="blue"/>
  
  <!-- Bar 3: height 200 -->
  <rect x="300" y="200" width="40" height="200" fill="blue"/>
  
  <!-- Bar 4: height 250 -->
  <rect x="340" y="250" width="40" height="250" fill="blue"/>
  
  <!-- Bar 5: height 300 (tallest, red) -->
  <rect x="60" y="300" width="40" height="300" fill="red"/>
  
  <!-- Bar 6: height 350 -->
  <rect x="180" y="350" width="40" height="350" fill="blue"/>
</svg>