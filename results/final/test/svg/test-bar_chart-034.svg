<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="400" height="300" fill="white"/>
  
  <!-- Chart margins -->
  <!-- Left margin: 60, Right margin: 20, Top margin: 40, Bottom margin: 60 -->
  <!-- Chart area: x from 60 to 380, y from 40 to 240 -->
  
  <!-- Bar widths and heights (assuming max height of 200 for scaling) -->
  <!-- Bar 1: height 60 -->
  <!-- Bar 2: height 80 -->
  <!-- Bar 3: height 200 (tallest, red) -->
  <!-- Bar 4: height 70 -->
  
  <!-- Define bar width -->
  <!-- Total width available: 380 - 60 = 320 -->
  <!-- 4 bars: 320 / 4 = 80 per bar -->
  
  <!-- Bar 1 (Blue) -->
  <rect x="60" y="140" width="80" height="60" fill="blue"/>
  
  <!-- Bar 2 (Blue) -->
  <rect x="140" y="120" width="80" height="80" fill="blue"/>
  
  <!-- Bar 3 (Red) - Tallest -->
  <rect x="220" y="40" width="80" height="200" fill="red"/>
  
  <!-- Bar 4 (Blue) -->
  <rect x="300" y="130" width="80" height="70" fill="blue"/>
  
  <!-- X-axis labels -->
  <text x="100" y="280" text-anchor="middle" font-size="12">1</text>
  <text x="200" y="280" text-anchor="middle" font-size="12">2</text>
  <text x="300" y="280" text-anchor="middle" font-size="12">3</text>
  <text x="400" y="280" text-anchor="middle" font-size="12">4</text>
  
  <!-- Y-axis label -->
  <text x="20" y="140" text-anchor="middle" font-size="12" transform="rotate(-90 20 140)">Value</text>
</svg>