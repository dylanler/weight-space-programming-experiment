<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="400" fill="white"/>

  <!-- Tree trunk -->
  <rect x="320" y="150" width="40" height="200" fill="#8B4513"/>

  <!-- Tree branches -->
  <line x1="320" y1="150" x2="200" y2="200" stroke="#5D4037" stroke-width="8"/>
  <line x1="320" y1="150" x2="360" y2="200" stroke="#5D4037" stroke-width="8"/>
  <line x1="320" y1="150" x2="280" y2="200" stroke="#5D4037" stroke-width="8"/>

  <!-- Tree leaves (green) -->
  <polygon points="200,200 240,180 280,180 260,220" fill="#228B22"/>
  <polygon points="360,200 400,180 420,180 400,220" fill="#228B22"/>
  <polygon points="280,200 320,180 360,180 340,220" fill="#228B22"/>

  <!-- Apples (red) -->
  <!-- Top-left -->
  <circle cx="220" cy="180" r="12" fill="red"/>
  <!-- Top-right -->
  <circle cx="280" cy="180" r="12" fill="red"/>
  <!-- Middle-left -->
  <circle cx="240" cy="200" r="12" fill="red"/>
  <!-- Middle-right -->
  <circle cx="300" cy="200" r="12" fill="red"/>
  <!-- Bottom-left -->
  <circle cx="220" cy="220" r="12" fill="red"/>
  <!-- Bottom-right -->
  <circle cx="280" cy="220" r="12" fill="red"/>
  <!-- Far bottom-left -->
  <circle cx="200" cy="240" r="12" fill="red"/>
  <!-- Far bottom-right -->
  <circle cx="320" cy="240" r="12" fill="red"/>
  <!-- Far bottom-center -->
  <circle cx="280" cy="240" r="12" fill="red"/>
  <!-- Far bottom-left again (duplicate for variety) -->
  <circle cx="200" cy="240" r="12" fill="red"/>
  <!-- Far bottom-right again -->
  <circle cx="320" cy="240" r="12" fill="red"/>
  <!-- Far bottom-center again -->
  <circle cx="280" cy="240" r="12" fill="red"/>
</svg>