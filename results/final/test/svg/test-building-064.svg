<svg width="400" height="500" xmlns="http://www.w3.org/2000/svg">
  <!-- Building outline -->
  <rect x="100" y="50" width="200" height="400" fill="#8B4513" stroke="#5D2906" stroke-width="2"/>
  
  <!-- Floors (6 floors) -->
  <!-- Floor 1 -->
  <rect x="110" y="100" width="180" height="60" fill="#A0522D" stroke="#5D2906" stroke-width="1"/>
  <!-- Floor 2 -->
  <rect x="110" y="160" width="180" height="60" fill="#A0522D" stroke="#5D2906" stroke-width="1"/>
  <!-- Floor 3 -->
  <rect x="110" y="220" width="180" height="60" fill="#A0522D" stroke="#5D2906" stroke-width="1"/>
  <!-- Floor 4 -->
  <rect x="110" y="280" width="180" height="60" fill="#A0522D" stroke="#5D2906" stroke-width="1"/>
  <!-- Floor 5 -->
  <rect x="110" y="340" width="180" height="60" fill="#A0522D" stroke="#5D2906" stroke-width="1"/>
  <!-- Floor 6 -->
  <rect x="110" y="400" width="180" height="60" fill="#A0522D" stroke="#5D2906" stroke-width="1"/>
  
  <!-- Windows (19 total, 3 per floor) -->
