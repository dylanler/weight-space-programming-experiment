  <rect x="205" y="105" width="30" height="55" fill="#87CEEB" stroke="#5D2906" stroke-width="1"/>
  
  <!-- Floor 2: 3 windows -->
  <rect x="125" y="165" width="30" height="55" fill="#87CEEB" stroke="#5D2906" stroke-width="1"/>
  <rect x="165" y="165" width="30" height="55" fill="#87CEEB" stroke="#5D2906" stroke-width="1"/>
  <rect x="205" y="165" width="30" height="55" fill="#87CEEB" stroke="#5D2906" stroke-width="1"/>
  
  <!-- Floor 3: 3 windows -->
  <rect x="125" y="225" width="30" height="55" fill="#87CEEB" stroke="#5D2906" stroke-width="1"/>
  <rect x="165" y="225" width="30" height="55" fill="#87CEEB" stroke="#5D2906" stroke-width="1"/>
  <rect x="205" y="225" width="30" height="55" fill="#87CEEB" stroke="#5D2906" stroke-width="1"/>
  
  <!-- Floor 4: 3 windows -->
  <rect x="125" y="285" width="30" height="55" fill="#87CEEB" stroke="#5D2906" stroke-width="1"/>
  <rect x="165" y="285" width="30" height="55" fill="#87CEEB" stroke="#5D2906" stroke-width="1"/>
  <rect x="205" y="285" width="30" height="55" fill="#87CEEB" stroke="#5D2906" stroke-width="1"/>
  
  <!-- Floor 5: 3 windows -->
  <rect x="125" y="345" width="30" height="55" fill="#87CEEB" stroke="#5D2906" stroke-width="1"/>
  <rect x="165" y="345" width="30" height="55" fill="#87CEEB" stroke="#5D2906" stroke-width="1"/>
  <rect x="205" y="345" width="30" height="55" fill="#87CEEB" stroke="#5D2906" stroke-width="1"/>
  
  <!-- Floor 6: 3 windows -->
  <rect x="125" y="405" width="30" height="55" fill="#87CEEB" stroke="#5D2906" stroke-width="1"/>
  <rect x="165" y="405" width="30" height="55" fill="#87CEEB" stroke="#5D2906" stroke-width="1"/>
  <rect x="205" y="405" width="30" height="55" fill="#87CEEB" stroke="#5D2906" stroke-width="1"/>
