<svg width="300" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Tree trunk -->
  <rect x="220" y="100" width="40" height="150" fill="#8B4513" />
  
  <!-- Tree branches -->
  <line x1="220" y1="100" x2="180" y2="140" stroke="#5D4037" stroke-width="8" />
  <line x1="220" y1="100" x2="260" y2="140" stroke="#5D4037" stroke-width="8" />
  <line x1="220" y1="100" x2="240" y2="180" stroke="#5D4037" stroke-width="8" />
  
  <!-- Tree leaves (green) -->
  <polygon points="180,140 200,120 220,140 240,160 260,140" fill="#2E7D32" />
  <polygon points="240,180 260,160 280,180 260,200 240,220" fill="#2E7D32" />
  <polygon points="220,140 200,120 240,160 260,140 280,180" fill="#2E7D32" />
  
  <!-- Apples (red) -->
  <!-- Top-left -->
  <circle cx="190" cy="130" r="8" fill="#D32F2F" />
  <!-- Top-right -->
  <circle cx="210" cy="130" r="8" fill="#D32F2F" />
  <!-- Middle-left -->
  <circle cx="195" cy="170" r="8" fill="#D32F2F" />
  <!-- Middle-right -->
  <circle cx="215" cy="170" r="8" fill="#D32F2F" />
  <!-- Bottom-left -->
  <circle cx="190" cy="210" r="8" fill="#D32F2F" />
  <!-- Bottom-right -->
  <circle cx="210" cy="210" r="8" fill="#D32F2F" />
  <!-- Far bottom-left -->
  <circle cx="185" cy="240" r="8" fill="#D32F2F" />
  <!-- Far bottom-right -->
  <circle cx="215" cy="240" r="8" fill="#D32F2F" />
</svg>