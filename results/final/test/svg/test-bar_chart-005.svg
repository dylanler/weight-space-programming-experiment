<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="400" height="300" fill="white"/>
  
  <!-- Chart margins -->
  <!-- Left margin: 60, Right margin: 20, Top margin: 40, Bottom margin: 60 -->
  <!-- Chart area: x from 60 to 380, y from 40 to 240 -->
  
  <!-- Bar 1 (blue) -->
  <rect x="60" y="120" width="60" height="120" fill="blue"/>
  
  <!-- Bar 2 (blue) -->
  <rect x="180" y="120" width="60" height="120" fill="blue"/>
  
  <!-- Bar 3 (red, tallest) -->
  <rect x="300" y="40" width="60" height="200" fill="red"/>
  
  <!-- X-axis labels -->
  <text x="120" y="280" text-anchor="middle" font-size="12">1</text>
  <text x="240" y="280" text-anchor="middle" font-size="12">2</text>
  <text x="360" y="280" text-anchor="middle" font-size="12">3</text>
  
  <!-- Y-axis label -->
  <text x="20" y="160" text-anchor="middle" font-size="12" transform="rotate(-90, 20, 160)">Value</text>
</svg>