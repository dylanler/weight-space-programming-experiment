<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Define grid parameters -->
  <!-- 6 rows, 5 columns, total 30 circles -->
  <!-- Cell size: 200 / 30 ≈ 6.67 px -->
  
  <!-- Row 1 -->
  <circle cx="10" cy="10" r="4" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="30" cy="10" r="4" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="50" cy="10" r="4" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="70" cy="10" r="4" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="90" cy="10" r="4" fill="white" stroke="black" stroke-width="1"/>
  
  <!-- Row 2 -->
  <circle cx="10" cy="30" r="4" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="30" cy="30" r="4" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="50" cy="30" r="4" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="70" cy="30" r="4" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="90" cy="30" r="4" fill="white" stroke="black" stroke-width="1"/>
  
  <!-- Row 3 -->
  <circle cx="10" cy="50" r="4" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="30" cy="50" r="4" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="50" cy="50" r="4" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="70" cy="50" r="4" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="90" cy="50" r="4" fill="white" stroke="black" stroke-width="1"/>
  
  <!-- Row 4 -->
  <circle cx="10" cy="70" r="4" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="30" cy="70" r="4" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="50" cy="70" r="4" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="70" cy="70" r="4" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="90" cy="70" r="4" fill="white" stroke="black" stroke-width="1"/>
  
  <!-- Row 5 -->
  <circle cx="10" cy="90" r="4" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="30" cy="90" r="4" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="50" cy="90" r="4" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="70" cy="90" r="4" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="90" cy="90" r="4" fill="white" stroke="black" stroke-width="1"/>
  
  <!-- Row 6 -->
  <circle cx="10" cy="110" r="4" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="30" cy="110" r="4" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="50" cy="110" r="4" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="70" cy="110" r="4" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="90" cy="110" r="4" fill="white" stroke="black" stroke-width="1"/>
</svg>