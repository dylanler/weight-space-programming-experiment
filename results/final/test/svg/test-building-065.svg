<svg width="200" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Building outline -->
  <rect x="50" y="50" width="100" height="200" fill="#8B4513" stroke="#5D2906" stroke-width="2"/>
  
  <!-- Floor 1 -->
  <rect x="60" y="100" width="40" height="40" fill="#A0522D" stroke="#5D2906" stroke-width="2"/>
  <rect x="100" y="100" width="40" height="40" fill="#A0522D" stroke="#5D2906" stroke-width="2"/>
  <rect x="140" y="100" width="40" height="40" fill="#A0522D" stroke="#5D2906" stroke-width="2"/>
  
  <!-- Floor 2 -->
  <rect x="60" y="140" width="40" height="40" fill="#A0522D" stroke="#5D2906" stroke-width="2"/>
  <rect x="100" y="140" width="40" height="40" fill="#A0522D" stroke="#5D2906" stroke-width="2"/>
  <rect x="140" y="140" width="40" height="40" fill="#A0522D" stroke="#5D2906" stroke-width="2"/>
  
  <!-- Floor 3 -->
  <rect x="60" y="180" width="40" height="40" fill="#A0522D" stroke="#5D2906" stroke-width="2"/>
  <rect x="100" y="180" width="40" height="40" fill="#A0522D" stroke="#5D2906" stroke-width="2"/>
  <rect x="140" y="180" width="40" height="40" fill="#A0522D" stroke="#5D2906" stroke-width="2"/>
  
  <!-- Windows -->
  <!-- Floor 1, Left -->
  <rect x="70" y="110" width="10" height="10" fill="#87CEEB" stroke="#000080" stroke-width="1"/>
  <!-- Floor 1, Right -->
  <rect x="110" y="110" width="10" height="10" fill="#87CEEB" stroke="#000080" stroke-width="1"/>
  <!-- Floor 2, Left -->
  <rect x="70" y="130" width="10" height="10" fill="#87CEEB" stroke="#000080" stroke-width="1"/>
  <!-- Floor 2, Right -->
  <rect x="110" y="130" width="10" height="10" fill="#87CEEB" stroke="#000080" stroke-width="1"/>
  <!-- Floor 3, Left -->
  <rect x="70" y="150" width="10" height="10" fill="#87CEEB" stroke="#000080" stroke-width="1"/>
  <!-- Floor 3, Right -->
  <rect x="110" y="150" width="10" height="10" fill="#87CEEB" stroke="#000080" stroke-width="1"/>
</svg>