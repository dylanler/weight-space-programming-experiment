<svg width="300" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Tree trunk -->
  <rect x="220" y="120" width="40" height="100" fill="#8B4513" />
  
  <!-- Tree branches -->
  <line x1="220" y1="120" x2="180" y2="100" stroke="#5D4037" stroke-width="8" />
  <line x1="220" y1="120" x2="240" y2="140" stroke="#5D4037" stroke-width="8" />
  <line x1="220" y1="120" x2="200" y2="160" stroke="#5D4037" stroke-width="8" />
  
  <!-- Tree leaves (green) -->
  <polygon points="180,100 200,80 220,100 240,120" fill="#2E7D32" />
  <polygon points="200,140 220,160 240,140 220,160" fill="#2E7D32" />
  <polygon points="200,160 220,180 240,160 220,180" fill="#2E7D32" />
  <polygon points="240,120 260,100 280,120 260,140" fill="#2E7D32" />
  <polygon points="260,140 280,160 300,140 280,160" fill="#2E7D32" />
  <polygon points="260,160 280,180 300,160 280,180" fill="#2E7D32" />
  
  <!-- Apples (red) -->
  <!-- Top-left -->
  <circle cx="190" cy="90" r="6" fill="#D32F2F" />
  <!-- Top-right -->
  <circle cx="210" cy="90" r="6" fill="#D32F2F" />
  <!-- Middle-left -->
  <circle cx="195" cy="130" r="6" fill="#D32F2F" />
  <!-- Middle-right -->
  <circle cx="215" cy="130" r="6" fill="#D32F2F" />
  <!-- Bottom-left -->
  <circle cx="190" cy="170" r="6" fill="#D32F2F" />
  <!-- Bottom-right -->
  <circle cx="210" cy="170" r="6" fill="#D32F2F" />
  <!-- Far bottom-left -->
  <circle cx="185" cy="200" r="6" fill="#D32F2F" />
  <!-- Far bottom-right -->
  <circle cx="215" cy="200" r="6" fill="#D32F2F" />
</svg>