<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="white"/>
  
  <!-- Chart margins and grid -->
  <rect x="60" y="60" width="280" height="180" fill="none" stroke="#e0e0e0" stroke-dasharray="2,2"/>
  
  <!-- Y-axis labels -->
  <text x="50" y="100" text-anchor="end" font-size="12">0</text>
  <text x="50" y="140" text-anchor="end" font-size="12">50</text>
  <text x="50" y="180" text-anchor="end" font-size="12">100</text>
  
  <!-- X-axis labels -->
  <text x="120" y="240" text-anchor="middle" font-size="12">1</text>
  <text x="180" y="240" text-anchor="middle" font-size="12">2</text>
  <text x="240" y="240" text-anchor="middle" font-size="12">3</text>
  <text x="300" y="240" text-anchor="middle" font-size="12">4</text>
  <text x="360" y="240" text-anchor="middle" font-size="12">5</text>
  
  <!-- Bars -->
  <!-- Bar 1: height 40 -->
  <rect x="60" y="100" width="20" height="40" fill="blue"/>
  
  <!-- Bar 2: height 60 -->
  <rect x="120" y="140" width="20" height="60" fill="blue"/>
  
  <!-- Bar 3: height 40 -->
  <rect x="180" y="100" width="20" height="40" fill="blue"/>
  
  <!-- Bar 4: height 120 (tallest, red) -->
  <rect x="240" y="80" width="20" height="120" fill="red"/>
  
  <!-- Bar 5: height 60 -->
  <rect x="300" y="140" width="20" height="60" fill="blue"/>
  
  <!-- Bar 6: height 40 -->
  <rect x="360" y="100" width="20" height="40" fill="blue"/>
  
  <!-- Bar 7: height 80 -->
  <rect x="420" y="120" width="20" height="80" fill="blue"/>
  
  <!-- Bar 8: height 40 -->
  <rect x="480" y="100" width="20" height="40" fill="blue"/>
</svg>