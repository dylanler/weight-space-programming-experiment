<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="400" height="300" fill="white"/>
  
  <!-- Chart margins -->
  <!-- Left margin: 60, Right margin: 20, Top margin: 20, Bottom margin: 60 -->
  <!-- Chart area: x from 60 to 380, y from 20 to 240 -->
  
  <!-- Bar 1: Tallest, red -->
  <rect x="60" y="20" width="80" height="180" fill="red"/>
  
  <!-- Bar 2: Medium height, blue -->
  <rect x="140" y="20" width="80" height="100" fill="blue"/>
  
  <!-- Bar 3: Short height, blue -->
  <rect x="220" y="20" width="80" height="40" fill="blue"/>
  
  <!-- Bar 4: Shortest height, blue -->
  <rect x="300" y="20" width="80" height="20" fill="blue"/>
  
  <!-- Y-axis label -->
  <text x="55" y="260" text-anchor="middle" font-size="14" fill="black">Value</text>
  
  <!-- X-axis label -->
  <text x="230" y="285" text-anchor="middle" font-size="14" fill="black">Category</text>
</svg>