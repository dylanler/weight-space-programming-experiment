<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="400" height="300" fill="white"/>
  
  <!-- Chart margins -->
  <!-- Left margin: 60, Right margin: 20, Top margin: 40, Bottom margin: 60 -->
  <!-- Chart area: x from 60 to 380, y from 40 to 240 -->
  
  <!-- Bar widths and heights (all 10 units wide, 20 units tall) -->
  <!-- Bar 1: height 10 -->
  <!-- Bar 2: height 15 -->
  <!-- Bar 3: height 20 -->
  <!-- Bar 4: height 25 -->
  <!-- Bar 5: height 30 (tallest, red) -->
  <!-- Bar 6: height 12 -->
  
  <!-- Define bar width -->
  <defs>
    <style>
      .bar { fill: blue; }
      .tallest { fill: red; }
    </style>
  </defs>
  
  <!-- Bar 1 -->
  <rect x="60" y="230" width="10" height="10" class="bar"/>
  
  <!-- Bar 2 -->
  <rect x="80" y="210" width="10" height="15" class="bar"/>
  
  <!-- Bar 3 -->
  <rect x="100" y="190" width="10" height="20" class="bar"/>
  
  <!-- Bar 4 -->
  <rect x="120" y="170" width="10" height="25" class="bar"/>
  
  <!-- Bar 5 (Tallest, Red) -->
  <rect x="140" y="150" width="10" height="30" class="tallest"/>
  
  <!-- Bar 6 -->
  <rect x="160" y="138" width="10" height="12" class="bar"/>
  
  <!-- X-axis labels -->
  <text x="60" y="260" text-anchor="middle" font-size="12">1</text>
  <text x="80" y="260" text-anchor="middle" font-size="12">2</text>
  <text x="100" y="260" text-anchor="middle" font-size="12">3</text>
  <text x="120" y="260" text-anchor="middle" font-size="12">4</text>
  <text x="140" y="260" text-anchor="middle" font-size="12">5</text>
  <text x="160" y="260" text-anchor="middle" font-size="12">6</text>
  
  <!-- X-axis ticks and labels -->
  <line x1="60" y1="240" x2="60" y2="260" stroke="black" stroke-width="1"/>
  <text x="60" y="280" text-anchor="middle">1</text>
  
  <line x1="80" y1="240" x2="80" y2="260" stroke="black" stroke-width="1"/>
  <text x="80" y="280" text-anchor="middle">2</text>
  
  <line x1="100" y1="240" x2="100" y2="260" stroke="black" stroke-width="1"/>
  <text x="100" y="280" text-anchor="middle">3</text>
  
  <line x1="120" y1="240" x2="120" y2="260" stroke="black" stroke-width="1"/>
  <text x="120" y="280" text-anchor="middle">4</text>
  
  <line x1="140" y1="240" x2="140" y2="260" stroke="black" stroke-width="1"/>
  <text x="140" y="280" text-anchor="middle">5</text>
  
  <line x1="160" y1="240" x2="160" y2="260" stroke="black" stroke-width="1"/>
  <text x="160" y="280" text-anchor="middle">6</text>
</svg>