<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .apple { fill: #ff4757; }
      .stem { fill: #2f3542; }
      .leaf { fill: #2ed573; }
    </style>
  </defs>
  
  <!-- Tree trunk -->
  <rect x="120" y="100" width="40" height="100" rx="5" class="stem" />
  
  <!-- Tree branches -->
  <line x1="120" y1="100" x2="100" y2="80" stroke="#2f3542" stroke-width="8" />
  <line x1="120" y1="100" x2="140" y2="120" stroke="#2f3542" stroke-width="8" />
  <line x1="120" y1="100" x2="160" y2="140" stroke="#2f3542" stroke-width="8" />
  
  <!-- Tree leaves -->
  <polygon points="100,80 120,60 140,80" class="leaf" />
  <polygon points="140,120 160,140 180,120" class="leaf" />
  <polygon points="160,140 180,160 180,180" class="leaf" />
  <polygon points="180,160 200,180 200,200" class="leaf" />
  <polygon points="180,180 200,200 200,220" class="leaf" />
  
  <!-- Apples -->
  <circle cx="125" cy="85" r="8" class="apple" />
  <circle cx="135" cy="115" r="8" class="apple" />
  <circle cx="155" cy="145" r="8" class="apple" />
  <circle cx="175" cy="175" r="8" class="apple" />
  <circle cx="195" cy="195" r="8" class="apple" />
</svg>