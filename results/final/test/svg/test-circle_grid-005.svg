<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Define grid parameters -->
  <!-- 5 rows, 5 columns, total 25 circles -->
  <!-- Center of grid: (100, 100) -->
  <!-- Radius: 15 -->
  <!-- Spacing: 20 -->
  
  <!-- Row 1 -->
  <circle cx="100" cy="100" r="15" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="120" cy="100" r="15" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="140" cy="100" r="15" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="160" cy="100" r="15" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="180" cy="100" r="15" fill="white" stroke="black" stroke-width="1"/>
  
  <!-- Row 2 -->
  <circle cx="100" cy="120" r="15" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="120" cy="120" r="15" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="140" cy="120" r="15" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="160" cy="120" r="15" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="180" cy="120" r="15" fill="white" stroke="black" stroke-width="1"/>
  
  <!-- Row 3 -->
  <circle cx="100" cy="140" r="15" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="120" cy="140" r="15" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="140" cy="140" r="15" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="160" cy="140" r="15" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="180" cy="140" r="15" fill="white" stroke="black" stroke-width="1"/>
  
  <!-- Row 4 -->
  <circle cx="100" cy="160" r="15" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="120" cy="160" r="15" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="140" cy="160" r="15" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="160" cy="160" r="15" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="180" cy="160" r="15" fill="white" stroke="black" stroke-width="1"/>
  
  <!-- Row 5 -->
  <circle cx="100" cy="180" r="15" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="120" cy="180" r="15" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="140" cy="180" r="15" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="160" cy="180" r="15" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="180" cy="180" r="15" fill="white" stroke="black" stroke-width="1"/>
</svg>