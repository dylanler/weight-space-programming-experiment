<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="200" fill="white"/>
  
  <!-- 7 Horizontal Stripes -->
  <rect x="0" y="0" width="300" height="28.57" fill="#006400"/>
  <rect x="0" y="57.14" width="300" height="28.57" fill="#009600"/>
  <rect x="0" y="105.71" width="300" height="28.57" fill="#009933"/>
  <rect x="0" y="154.29" width="300" height="28.57" fill="#009966"/>
  <rect x="0" y="202.86" width="300" height="28.57" fill="#009999"/>
  <rect x="0" y="251.43" width="300" height="28.57" fill="#0099CC"/>
  <rect x="0" y="300" width="300" height="28.57" fill="#0099FF"/>
  
  <!-- 7 Stars (centered on each stripe) -->
  <!-- Stripe 1 -->
  <g transform="translate(150, 14.29)">
    <polygon points="0,-10 6,-4 0,0 -6,-4 0,10" fill="#FFD700"/>
  </g>
  <!-- Stripe 2 -->
  <g transform="translate(150, 85.71)">
    <polygon points="0,-10 6,-4 0,0 -6,-4 0,10" fill="#FFD700"/>
  </g>
  <!-- Stripe 3 -->
  <g transform="translate(150, 134.29)">
    <polygon points="0,-10 6,-4 0,0 -6,-4 0,10" fill="#FFD700"/>
  </g>
  <!-- Stripe 4 -->
  <g transform="translate(150, 182.86)">
    <polygon points="0,-10 6,-4 0,0 -6,-4 0,10" fill="#FFD700"/>
  </g>
  <!-- Stripe 5 -->
  <g transform="translate(150, 231.43)">
    <polygon points="0,-10 6,-4 0,0 -6,-4 0,10" fill="#FFD700"/>
  </g>
  <!-- Stripe 6 -->
  <g transform="translate(150, 280)">
    <polygon points="0,-10 6,-4 0,0 -6,-4 0,10" fill="#FFD700"/>
  </g>
  <!-- Stripe 7 -->
  <g transform="translate(150, 328.57)">
    <polygon points="0,-10 6,-4 0,0 -6,-4 0,10" fill="#FFD700"/>
  </g>
</svg>