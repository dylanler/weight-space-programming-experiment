<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Define styles -->
  <style>
    .bar { fill: blue; }
    .tall-bar { fill: red; }
  </style>

  <!-- Background -->
  <rect x="0" y="0" width="400" height="300" fill="white"/>

  <!-- Chart margins -->
  <!-- Left margin: 60, Right margin: 20, Top margin: 20, Bottom margin: 40 -->
  <!-- Chart area: x from 60 to 380, y from 20 to 260 -->

  <!-- Bar positions (indices 0 to 8) -->
  <!-- Heights: 10, 12, 15, 18, 20, 22, 25, 28, 30 -->
  <!-- 5th bar (index 4) is tallest and red -->

  <!-- Bar 0 -->
  <rect x="60" y="20" width="40" height="10" class="bar"/>

  <!-- Bar 1 -->
  <rect x="100" y="20" width="40" height="12" class="bar"/>

  <!-- Bar 2 -->
  <rect x="140" y="20" width="40" height="15" class="bar"/>

  <!-- Bar 3 -->
  <rect x="180" y="20" width="40" height="18" class="bar"/>

  <!-- Bar 4 (Tallest, Red) -->
  <rect x="220" y="20" width="40" height="22" class="tall-bar"/>

  <!-- Bar 5 -->
  <rect x="260" y="20" width="40" height="20" class="bar"/>

  <!-- Bar 6 -->
  <rect x="300" y="20" width="40" height="25" class="bar"/>

  <!-- Bar 7 -->
  <rect x="340" y="20" width="40" height="28" class="bar"/>

  <!-- Bar 8 -->
  <rect x="380" y="20" width="40" height="30" class="bar"/>
</svg>