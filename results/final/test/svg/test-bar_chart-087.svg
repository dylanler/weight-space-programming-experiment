<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Define styles -->
  <style>
    .bar { fill: blue; }
    .tall-bar { fill: red; }
  </style>

  <!-- Background -->
  <rect x="0" y="0" width="400" height="300" fill="white"/>

  <!-- Bar positions (assuming equal width of 40px, starting at x=40) -->
  <!-- Bar 1: x=40, height=30 -->
  <rect x="40" y="270" width="40" height="30" class="bar"/>
  
  <!-- Bar 2: x=80, height=40 -->
  <rect x="80" y="260" width="40" height="40" class="bar"/>
  
  <!-- Bar 3: x=120, height=60 (tallest, red) -->
  <rect x="120" y="240" width="40" height="60" class="tall-bar"/>
  
  <!-- Bar 4: x=160, height=30 -->
  <rect x="160" y="270" width="40" height="30" class="bar"/>
  
  <!-- Bar 5: x=200, height=20 -->
  <rect x="200" y="280" width="40" height="20" class="bar"/>
</svg>