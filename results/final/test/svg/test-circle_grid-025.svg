<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Define grid parameters -->
  <!-- 3 rows, 5 columns, total 15 circles -->
  <!-- Cell size: 200 / 15 ≈ 13.33 px -->
  <!-- Center spacing: 200 / 2 = 100 px -->
  
  <!-- Row 1 -->
  <circle cx="50" cy="100" r="10" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="100" cy="100" r="10" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="150" cy="100" r="10" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="200" cy="100" r="10" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="250" cy="100" r="10" fill="white" stroke="black" stroke-width="1"/>
  
  <!-- Row 2 -->
  <circle cx="50" cy="150" r="10" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="100" cy="150" r="10" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="150" cy="150" r="10" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="200" cy="150" r="10" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="250" cy="150" r="10" fill="white" stroke="black" stroke-width="1"/>
  
  <!-- Row 3 -->
  <circle cx="50" cy="200" r="10" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="100" cy="200" r="10" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="150" cy="200" r="10" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="200" cy="200" r="10" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="250" cy="200" r="10" fill="white" stroke="black" stroke-width="1"/>
</svg>