<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="white"/>
  
  <!-- Chart margins -->
  <rect x="60" y="20" width="280" height="260" fill="none" stroke="black" stroke-width="1"/>
  
  <!-- Y-axis line -->
  <line x1="60" y1="20" x2="60" y2="260" stroke="black" stroke-width="1"/>
  
  <!-- X-axis line -->
  <line x1="60" y1="260" x2="340" y2="260" stroke="black" stroke-width="1"/>
  
  <!-- Grid lines (optional for clarity) -->
  <line x1="60" y1="260" x2="340" y2="260" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="60" y1="220" x2="340" y2="220" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="60" y1="180" x2="340" y2="180" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="60" y1="140" x2="340" y2="140" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="60" y1="100" x2="340" y2="100" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="60" y1="60" x2="340" y2="60" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="60" y1="20" x2="340" y2="20" stroke="#e0e0e0" stroke-width="1"/>
  
  <!-- Bars -->
  <!-- Bar 1: Blue, height 40 -->
  <rect x="60" y="220" width="40" height="40" fill="blue"/>
  
  <!-- Bar 2: Blue, height 60 -->
  <rect x="120" y="180" width="40" height="60" fill="blue"/>
  
  <!-- Bar 3: Red, height 100 (tallest) -->
  <rect x="180" y="100" width="40" height="100" fill="red"/>
  
  <!-- Bar 4: Blue, height 80 -->
  <rect x="240" y="120" width="40" height="80" fill="blue"/>
  
  <!-- X-axis labels -->
  <text x="100" y="285" text-anchor="middle" font-size="12">1</text>
  <text x="180" y="285" text-anchor="middle" font-size="12">2</text>
  <text x="260" y="285" text-anchor="middle" font-size="12">3</text>
  <text x="340" y="285" text-anchor="middle" font-size="12">4</text>
  
  <!-- Y-axis labels -->
  <text x="50" y="240" text-anchor="end" font-size="12">0</text>
  <text x="50" y="200" text-anchor="end" font-size="12">40</text>
  <text x="50" y="160" text-anchor="end" font-size="12">80</text>
  <text x="50" y="120" text-anchor="end" font-size="12">120</text>
  <text x="50" y="80" text-anchor="end" font-size="12">160</text>
  <text x="50" y="40" text-anchor="end" font-size="12">200</text>
  <text x="50" y="20" text-anchor="end" font-size="12">240</text>
</svg>