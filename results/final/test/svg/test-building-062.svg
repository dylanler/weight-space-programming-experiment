<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Building outline -->
  <rect x="50" y="50" width="100" height="100" fill="#8B4513" stroke="#5D2906" stroke-width="2"/>
  
  <!-- Floor 1 -->
  <rect x="55" y="60" width="90" height="40" fill="#A0522D" stroke="#5D2906" stroke-width="2"/>
  
  <!-- Windows on floor 1 -->
  <rect x="65" y="70" width="20" height="30" fill="#87CEEB" stroke="#5D2906" stroke-width="2"/>
  <rect x="95" y="70" width="20" height="30" fill="#87CEEB" stroke="#5D2906" stroke-width="2"/>
  <rect x="65" y="90" width="20" height="30" fill="#87CEEB" stroke="#5D2906" stroke-width="2"/>
  <rect x="95" y="90" width="20" height="30" fill="#87CEEB" stroke="#5D2906" stroke-width="2"/>
  
  <!-- Floor 2 -->
  <rect x="55" y="110" width="90" height="40" fill="#A0522D" stroke="#5D2906" stroke-width="2"/>
  
  <!-- Windows on floor 2 -->
  <rect x="65" y="120" width="20" height="30" fill="#87CEEB" stroke="#5D2906" stroke-width="2"/>
  <rect x="95" y="120" width="20" height="30" fill="#87CEEB" stroke="#5D2906" stroke-width="2"/>
  <rect x="65" y="140" width="20" height="30" fill="#87CEEB" stroke="#5D2906" stroke-width="2"/>
  <rect x="95" y="140" width="20" height="30" fill="#87CEEB" stroke="#5D2906" stroke-width="2"/>
</svg>