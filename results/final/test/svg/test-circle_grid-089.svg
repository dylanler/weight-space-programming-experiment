<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Define grid parameters -->
  <!-- 3x3 grid, 200x200 viewBox, spacing 50px, circle radius 20px -->
  <!-- Row 1 -->
  <circle cx="50" cy="50" r="20" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="100" cy="50" r="20" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="150" cy="50" r="20" fill="white" stroke="black" stroke-width="1"/>
  <!-- Row 2 -->
  <circle cx="50" cy="100" r="20" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="100" cy="100" r="20" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="150" cy="100" r="20" fill="white" stroke="black" stroke-width="1"/>
  <!-- Row 3 -->
  <circle cx="50" cy="150" r="20" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="100" cy="150" r="20" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="150" cy="150" r="20" fill="white" stroke="black" stroke-width="1"/>
</svg>