<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Define the chart area -->
  <defs>
    <style>
      .bar { fill: blue; }
      .tall-bar { fill: red; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect x="0" y="0" width="400" height="300" fill="white"/>
  
  <!-- Y-axis -->
  <line x1="60" y1="30" x2="60" y2="270" stroke="black" stroke-width="2"/>
  
  <!-- X-axis -->
  <line x1="60" y1="270" x2="380" y2="270" stroke="black" stroke-width="2"/>
  
  <!-- X-axis ticks and labels -->
  <line x1="60" y1="270" x2="60" y2="280" stroke="black" stroke-width="1"/>
  <text x="60" y="295" text-anchor="middle" font-size="12">1</text>
  
  <line x1="140" y1="270" x2="140" y2="280" stroke="black" stroke-width="1"/>
  <text x="140" y="295" text-anchor="middle" font-size="12">2</text>
  
  <line x1="220" y1="270" x2="220" y2="280" stroke="black" stroke-width="1"/>
  <text x="220" y="295" text-anchor="middle" font-size="12">3</text>
  
  <line x1="300" y1="270" x2="300" y2="280" stroke="black" stroke-width="1"/>
  <text x="300" y="295" text-anchor="middle" font-size="12">4</text>
  
  <line x1="380" y1="270" x2="380" y2="280" stroke="black" stroke-width="1"/>
  <text x="380" y="295" text-anchor="middle" font-size="12">5</text>
  
  <!-- Bars -->
  <!-- Bar 1 -->
  <rect x="60" y="240" width="40" height="30" class="bar"/>
  
  <!-- Bar 2 -->
  <rect x="140" y="240" width="40" height="30" class="bar"/>
  
  <!-- Bar 3 -->
  <rect x="220" y="240" width="40" height="30" class="bar"/>
  
  <!-- Bar 4 -->
  <rect x="300" y="240" width="40" height="30" class="bar"/>
  
  <!-- Bar 5 -->
  <rect x="380" y="240" width="40" height="30" class="bar"/>
  
  <!-- Bar 6 (Tallest, Red) -->
  <rect x="60" y="180" width="40" height="90" class="tall-bar"/>
  
  <!-- Bar 7 -->
  <rect x="140" y="240" width="40" height="30" class="bar"/>
  
  <!-- Bar 8 -->
  <rect x="220" y="240" width="40" height="30" class="bar"/>
</svg>