<svg width="200" height="100" xmlns="http://www.w3.org/2000/svg">
  <!-- 6 columns, 1 row -->
  <!-- Column width = 200 / 6 ≈ 33.33, Row height = 100 / 1 = 100 -->
  <!-- Circles centered in each cell -->
  <!-- Cell centers: x = 33.33, 66.67, 100, 133.33, 166.67, 200; y = 50 -->
  
  <!-- Column 1 -->
  <circle cx="33.33" cy="50" r="15" fill="white" stroke="black" stroke-width="1"/>
  <!-- Column 2 -->
  <circle cx="66.67" cy="50" r="15" fill="white" stroke="black" stroke-width="1"/>
  <!-- Column 3 -->
  <circle cx="100" cy="50" r="15" fill="white" stroke="black" stroke-width="1"/>
  <!-- Column 4 -->
  <circle cx="133.33" cy="50" r="15" fill="white" stroke="black" stroke-width="1"/>
  <!-- Column 5 -->
  <circle cx="166.67" cy="50" r="15" fill="white" stroke="black" stroke-width="1"/>
  <!-- Column 6 -->
  <circle cx="200" cy="50" r="15" fill="white" stroke="black" stroke-width="1"/>
</svg>