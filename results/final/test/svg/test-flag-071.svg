<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="white"/>
  
  <!-- 5 Horizontal Stripes -->
  <rect x="0" y="0" width="600" height="80" fill="#006400"/>
  <rect x="0" y="160" width="600" height="80" fill="#009600"/>
  <rect x="0" y="240" width="600" height="80" fill="#008C00"/>
  <rect x="0" y="320" width="600" height="80" fill="#008C00"/>
  <rect x="0" y="400" width="600" height="80" fill="#008C00"/>
  
  <!-- 7 Stars (each 10x10, centered on stripe) -->
  <!-- Stripe 1 -->
  <g fill="#FFD700">
    <rect x="20" y="20" width="10" height="10" fill="#FFD700"/>
    <rect x="30" y="20" width="10" height="10" fill="#FFD700"/>
    <rect x="40" y="20" width="10" height="10" fill="#FFD700"/>
    <rect x="50" y="20" width="10" height="10" fill="#FFD700"/>
    <rect x="60" y="20" width="10" height="10" fill="#FFD700"/>
    <rect x="70" y="20" width="10" height="10" fill="#FFD700"/>
    <rect x="80" y="20" width="10" height="10" fill="#FFD700"/>
  </g>
  
  <!-- Stripe 2 -->
  <g fill="#FFD700">
    <rect x="20" y="140" width="10" height="10" fill="#FFD700"/>
    <rect x="30" y="140" width="10" height="10" fill="#FFD700"/>
    <rect x="40" y="140" width="10" height="10" fill="#FFD700"/>
    <rect x="50" y="140" width="10" height="10" fill="#FFD700"/>
    <rect x="60" y="140" width="10" height="10" fill="#FFD700"/>
    <rect x="70" y="140" width="10" height="10" fill="#FFD700"/>
    <rect x="80" y="140" width="10" height="10" fill="#FFD700"/>
  </g>
  
  <!-- Stripe 3 -->
  <g fill="#FFD700">
    <rect x="20" y="220" width="10" height="10" fill="#FFD700"/>
    <rect x="30" y="220" width="10" height="10" fill="#FFD700"/>
    <rect x="40" y="220" width="10" height="10" fill="#FFD700"/>
    <rect x="50" y="220" width="10" height="10" fill="#FFD700"/>
    <rect x="60" y="220" width="10" height="10" fill="#FFD700"/>
    <rect x="70" y="220" width="10" height="10" fill="#FFD700"/>
    <rect x="80" y="220" width="10" height="10" fill="#FFD700"/>
  </g>
  
  <!-- Stripe 4 -->
  <g fill="#FFD700">
    <rect x="20" y="300" width="10" height="10" fill="#FFD700"/>
    <rect x="30" y="300" width="10" height="10" fill="#FFD700"/>
    <rect x="40" y="300" width="10" height="10" fill="#FFD700"/>
    <rect x="50" y="300" width="10" height="10" fill="#FFD700"/>
    <rect x="60" y="300" width="10" height="10" fill="#FFD700"/>
    <rect x="70" y="300" width="10" height="10" fill="#FFD700"/>
    <rect x="80" y="300" width="10" height="10" fill="#FFD700"/>
  </g>
  
  <!-- Stripe 5 -->
  <g fill="#FFD700">
    <rect x="20" y="380" width="10" height="10" fill="#FFD700"/>
    <rect x="30" y="380" width="10" height="10" fill="#FFD700"/>
    <rect x="40" y="380" width="10" height="10" fill="#FFD700"/>
    <rect x="50" y="380" width="10" height="10" fill="#FFD700"/>
    <rect x="60" y="380" width="10" height="10" fill="#FFD700"/>
    <rect x="70" y="380" width="10" height="10" fill="#FFD700"/>
    <rect x="80" y="380" width="10" height="10" fill="#FFD700"/>
  </g>
</svg>