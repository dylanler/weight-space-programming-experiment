<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="200" fill="white"/>
  
  <!-- Top stripe (red) -->
  <rect x="0" y="0" width="300" height="100" fill="#b22234"/>
  
  <!-- Middle stripe (white) -->
  <rect x="0" y="100" width="300" height="50" fill="#ffffff"/>
  
  <!-- Bottom stripe (blue) -->
  <rect x="0" y="150" width="300" height="50" fill="#003399"/>
  
  <!-- Stars (4 stars, evenly spaced) -->
  <!-- Star 1 -->
  <polygon points="10,10 20,20 30,10 20,0 10,10" fill="#ffffff"/>
  <!-- Star 2 -->
  <polygon points="200,10 210,20 220,10 210,0 200,10" fill="#ffffff"/>
  <!-- Star 3 -->
  <polygon points="290,10 300,20 310,10 300,0 290,10" fill="#ffffff"/>
  <!-- Star 4 -->
  <polygon points="10,10 20,20 30,10 20,0 10,10" fill="#ffffff"/>
</svg>