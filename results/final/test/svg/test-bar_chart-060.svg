<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Define styles -->
  <style>
    .bar { fill: blue; }
    .tall-bar { fill: red; }
  </style>

  <!-- Background -->
  <rect x="0" y="0" width="400" height="300" fill="white"/>

  <!-- Bar positions (assuming equal width of 40px, starting at x=40) -->
  <!-- Bar 1: x=40, height=30 -->
  <rect x="40" y="270" width="40" height="30" class="bar"/>
  
  <!-- Bar 2: x=80, height=40 -->
  <rect x="80" y="260" width="40" height="40" class="bar"/>
  
  <!-- Bar 3: x=120, height=30 -->
  <rect x="120" y="270" width="40" height="30" class="bar"/>
  
  <!-- Bar 4: x=160, height=60 (tallest, red) -->
  <rect x="160" y="240" width="40" height="60" class="tall-bar"/>
  
  <!-- Bar 5: x=200, height=30 -->
  <rect x="200" y="270" width="40" height="30" class="bar"/>

  <!-- X-axis labels -->
  <text x="40" y="290" text-anchor="middle" font-size="12">1</text>
  <text x="80" y="290" text-anchor="middle" font-size="12">2</text>
  <text x="120" y="290" text-anchor="middle" font-size="12">3</text>
  <text x="160" y="290" text-anchor="middle" font-size="12">4</text>
  <text x="200" y="290" text-anchor="middle" font-size="12">5</text>

  <!-- Y-axis labels -->
  <text x="30" y="275" text-anchor="end" font-size="12">0</text>
  <text x="30" y="255" text-anchor="end" font-size="12">30</text>
  <text x="30" y="235" text-anchor="end" font-size="12">60</text>
  <text x="30" y="215" text-anchor="end" font-size="12">90</text>
  <text x="30" y="195" text-anchor="end" font-size="12">120</text>
</svg>