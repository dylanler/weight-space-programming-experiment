<svg width="200" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Building outline -->
  <rect x="50" y="50" width="100" height="200" fill="#8B4513" stroke="#5D2906" stroke-width="2"/>
  
  <!-- Floor 1 -->
  <rect x="55" y="100" width="90" height="40" fill="#A0522D" stroke="#5D2906" stroke-width="2"/>
  
  <!-- Floor 2 -->
  <rect x="55" y="140" width="90" height="40" fill="#A0522D" stroke="#5D2906" stroke-width="2"/>
  
  <!-- Floor 3 -->
  <rect x="55" y="180" width="90" height="40" fill="#A0522D" stroke="#5D2906" stroke-width="2"/>
  
  <!-- Floor 4 -->
  <rect x="55" y="220" width="90" height="40" fill="#A0522D" stroke="#5D2906" stroke-width="2"/>
  
  <!-- Floor 5 -->
  <rect x="55" y="260" width="90" height="40" fill="#A0522D" stroke="#5D2906" stroke-width="2"/>
  
  <!-- Windows: 1 total, 5 floors, 1 per floor -->
  <!-- Floor 1 -->
  <rect x="65" y="105" width="20" height="35" fill="#D2691E" stroke="#5D2906" stroke-width="2"/>
  <!-- Floor 2 -->
  <rect x="65" y="145" width="20" height="35" fill="#D2691E" stroke="#5D2906" stroke-width="2"/>
  <!-- Floor 3 -->
  <rect x="65" y="185" width="20" height="35" fill="#D2691E" stroke="#5D2906" stroke-width="2"/>
  <!-- Floor 4 -->
  <rect x="65" y="225" width="20" height="35" fill="#D2691E" stroke="#5D2906" stroke-width="2"/>
  <!-- Floor 5 -->
  <rect x="65" y="265" width="20" height="35" fill="#D2691E" stroke="#5D2906" stroke-width="2"/>
</svg>