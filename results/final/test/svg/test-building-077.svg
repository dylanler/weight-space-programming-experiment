<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Building outline -->
  <rect x="50" y="50" width="100" height="100" fill="#8B4513" stroke="#5D2906" stroke-width="2"/>
  
  <!-- Floor 1: 5 windows -->
  <rect x="60" y="70" width="20" height="20" fill="#A9A9A9" stroke="#5D2906" stroke-width="1"/>
  <rect x="80" y="70" width="20" height="20" fill="#A9A9A9" stroke="#5D2906" stroke-width="1"/>
  <rect x="100" y="70" width="20" height="20" fill="#A9A9A9" stroke="#5D2906" stroke-width="1"/>
  <rect x="120" y="70" width="20" height="20" fill="#A9A9A9" stroke="#5D2906" stroke-width="1"/>
  <rect x="140" y="70" width="20" height="20" fill="#A9A9A9" stroke="#5D2906" stroke-width="1"/>
  
  <!-- Floor 2: 5 windows -->
  <rect x="60" y="90" width="20" height="20" fill="#A9A9A9" stroke="#5D2906" stroke-width="1"/>
  <rect x="80" y="90" width="20" height="20" fill="#A9A9A9" stroke="#5D2906" stroke-width="1"/>
  <rect x="100" y="90" width="20" height="20" fill="#A9A9A9" stroke="#5D2906" stroke-width="1"/>
  <rect x="120" y="90" width="20" height="20" fill="#A9A9A9" stroke="#5D2906" stroke-width="1"/>
  <rect x="140" y="90" width="20" height="20" fill="#A9A9A9" stroke="#5D2906" stroke-width="1"/>
</svg>