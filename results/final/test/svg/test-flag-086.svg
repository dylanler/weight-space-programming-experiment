<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="200" fill="white"/>
  
  <!-- 8 Horizontal Stripes -->
  <rect x="0" y="0" width="300" height="25" fill="#003366"/>
  <rect x="0" y="50" width="300" height="25" fill="#006633"/>
  <rect x="0" y="100" width="300" height="25" fill="#336600"/>
  <rect x="0" y="150" width="300" height="25" fill="#663300"/>
  <rect x="0" y="200" width="300" height="25" fill="#006633"/>
  <rect x="0" y="250" width="300" height="25" fill="#336600"/>
  <rect x="0" y="300" width="300" height="25" fill="#663300"/>
  <rect x="0" y="350" width="300" height="25" fill="#003366"/>
  
  <!-- 8 Stars (each 15x15, centered on stripe) -->
  <!-- Stripe 1 -->
  <g transform="translate(15, 12.5)">
    <polygon points="0,-15 7.5,0 0,15 -7.5,0" fill="#FFD700"/>
  </g>
  <!-- Stripe 2 -->
  <g transform="translate(15, 62.5)">
    <polygon points="0,-15 7.5,0 0,15 -7.5,0" fill="#FFD700"/>
  </g>
  <!-- Stripe 3 -->
  <g transform="translate(15, 112.5)">
    <polygon points="0,-15 7.5,0 0,15 -7.5,0" fill="#FFD700"/>
  </g>
  <!-- Stripe 4 -->
  <g transform="translate(15, 162.5)">
    <polygon points="0,-15 7.5,0 0,15 -7.5,0" fill="#FFD700"/>
  </g>
  <!-- Stripe 5 -->
  <g transform="translate(15, 212.5)">
    <polygon points="0,-15 7.5,0 0,15 -7.5,0" fill="#FFD700"/>
  </g>
  <!-- Stripe 6 -->
  <g transform="translate(15, 262.5)">
    <polygon points="0,-15 7.5,0 0,15 -7.5,0" fill="#FFD700"/>
  </g>
  <!-- Stripe 7 -->
  <g transform="translate(15, 312.5)">
    <polygon points="0,-15 7.5,0 0,15 -7.5,0" fill="#FFD700"/>
  </g>
  <!-- Stripe 8 -->
  <g transform="translate(15, 362.5)">
    <polygon points="0,-15 7.5,0 0,15 -7.5,0" fill="#FFD700"/>
  </g>
</svg>