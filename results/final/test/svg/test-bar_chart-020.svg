<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="white"/>
  
  <!-- Chart margins and grid -->
  <rect x="60" y="60" width="280" height="180" fill="none" stroke="#e0e0e0" stroke-dasharray="2,2"/>
  
  <!-- Y-axis labels and ticks -->
  <line x1="60" y1="60" x2="60" y2="180" stroke="#333"/>
  <line x1="120" y1="60" x2="120" y2="180" stroke="#333"/>
  <line x1="180" y1="60" x2="180" y2="180" stroke="#333"/>
  <line x1="240" y1="60" x2="240" y2="180" stroke="#333"/>
  <line x1="300" y1="60" x2="300" y2="180" stroke="#333"/>
  
  <!-- X-axis labels -->
  <text x="60" y="220" text-anchor="middle" font-size="12">1</text>
  <text x="120" y="220" text-anchor="middle" font-size="12">2</text>
  <text x="180" y="220" text-anchor="middle" font-size="12">3</text>
  <text x="240" y="220" text-anchor="middle" font-size="12">4</text>
  <text x="300" y="220" text-anchor="middle" font-size="12">5</text>
  <text x="360" y="220" text-anchor="middle" font-size="12">6</text>
  <text x="420" y="220" text-anchor="middle" font-size="12">7</text>
  <text x="480" y="220" text-anchor="middle" font-size="12">8</text>
  
  <!-- Bars -->
  <!-- Bar 1: height 40 -->
  <rect x="60" y="120" width="40" height="40" fill="#1e90ff"/>
  <!-- Bar 2: height 50 -->
  <rect x="120" y="150" width="40" height="50" fill="#1e90ff"/>
  <!-- Bar 3: height 30 -->
  <rect x="180" y="170" width="40" height="30" fill="#1e90ff"/>
  <!-- Bar 4: height 60 -->
  <rect x="240" y="140" width="40" height="60" fill="#1e90ff"/>
  <!-- Bar 5: height 40 -->
  <rect x="300" y="120" width="40" height="40" fill="#1e90ff"/>
  <!-- Bar 6: height 50 -->
  <rect x="360" y="150" width="40" height="50" fill="#1e90ff"/>
  <!-- Bar 7: height 80 (tallest, red) -->
  <rect x="420" y="100" width="40" height="80" fill="#ff0000"/>
  <!-- Bar 8: height 40 -->
  <rect x="480" y="120" width="40" height="40" fill="#1e90ff"/>
</svg>