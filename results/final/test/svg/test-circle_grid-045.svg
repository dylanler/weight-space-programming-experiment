<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Define grid parameters -->
  <!-- 3 rows, 2 columns, total 6 circles -->
  <!-- Row 1: y = 100, x = 50, 100 -->
  <!-- Row 2: y = 150, x = 50, 100 -->
  <!-- Row 3: y = 200, x = 50, 100 -->
  
  <!-- Row 1 -->
  <circle cx="50" cy="100" r="15" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="100" cy="100" r="15" fill="white" stroke="black" stroke-width="1"/>
  
  <!-- Row 2 -->
  <circle cx="50" cy="150" r="15" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="100" cy="150" r="15" fill="white" stroke="black" stroke-width="1"/>
  
  <!-- Row 3 -->
  <circle cx="50" cy="200" r="15" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="100" cy="200" r="15" fill="white" stroke="black" stroke-width="1"/>
</svg>