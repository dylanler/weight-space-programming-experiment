<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="white"/>
  
  <!-- Chart margins -->
  <rect x="60" y="60" width="280" height="180" fill="white"/>
  
  <!-- Grid lines (optional for clarity) -->
  <line x1="60" y1="60" x2="340" y2="60" stroke="black" stroke-width="1"/>
  <line x1="60" y1="120" x2="340" y2="120" stroke="black" stroke-width="1"/>
  <line x1="60" y1="180" x2="340" y2="180" stroke="black" stroke-width="1"/>
  
  <!-- Bar definitions -->
  <!-- Bar 1: Blue, height 40 -->
  <rect x="60" y="140" width="40" height="40" fill="blue"/>
  
  <!-- Bar 2: Red, height 80 (tallest) -->
  <rect x="120" y="100" width="40" height="80" fill="red"/>
  
  <!-- Bar 3: Blue, height 40 -->
  <rect x="180" y="140" width="40" height="40" fill="blue"/>
  
  <!-- X-axis labels -->
  <text x="100" y="200" text-anchor="middle" font-size="12">1</text>
  <text x="200" y="200" text-anchor="middle" font-size="12">2</text>
  <text x="300" y="200" text-anchor="middle" font-size="12">3</text>
  
  <!-- Y-axis label -->
  <text x="20" y="160" text-anchor="middle" font-size="12" transform="rotate(-90 20 160)">Value</text>
</svg>