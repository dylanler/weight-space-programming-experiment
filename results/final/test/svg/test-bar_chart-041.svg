<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="400" height="300" fill="white"/>
  
  <!-- Chart margins -->
  <!-- Left margin: 60, Right margin: 20, Top margin: 20, Bottom margin: 60 -->
  <!-- Chart area: x from 60 to 380, y from 20 to 240 -->
  
  <!-- Bar width and spacing -->
  <!-- 8 bars, each 40px wide, 20px gap between bars -->
  <!-- Bar 1: x=60, y=200, height=40 -->
  <!-- Bar 2: x=100, y=200, height=40 -->
  <!-- Bar 3: x=140, y=200, height=40 -->
  <!-- Bar 4: x=180, y=200, height=40 -->
  <!-- Bar 5: x=220, y=200, height=40 -->
  <!-- Bar 6: x=260, y=200, height=40 -->
  <!-- Bar 7: x=300, y=200, height=80 (tallest, red) -->
  <!-- Bar 8: x=340, y=200, height=40 -->
  
  <!-- Define styles -->
  <style>
    .bar { fill: blue; }
    .tall-bar { fill: red; }
  </style>
  
  <!-- Bar 1 -->
  <rect x="60" y="200" width="40" height="40" class="bar"/>
  
  <!-- Bar 2 -->
  <rect x="100" y="200" width="40" height="40" class="bar"/>
  
  <!-- Bar 3 -->
  <rect x="140" y="200" width="40" height="40" class="bar"/>
  
  <!-- Bar 4 -->
  <rect x="180" y="200" width="40" height="40" class="bar"/>
  
  <!-- Bar 5 -->
  <rect x="220" y="200" width="40" height="40" class="bar"/>
  
  <!-- Bar 6 -->
  <rect x="260" y="200" width="40" height="40" class="bar"/>
  
  <!-- Bar 7 (Tallest, Red) -->
  <rect x="300" y="200" width="40" height="80" class="tall-bar"/>
  
  <!-- Bar 8 -->
  <rect x="340" y="200" width="40" height="40" class="bar"/>
</svg>