<svg width="200" height="150" xmlns="http://www.w3.org/2000/svg">
  <!-- Building outline -->
  <rect x="50" y="20" width="100" height="120" fill="#8B4513" stroke="#5D2906" stroke-width="2"/>
  
  <!-- Floor 1: 10 windows -->
  <!-- Left side -->
  <rect x="60" y="30" width="10" height="20" fill="#A9A9A9"/>
  <rect x="70" y="30" width="10" height="20" fill="#A9A9A9"/>
  <rect x="80" y="30" width="10" height="20" fill="#A9A9A9"/>
  <rect x="90" y="30" width="10" height="20" fill="#A9A9A9"/>
  <rect x="100" y="30" width="10" height="20" fill="#A9A9A9"/>
  <!-- Right side -->
  <rect x="110" y="30" width="10" height="20" fill="#A9A9A9"/>
  <rect x="120" y="30" width="10" height="20" fill="#A9A9A9"/>
  <rect x="130" y="30" width="10" height="20" fill="#A9A9A9"/>
  <rect x="140" y="30" width="10" height="20" fill="#A9A9A9"/>
  <rect x="150" y="30" width="10" height="20" fill="#A9A9A9"/>
  
  <!-- Floor 2: 10 windows -->
  <!-- Left side -->
  <rect x="60" y="60" width="10" height="20" fill="#A9A9A9"/>
  <rect x="70" y="60" width="10" height="20" fill="#A9A9A9"/>
  <rect x="80" y="60" width="10" height="20" fill="#A9A9A9"/>
  <rect x="90" y="60" width="10" height="20" fill="#A9A9A9"/>
  <rect x="100" y="60" width="10" height="20" fill="#A9A9A9"/>
  <!-- Right side -->
  <rect x="110" y="60" width="10" height="20" fill="#A9A9A9"/>
  <rect x="120" y="60" width="10" height="20" fill="#A9A9A9"/>
  <rect x="130" y="60" width="10" height="20" fill="#A9A9A9"/>
  <rect x="140" y="60" width="10" height="20" fill="#A9A9A9"/>
  <rect x="150" y="60" width="10" height="20" fill="#A9A9A9"/>
</svg>