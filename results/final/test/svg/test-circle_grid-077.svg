<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Define grid parameters -->
  <!-- 3 rows, 5 columns, total 15 circles -->
  <!-- Cell size: 200 / 15 ≈ 13.33 px -->
  
  <!-- Row 1 -->
  <circle cx="25" cy="25" r="8" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="50" cy="25" r="8" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="75" cy="25" r="8" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="100" cy="25" r="8" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="125" cy="25" r="8" fill="white" stroke="black" stroke-width="1"/>
  
  <!-- Row 2 -->
  <circle cx="25" cy="50" r="8" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="50" cy="50" r="8" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="75" cy="50" r="8" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="100" cy="50" r="8" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="125" cy="50" r="8" fill="white" stroke="black" stroke-width="1"/>
  
  <!-- Row 3 -->
  <circle cx="25" cy="75" r="8" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="50" cy="75" r="8" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="75" cy="75" r="8" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="100" cy="75" r="8" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="125" cy="75" r="8" fill="white" stroke="black" stroke-width="1"/>
</svg>