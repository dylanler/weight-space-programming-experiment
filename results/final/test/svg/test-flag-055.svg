<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="200" fill="white"/>
  
  <!-- Top stripe (red) -->
  <rect x="0" y="0" width="300" height="60" fill="#b22234"/>
  
  <!-- Middle stripe (white) -->
  <rect x="0" y="60" width="300" height="60" fill="#ffffff"/>
  
  <!-- Bottom stripe (blue) -->
  <rect x="0" y="120" width="300" height="60" fill="#003399"/>
  
  <!-- Stars (5 stars, evenly distributed) -->
  <!-- Star 1: Top stripe -->
  <polygon points="150,10 155,15 160,20 165,15 160,10 155,5" fill="#ffffff"/>
  
  <!-- Star 2: Middle stripe -->
  <polygon points="150,120 155,125 160,130 165,125 160,120 155,115" fill="#ffffff"/>
  
  <!-- Star 3: Bottom stripe -->
  <polygon points="150,140 155,145 160,150 165,145 160,140 155,135" fill="#ffffff"/>
  
  <!-- Star 4: Top stripe -->
  <polygon points="150,10 155,15 160,20 165,15 160,10 155,5" fill="#ffffff"/>
  
  <!-- Star 5: Middle stripe -->
  <polygon points="150,120 155,125 160,130 165,125 160,120 155,115" fill="#ffffff"/>
</svg>