<svg width="400" height="500" xmlns="http://www.w3.org/2000/svg">
  <!-- Building outline -->
  <rect x="100" y="50" width="200" height="400" fill="#8B4513" stroke="#5D2906" stroke-width="2"/>
  
  <!-- Floor 1 -->
  <rect x="110" y="100" width="180" height="60" fill="#A0522D" stroke="#5D2906" stroke-width="1"/>
  <!-- 4 windows on floor 1 -->
  <rect x="120" y="110" width="20" height="40" fill="#D2691E"/>
  <rect x="150" y="110" width="20" height="40" fill="#D2691E"/>
  <rect x="180" y="110" width="20" height="40" fill="#D2691E"/>
  <rect x="210" y="110" width="20" height="40" fill="#D2691E"/>
  
  <!-- Floor 2 -->
  <rect x="110" y="160" width="180" height="60" fill="#A0522D" stroke="#5D2906" stroke-width="1"/>
  <!-- 4 windows on floor 2 -->
  <rect x="120" y="170" width="20" height="40" fill="#D2691E"/>
  <rect x="150" y="170" width="20" height="40" fill="#D2691E"/>
  <rect x="180" y="170" width="20" height="40" fill="#D2691E"/>
  <rect x="210" y="170" width="20" height="40" fill="#D2691E"/>
  
  <!-- Floor 3 -->
  <rect x="110" y="220" width="180" height="60" fill="#A0522D" stroke="#5D2906" stroke-width="1"/>
  <!-- 4 windows on floor 3 -->
  <rect x="120" y="230" width="20" height="40" fill="#D2691E"/>
  <rect x="150" y="230" width="20" height="40" fill="#D2691E"/>
  <rect x="180" y="230" width="20" height="40" fill="#D2691E"/>
  <rect x="210" y="230" width="20" height="40" fill="#D2691E"/>
  
  <!-- Floor 4 -->
  <rect x="110" y="280" width="180" height="60" fill="#A0522D" stroke="#5D2906" stroke-width="1"/>
  <!-- 4 windows on floor 4 -->
  <rect x="120" y="290" width="20" height="40" fill="#D2691E"/>
  <rect x="150" y="290" width="20" height="40" fill="#D2691E"/>
  <rect x="180" y="290" width="20" height="40" fill="#D2691E"/>
  <rect x="210" y="290" width="20" height="40" fill="#D2691E"/>
</svg>