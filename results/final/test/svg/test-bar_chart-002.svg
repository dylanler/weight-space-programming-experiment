<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="white"/>
  
  <!-- Chart margins -->
  <rect x="60" y="20" width="280" height="260" fill="none" stroke="black" stroke-width="1"/>
  
  <!-- Y-axis labels -->
  <text x="50" y="25" text-anchor="end" font-size="12">0</text>
  <text x="50" y="65" text-anchor="end" font-size="12">50</text>
  <text x="50" y="105" text-anchor="end" font-size="12">100</text>
  <text x="50" y="145" text-anchor="end" font-size="12">150</text>
  <text x="50" y="185" text-anchor="end" font-size="12">200</text>
  <text x="50" y="225" text-anchor="end" font-size="12">250</text>
  <text x="50" y="265" text-anchor="end" font-size="12">300</text>
  
  <!-- X-axis labels -->
  <text x="100" y="290" text-anchor="middle" font-size="12">1</text>
  <text x="160" y="290" text-anchor="middle" font-size="12">2</text>
  <text x="220" y="290" text-anchor="middle" font-size="12">3</text>
  <text x="280" y="290" text-anchor="middle" font-size="12">4</text>
  <text x="340" y="290" text-anchor="middle" font-size="12">5</text>
  <text x="400" y="290" text-anchor="middle" font-size="12">6</text>
  <text x="460" y="290" text-anchor="middle" font-size="12">7</text>
  <text x="520" y="290" text-anchor="middle" font-size="12">8</text>
  
  <!-- Bars -->
  <!-- Bar 1: height 40 -->
  <rect x="60" y="120" width="40" height="40" fill="blue"/>
  
  <!-- Bar 2: height 60 -->
  <rect x="120" y="140" width="40" height="60" fill="blue"/>
  
  <!-- Bar 3: height 80 -->
  <rect x="180" y="160" width="40" height="80" fill="blue"/>
  
  <!-- Bar 4: height 100 -->
  <rect x="240" y="180" width="40" height="100" fill="blue"/>
  
  <!-- Bar 5: height 120 -->
  <rect x="300" y="200" width="40" height="120" fill="blue"/>
  
  <!-- Bar 6: height 140 -->
  <rect x="360" y="220" width="40" height="140" fill="blue"/>
  
  <!-- Bar 7: height 160 -->
  <rect x="420" y="240" width="40" height="160" fill="blue"/>
  
  <!-- Bar 8: height 200 (tallest, red) -->
  <rect x="480" y="100" width="40" height="200" fill="red"/>
</svg>