<svg width="200" height="100" xmlns="http://www.w3.org/2000/svg">
  <!-- 5 columns, 1 row -->
  <!-- Circles centered in each cell: cell width = 40, cell height = 20 -->
  <!-- Circle radius = 10, centered at (20, 50), (60, 50), (100, 50), (140, 50), (180, 50) -->
  <circle cx="20" cy="50" r="10" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="60" cy="50" r="10" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="100" cy="50" r="10" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="140" cy="50" r="10" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="180" cy="50" r="10" fill="white" stroke="black" stroke-width="1"/>
</svg>