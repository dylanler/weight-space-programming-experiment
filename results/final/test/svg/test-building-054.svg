  <!-- Windows on Floor 2 -->
  <rect x="120" y="165" width="20" height="55" fill="#87CEEB" stroke="#000080" stroke-width="1"/>
  <rect x="140" y="165" width="20" height="55" fill="#87CEEB" stroke="#000080" stroke-width="1"/>
  <rect x="160" y="165" width="20" height="55" fill="#87CEEB" stroke="#000080" stroke-width="1"/>
  <rect x="180" y="165" width="20" height="55" fill="#87CEEB" stroke="#000080" stroke-width="1"/>
  
  <!-- Windows on Floor 3 -->
  <rect x="120" y="225" width="20" height="55" fill="#87CEEB" stroke="#000080" stroke-width="1"/>
  <rect x="140" y="225" width="20" height="55" fill="#87CEEB" stroke="#000080" stroke-width="1"/>
  <rect x="160" y="225" width="20" height="55" fill="#87CEEB" stroke="#000080" stroke-width="1"/>
  <rect x="180" y="225" width="20" height="55" fill="#87CEEB" stroke="#000080" stroke-width="1"/>
  
  <!-- Windows on Floor 4 -->
  <rect x="120" y="285" width="20" height="55" fill="#87CEEB" stroke="#000080" stroke-width="1"/>
  <rect x="140" y="285" width="20" height="55" fill="#87CEEB" stroke="#000080" stroke-width="1"/>
