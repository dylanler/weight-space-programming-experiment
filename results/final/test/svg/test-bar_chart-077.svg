<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="400" height="300" fill="white"/>
  
  <!-- Chart margins and grid -->
  <rect x="60" y="60" width="280" height="180" fill="none" stroke="#e0e0e0" stroke-dasharray="2,2"/>
  
  <!-- Y-axis labels and ticks -->
  <line x1="60" y1="60" x2="60" y2="180" stroke="#333"/>
  <text x="50" y="185" text-anchor="end" font-size="12">0</text>
  <line x1="60" y1="120" x2="60" y2="180" stroke="#333"/>
  <text x="50" y="185" text-anchor="end" font-size="12">50</text>
  <line x1="60" y1="80" x2="60" y2="180" stroke="#333"/>
  <text x="50" y="185" text-anchor="end" font-size="12">100</text>
  <line x1="60" y1="40" x2="60" y2="180" stroke="#333"/>
  <text x="50" y="185" text-anchor="end" font-size="12">150</text>
  <line x1="60" y1="0" x2="60" y2="180" stroke="#333"/>
  <text x="50" y="185" text-anchor="end" font-size="12">200</text>
  
  <!-- X-axis labels -->
  <line x1="60" y1="180" x2="120" y2="180" stroke="#333"/>
  <text x="110" y="185" text-anchor="middle" font-size="12">1</text>
  <line x1="120" y1="180" x2="180" y2="180" stroke="#333"/>
  <text x="170" y="185" text-anchor="middle" font-size="12">2</text>
  <line x1="180" y1="180" x2="240" y2="180" stroke="#333"/>
  <text x="230" y="185" text-anchor="middle" font-size="12">3</text>
  <line x1="240" y1="180" x2="300" y2="180" stroke="#333"/>
  <text x="290" y="185" text-anchor="middle" font-size="12">4</text>
  <line x1="300" y1="180" x2="360" y2="180" stroke="#333"/>
  <text x="350" y="185" text-anchor="middle" font-size="12">5</text>
  
  <!-- Bars -->
  <!-- Bar 1: height 40 -->
  <rect x="60" y="140" width="40" height="40" fill="#1e90ff"/>
  <!-- Bar 2: height 200 (tallest, red) -->
  <rect x="120" y="0" width="40" height="200" fill="#ff0000"/>
  <!-- Bar 3: height 60 -->
  <rect x="180" y="120" width="40" height="60" fill="#1e90ff"/>
  <!-- Bar 4: height 100 -->
  <rect x="240" y="80" width="40" height="100" fill="#1e90ff"/>
  <!-- Bar 5: height 140 -->
  <rect x="300" y="60" width="40" height="140" fill="#1e90ff"/>
  <!-- Bar 6: height 80 -->
  <rect x="360" y="100" width="40" height="80" fill="#1e90ff"/>
  <!-- Bar 7: height 120 -->
  <rect x="420" y="60" width="40" height="120" fill="#1e90ff"/>
  <!-- Bar 8: height 160 -->
  <rect x="480" y="40" width="40" height="160" fill="#1e90ff"/>
</svg>