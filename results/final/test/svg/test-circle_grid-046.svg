<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Define grid parameters -->
  <!-- 4 rows, 5 columns, total 20 circles -->
  <!-- Cell size: 200 / 20 = 10px -->
  <!-- Center of each circle: x = 5 + i*10, y = 5 + j*10 -->
  
  <!-- Row 1 -->
  <circle cx="5" cy="5" r="6" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="15" cy="5" r="6" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="25" cy="5" r="6" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="35" cy="5" r="6" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="45" cy="5" r="6" fill="white" stroke="black" stroke-width="1"/>
  
  <!-- Row 2 -->
  <circle cx="5" cy="15" r="6" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="15" cy="15" r="6" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="25" cy="15" r="6" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="35" cy="15" r="6" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="45" cy="15" r="6" fill="white" stroke="black" stroke-width="1"/>
  
  <!-- Row 3 -->
  <circle cx="5" cy="25" r="6" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="15" cy="25" r="6" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="25" cy="25" r="6" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="35" cy="25" r="6" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="45" cy="25" r="6" fill="white" stroke="black" stroke-width="1"/>
  
  <!-- Row 4 -->
  <circle cx="5" cy="35" r="6" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="15" cy="35" r="6" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="25" cy="35" r="6" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="35" cy="35" r="6" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="45" cy="35" r="6" fill="white" stroke="black" stroke-width="1"/>
</svg>