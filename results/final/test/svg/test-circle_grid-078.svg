<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Define grid parameters -->
  <!-- 3 rows, 4 columns, total 12 circles -->
  <!-- Cell size: 200 / 12 ≈ 16.67, but let's use 20 for clean spacing -->
  <!-- Row height: 200 / 3 ≈ 66.67, Column width: 200 / 4 = 50 -->
  
  <!-- Row 1 -->
  <circle cx="50" cy="100" r="10" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="100" cy="100" r="10" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="150" cy="100" r="10" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="200" cy="100" r="10" fill="white" stroke="black" stroke-width="1"/>
  
  <!-- Row 2 -->
  <circle cx="50" cy="166.67" r="10" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="100" cy="166.67" r="10" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="150" cy="166.67" r="10" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="200" cy="166.67" r="10" fill="white" stroke="black" stroke-width="1"/>
  
  <!-- Row 3 -->
  <circle cx="50" cy="233.33" r="10" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="100" cy="233.33" r="10" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="150" cy="233.33" r="10" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="200" cy="233.33" r="10" fill="white" stroke="black" stroke-width="1"/>
</svg>