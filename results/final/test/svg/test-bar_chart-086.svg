<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="400" height="300" fill="white"/>
  
  <!-- Chart margins -->
  <!-- Left margin: 60, Right margin: 20, Top margin: 40, Bottom margin: 60 -->
  <!-- Chart area: x from 60 to 380, y from 40 to 240 -->
  
  <!-- Bar 1: Blue, height 60 -->
  <rect x="60" y="240" width="80" height="60" fill="blue"/>
  
  <!-- Bar 2: Blue, height 100 -->
  <rect x="160" y="140" width="80" height="100" fill="blue"/>
  
  <!-- Bar 3: Red, height 180 (tallest) -->
  <rect x="260" y="20" width="80" height="180" fill="red"/>
  
  <!-- X-axis labels -->
  <text x="100" y="280" text-anchor="middle" font-size="12">1</text>
  <text x="220" y="280" text-anchor="middle" font-size="12">2</text>
  <text x="340" y="280" text-anchor="middle" font-size="12">3</text>
  
  <!-- Y-axis label -->
  <text x="20" y="140" text-anchor="middle" font-size="12" transform="rotate(-90, 20, 140)">Value</text>
</svg>