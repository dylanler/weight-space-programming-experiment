<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="200" fill="white"/>
  
  <!-- Top stripe (red) -->
  <rect x="0" y="0" width="300" height="60" fill="#b22234"/>
  
  <!-- Second stripe (white) -->
  <rect x="0" y="60" width="300" height="60" fill="#ffffff"/>
  
  <!-- Third stripe (blue) -->
  <rect x="0" y="120" width="300" height="60" fill="#003399"/>
  
  <!-- Bottom stripe (yellow) -->
  <rect x="0" y="180" width="300" height="40" fill="#ffd700"/>
  
  <!-- Stars -->
  <g fill="#003399">
    <circle cx="150" cy="30" r="4" stroke="black" stroke-width="1"/>
    <circle cx="150" cy="100" r="4" stroke="black" stroke-width="1"/>
    <circle cx="150" cy="170" r="4" stroke="black" stroke-width="1"/>
  </g>
</svg>