<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="white"/>
  
  <!-- Chart margins and grid -->
  <rect x="60" y="60" width="280" height="180" fill="none" stroke="#e0e0e0" stroke-dasharray="2,2"/>
  
  <!-- Y-axis labels -->
  <text x="50" y="100" text-anchor="end" font-size="12">0</text>
  <text x="50" y="160" text-anchor="end" font-size="12">50</text>
  <text x="50" y="220" text-anchor="end" font-size="12">100</text>
  <text x="50" y="280" text-anchor="end" font-size="12">150</text>
  
  <!-- X-axis labels -->
  <text x="120" y="290" text-anchor="middle" font-size="12">1</text>
  <text x="180" y="290" text-anchor="middle" font-size="12">2</text>
  <text x="240" y="290" text-anchor="middle" font-size="12">3</text>
  <text x="300" y="290" text-anchor="middle" font-size="12">4</text>
  <text x="360" y="290" text-anchor="middle" font-size="12">5</text>
  <text x="420" y="290" text-anchor="middle" font-size="12">6</text>
  
  <!-- Bars -->
  <!-- Bar 1: height 40 -->
  <rect x="60" y="120" width="40" height="40" fill="blue"/>
  
  <!-- Bar 2: height 60 -->
  <rect x="120" y="140" width="40" height="60" fill="blue"/>
  
  <!-- Bar 3: height 30 -->
  <rect x="180" y="170" width="40" height="30" fill="blue"/>
  
  <!-- Bar 4: height 80 -->
  <rect x="240" y="120" width="40" height="80" fill="blue"/>
  
  <!-- Bar 5: height 50 -->
  <rect x="300" y="150" width="40" height="50" fill="blue"/>
  
  <!-- Bar 6: height 120 (tallest, red) -->
  <rect x="360" y="90" width="40" height="120" fill="red"/>
  
  <!-- Bar 7: height 70 -->
  <rect x="420" y="130" width="40" height="70" fill="blue"/>
</svg>