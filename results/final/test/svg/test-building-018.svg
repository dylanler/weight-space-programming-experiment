  <!-- Floor 1 windows -->
  <rect x="115" y="90" width="20" height="40" fill="#696969" stroke="#5D2906" stroke-width="1"/>
  <rect x="145" y="90" width="20" height="40" fill="#696969" stroke="#5D2906" stroke-width="1"/>
