  <!-- Floor 2 windows -->
  <rect x="115" y="150" width="20" height="40" fill="#696969" stroke="#5D2906" stroke-width="1"/>
  <rect x="145" y="150" width="20" height="40" fill="#696969" stroke="#5D2906" stroke-width="1"/>
  <rect x="175" y="150" width="20" height="40" fill="#696969" stroke="#5D2906" stroke-width="1"/>
  <rect x="205" y="150" width="20" height="40" fill="#696969" stroke="#5D2906" stroke-width="1"/>
