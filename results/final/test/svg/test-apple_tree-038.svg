<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Tree trunk -->
  <rect x="140" y="100" width="20" height="100" fill="#8B4513" />
  
  <!-- Tree branches -->
  <line x1="140" y1="100" x2="120" y2="80" stroke="#5D4037" stroke-width="4" />
  <line x1="140" y1="100" x2="160" y2="120" stroke="#5D4037" stroke-width="4" />
  <line x1="140" y1="100" x2="180" y2="140" stroke="#5D4037" stroke-width="4" />
  
  <!-- Tree leaves (green) -->
  <polygon points="120,80 140,60 160,80 180,100" fill="#228B22" />
  <polygon points="160,120 180,140 200,160 180,180" fill="#228B22" />
  <polygon points="180,140 200,160 220,180 200,200" fill="#228B22" />
  <polygon points="120,80 140,60 160,80 140,100" fill="#228B22" />
  
  <!-- Apples (red) -->
  <circle cx="130" cy="70" r="6" fill="#FF0000" />
  <circle cx="150" cy="110" r="6" fill="#FF0000" />
  <circle cx="170" cy="150" r="6" fill="#FF0000" />
  <circle cx="190" cy="190" r="6" fill="#FF0000" />
</svg>