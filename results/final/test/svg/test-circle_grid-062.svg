<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- 5 rows, 3 columns -->
  <!-- Row 1 -->
  <circle cx="50" cy="50" r="15" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="100" cy="50" r="15" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="150" cy="50" r="15" fill="white" stroke="black" stroke-width="1"/>
  <!-- Row 2 -->
  <circle cx="50" cy="100" r="15" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="100" cy="100" r="15" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="150" cy="100" r="15" fill="white" stroke="black" stroke-width="1"/>
  <!-- Row 3 -->
  <circle cx="50" cy="150" r="15" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="100" cy="150" r="15" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="150" cy="150" r="15" fill="white" stroke="black" stroke-width="1"/>
  <!-- Row 4 -->
  <circle cx="50" cy="200" r="15" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="100" cy="200" r="15" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="150" cy="200" r="15" fill="white" stroke="black" stroke-width="1"/>
  <!-- Row 5 -->
  <circle cx="50" cy="250" r="15" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="100" cy="250" r="15" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="150" cy="250" r="15" fill="white" stroke="black" stroke-width="1"/>
</svg>