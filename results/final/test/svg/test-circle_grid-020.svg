<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Define grid parameters -->
  <!-- 3 rows, 6 columns, total 18 circles -->
  <!-- Cell size: 200 / 18 ≈ 11.11 px -->
  <!-- Center of each circle: (col * 20 + 10, row * 20 + 10) -->
  
  <!-- Row 1 -->
  <circle cx="10" cy="10" r="8" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="30" cy="10" r="8" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="50" cy="10" r="8" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="70" cy="10" r="8" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="90" cy="10" r="8" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="110" cy="10" r="8" fill="white" stroke="black" stroke-width="1"/>
  
  <!-- Row 2 -->
  <circle cx="10" cy="30" r="8" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="30" cy="30" r="8" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="50" cy="30" r="8" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="70" cy="30" r="8" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="90" cy="30" r="8" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="110" cy="30" r="8" fill="white" stroke="black" stroke-width="1"/>
  
  <!-- Row 3 -->
  <circle cx="10" cy="50" r="8" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="30" cy="50" r="8" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="50" cy="50" r="8" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="70" cy="50" r="8" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="90" cy="50" r="8" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="110" cy="50" r="8" fill="white" stroke="black" stroke-width="1"/>
</svg>