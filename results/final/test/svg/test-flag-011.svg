<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="200" fill="white"/>
  
  <!-- Top stripe (red) -->
  <rect x="0" y="0" width="300" height="60" fill="#b22234"/>
  
  <!-- Middle stripe (white) -->
  <rect x="0" y="60" width="300" height="60" fill="#ffffff"/>
  
  <!-- Bottom stripe (blue) -->
  <rect x="0" y="120" width="300" height="60" fill="#003399"/>
  
  <!-- Stars (7 total, evenly distributed) -->
  <!-- Top stripe: 2 stars -->
  <circle cx="150" cy="20" r="4" fill="#ffffff"/>
  <circle cx="225" cy="20" r="4" fill="#ffffff"/>
  
  <!-- Middle stripe: 2 stars -->
  <circle cx="150" cy="100" r="4" fill="#ffffff"/>
  <circle cx="225" cy="100" r="4" fill="#ffffff"/>
  
  <!-- Bottom stripe: 3 stars -->
  <circle cx="75" cy="160" r="4" fill="#ffffff"/>
  <circle cx="150" cy="160" r="4" fill="#ffffff"/>
  <circle cx="225" cy="160" r="4" fill="#ffffff"/>
</svg>