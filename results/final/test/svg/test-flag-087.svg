<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="200" fill="white"/>
  
  <!-- Top stripe (red) -->
  <rect x="0" y="0" width="300" height="50" fill="#b22234"/>
  
  <!-- Second stripe (white) -->
  <rect x="0" y="50" width="300" height="50" fill="#ffffff"/>
  
  <!-- Third stripe (blue) -->
  <rect x="0" y="100" width="300" height="50" fill="#003399"/>
  
  <!-- Bottom stripe (red) -->
  <rect x="0" y="150" width="300" height="50" fill="#b22234"/>
  
  <!-- Stars (8 total, evenly distributed) -->
  <!-- Row 1: 2 stars -->
  <circle cx="150" cy="25" r="4" fill="#ffffff"/>
  <circle cx="225" cy="25" r="4" fill="#ffffff"/>
  
  <!-- Row 2: 2 stars -->
  <circle cx="150" cy="55" r="4" fill="#ffffff"/>
  <circle cx="225" cy="55" r="4" fill="#ffffff"/>
  
  <!-- Row 3: 2 stars -->
  <circle cx="150" cy="85" r="4" fill="#ffffff"/>
  <circle cx="225" cy="85" r="4" fill="#ffffff"/>
  
  <!-- Row 4: 2 stars -->
  <circle cx="150" cy="115" r="4" fill="#ffffff"/>
  <circle cx="225" cy="115" r="4" fill="#ffffff"/>
</svg>