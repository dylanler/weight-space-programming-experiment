<svg width="200" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Building outline -->
  <rect x="50" y="50" width="100" height="200" fill="#8B4513" stroke="#5D2906" stroke-width="2"/>
  
  <!-- Floor 1 -->
  <rect x="55" y="80" width="90" height="40" fill="#A0522D" stroke="#5D2906" stroke-width="2"/>
  
  <!-- Floor 2 -->
  <rect x="55" y="120" width="90" height="40" fill="#A0522D" stroke="#5D2906" stroke-width="2"/>
  
  <!-- Windows on Floor 1 -->
  <rect x="65" y="90" width="20" height="20" fill="#87CEEB" stroke="#5D2906" stroke-width="2"/>
  <rect x="85" y="90" width="20" height="20" fill="#87CEEB" stroke="#5D2906" stroke-width="2"/>
  
  <!-- Windows on Floor 2 -->
  <rect x="65" y="130" width="20" height="20" fill="#87CEEB" stroke="#5D2906" stroke-width="2"/>
  <rect x="85" y="130" width="20" height="20" fill="#87CEEB" stroke="#5D2906" stroke-width="2"/>
</svg>